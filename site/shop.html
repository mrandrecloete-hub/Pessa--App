<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Order page</title><style>body{margin:0;background:#EEF4F1;color:#14261F;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}header{background:#0B4A38;color:#fff;padding:18px 16px}h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.9;font-size:14px}.w{max-width:760px;margin:0 auto;padding:12px 12px 120px}input,select,textarea{width:100%;box-sizing:border-box;font:inherit;padding:11px 12px;border:1px solid #CFE3D8;border-radius:10px;background:#fff}.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.chip{flex:0 0 auto;padding:7px 12px;border-radius:99px;border:1px solid #CFE3D8;background:#fff;font-size:14px;cursor:pointer}.chip.on{background:#0B7A5C;color:#fff;border-color:#0B7A5C}.it{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #D2E3DA;border-radius:12px;padding:10px 12px;margin:8px 0}.it .t{flex:1;min-width:0}.it b{display:block}.it small{color:#486}.pr{font-weight:700;white-space:nowrap}.q{display:flex;align-items:center;gap:6px}.q button{width:34px;height:34px;border-radius:10px;border:1px solid #0B7A5C;background:#fff;color:#0B7A5C;font-size:20px;line-height:1;cursor:pointer}.q span{min-width:22px;text-align:center;font-weight:700}.out{opacity:.55}.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #CFE3D8;padding:10px 12px}.bar button,.go{width:100%;padding:13px;border:0;border-radius:12px;background:#0B7A5C;color:#fff;font:inherit;font-weight:700;cursor:pointer}.sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:5}.sheet>div{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:16px}.sheet label{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}.ln{display:flex;justify-content:space-between;gap:8px;padding:4px 0}.muted{color:#486;font-size:13px}.foot{text-align:center;color:#486;font-size:12px;margin:18px 0}</style></head><body><header><h1 id="sn"></h1><p id="in"></p></header><div id="app" style="display:none"><div class="w"><input id="se" placeholder="Search" aria-label="Search"><div class="chips" id="chips"></div><div id="list"></div><p class="foot">Order page made with Pesa</p></div><div class="bar" id="bar" style="display:none"><button id="bt"></button></div><div class="sheet" id="sh"><div><h2 style="margin:0 0 6px">Your order</h2><div id="rv"></div><label>Your name</label><input id="nm" autocomplete="name"><label>Your phone number</label><input id="ph" type="tel" autocomplete="tel"><label>Collect or delivery</label><select id="hw"><option>Collect</option><option>Deliver</option></select><p class="muted" id="hn"></p><label>Address or note</label><textarea id="nt" rows="2"></textarea><p class="muted">Your order opens in WhatsApp. The shop confirms the price and stock and tells you how to pay.</p><button class="go" id="go" type="button">Send order on WhatsApp</button><p style="text-align:center"><a href="#" id="cl">Back to the list</a></p></div></div></div><script>var D=null,cart={},cat="",q="";function $(i){return document.getElementById(i)}function m(n){return "N$"+(Math.round(n*100)/100).toFixed(2)}function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}function cats(){var s={};D.rows.forEach(function(r){s[r.c||"Other"]=1});return Object.keys(s).sort()}function paintChips(){var h='<span class="chip'+(cat?"":" on")+'" data-c="">All</span>';cats().forEach(function(c){h+='<span class="chip'+(cat===c?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+"</span>"});$("chips").innerHTML=h;[].forEach.call($("chips").children,function(e){e.onclick=function(){cat=e.getAttribute("data-c");paintChips();paint()}})}function paint(){var h="";D.rows.forEach(function(r,i){if(cat&&(r.c||"Other")!==cat)return;if(q&&r.n.toLowerCase().indexOf(q)<0)return;var n=cart[r.id]||0;h+='<div class="it'+(r.s===0?" out":"")+'"><div class="t"><b>'+esc(r.n)+"</b><small>"+esc(r.c)+(r.s===1?" · running low":"")+(r.s===0?" · out of stock":"")+'</small></div><div class="pr">'+m(r.p)+"</div>"+(r.s===0?"":'<div class="q"><button data-i="'+i+'" data-d="-1">&minus;</button><span>'+n+'</span><button data-i="'+i+'" data-d="1">+</button></div>')+"</div>"});$("list").innerHTML=h||'<p class="muted">Nothing found.</p>';[].forEach.call($("list").querySelectorAll("button"),function(b){b.onclick=function(){var r=D.rows[b.getAttribute("data-i")],d=+b.getAttribute("data-d"),n=(cart[r.id]||0)+d;if(r.m!=null&&n>r.m){n=r.m}if(n<=0)delete cart[r.id];else cart[r.id]=n;paint();bar()}});bar()}function tot(){var t=0,c=0;D.rows.forEach(function(r){var n=cart[r.id]||0;t+=n*r.p;c+=n});return{t:t,c:c}}function bar(){var x=tot();$("bar").style.display=x.c?"block":"none";$("bt").textContent="Review order ("+x.c+" items) · "+m(x.t)}function review(){var h="";D.rows.forEach(function(r){var n=cart[r.id]||0;if(n)h+='<div class="ln"><span>'+n+" x "+esc(r.n)+"</span><span>"+m(n*r.p)+"</span></div>"});$("rv").innerHTML=h+'<div class="ln"><b>Total</b><b>'+m(tot().t)+"</b></div>";$("sh").style.display="block"}function send(){var x=tot();if(!x.c)return;var nm=$("nm").value.trim(),ph=$("ph").value.trim();if(!nm||!ph){alert("Please enter your name and phone number.");return}var L=["PESA ORDER","Shop: "+D.shop,"Name: "+nm,"Phone: "+ph,"Get it: "+$("hw").value,"Address or note: "+$("nt").value.trim(),"Items:"];D.rows.forEach(function(r){var n=cart[r.id]||0;if(n)L.push(n+" x "+r.n+" @ "+m(r.p)+" [#"+r.id+"]")});L.push("Total: "+m(x.t));window.open("https://wa.me/"+D.phone+"?text="+encodeURIComponent(L.join("\n")),"_blank")}function start(d){D=d;document.title=D.shop+" order page";$("sn").textContent=D.shop;$("in").textContent=D.intro||"Choose what you want, then send your order on WhatsApp.";$("se").oninput=function(){q=this.value.toLowerCase();paint()};$("bt").onclick=review;$("cl").onclick=function(){$("sh").style.display="none"};$("go").onclick=send;if(D.how)$("hn").textContent=D.how;$("app").style.display="block";paintChips();paint()}function fail(t){$("sn").textContent=t;$("in").textContent=""};(function(){var s=(new URLSearchParams(location.search).get("s")||"").toLowerCase();if(!s){fail("This page needs a shop name");return}$("sn").textContent="Loading";fetch(""+"?a=get&s="+encodeURIComponent(s)).then(function(r){return r.json().then(function(j){if(!r.ok||!j||!j.rows)throw 0;return j})}).then(start,function(){fail("This shop page was not found")})})();</script></body></html>
