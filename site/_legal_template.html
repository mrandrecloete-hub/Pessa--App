<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} | Pesa</title>
<link rel="icon" href="img/pesa-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F8F5;--surface:#fff;--fg:#0B241B;--muted:#47604F;--line:#D2E3DA;--accent-fg:#0B4A38;--gold:#C9962A;--deep:#082E22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#07130F;--surface:#0D1F18;--fg:#E6F1EB;--muted:#9DB5A9;--line:#1E3A2E;--accent-fg:#7FDCC3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07130F;--surface:#0D1F18;--fg:#E6F1EB;--muted:#9DB5A9;--line:#1E3A2E;--accent-fg:#7FDCC3;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.65 'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:var(--accent-fg)}
a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
header{background:linear-gradient(135deg,#0E6A50,#0B4A38 45%,#082E22);border-bottom:5px solid var(--gold);color:#F2F8F5;padding-block:18px}
.wrap{max-width:720px;margin-inline:auto;padding-inline:20px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#F2F8F5;text-decoration:none;font:700 20px 'Outfit',system-ui,sans-serif;letter-spacing:.14em}
.brand img{width:38px;height:38px;border-radius:10px}
header a.back{color:#B7D3C6;text-decoration:none;font-weight:500}
main{padding-block:44px 64px}
h1{font:700 clamp(32px,6vw,44px)/1.1 'Outfit',system-ui,sans-serif;margin:0 0 8px;text-wrap:balance}
.meta{color:var(--muted);font-size:15px;margin:0 0 26px}
.lead{font-size:19px;color:var(--muted)}
h2{font:600 22px/1.25 'Outfit',system-ui,sans-serif;margin:34px 0 8px;text-wrap:balance}
ul{margin:0;padding-left:22px}
li{margin-block:8px}
footer{border-top:1px solid var(--line);padding-block:26px;color:var(--muted);font-size:15px}
footer .wrap{display:flex;gap:8px 22px;flex-wrap:wrap}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="./"><img src="img/pesa-icon.png" alt="" width="38" height="38">PESA</a><a class="back" href="./">Back to pesa</a></div></header>
<main><div class="wrap">
<h1>{{TITLE}}</h1>
<p class="meta">Version {{VERSION}}. Updated {{UPDATED}}.</p>
{{BODY}}
</div></main>
<footer><div class="wrap"><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><a href="refunds.html">Refunds</a><a href="support.html">Support</a><span>Your Mula, Your Pride</span></div></footer>
</body>
</html>
