# Production stack: Caddy (HTTPS) -> web -> api -> PostgreSQL. Only Caddy is reachable from the internet.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nexus
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nexus"], interval: 5s, timeout: 5s, retries: 10 }
  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      # Lets the installed phone app (on-device version) call this server for cloud sync. Add other origins with commas.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://appassets.nexus.local}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    restart: unless-stopped
    depends_on: [api]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in .env}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [web]
volumes: { pgdata: {}, caddy_data: {}, caddy_config: {} }
