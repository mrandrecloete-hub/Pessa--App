plugins { id 'com.android.application' }
android {
    namespace 'na.nexus.app'
    compileSdk 34
    defaultConfig {
        applicationId 'na.nexus.app'
        minSdk 24; targetSdk 34
        versionCode 2; versionName '1.1.0-local'
        // Default server the app opens. Override: gradle assembleDebug -PserverUrl=https://your-host
        buildConfigField 'String', 'DEFAULT_SERVER', "\"${project.findProperty('serverUrl') ?: ''}\""
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Bundle the on-device web build (npm run build:local -w @nexus/web) into the app.
tasks.register('copyWeb', Copy) {
    from('../../web/out') { exclude 'sw.js' }
    into 'src/main/assets/www'
}
preBuild.dependsOn 'copyWeb'
