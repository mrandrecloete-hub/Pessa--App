       overridden at runtime (see applyBrandLogo()) with the shop's own
       uploaded logo once one is set, so the watermark — unlike the splash
       screen — always reflects whichever business is using the app. */
    --brand-logo-img: var(--logo-img);
    color-scheme: light;

    /* ---------- design tokens (shared across every screen/theme) ---------- */

    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
    --fs-caption:12px; --fs-small:13px; --fs-body:14.5px; --fs-card-heading:16px; --fs-section:14px; --fs-title:26px; --fs-financial:34px;
    --sidebar-w:264px;

  :root[data-theme="dark"]{
    --bg:#0F1613;
    --surface:#17211D;
    --surface-2:#1E2924;
    --surface-3:#263229;
    --text:#E7EEE9;

    --accent:#E8A83D;
    --accent-contrast:#241705;
    --danger:#E4886A;
    --danger-bg:#2D1B16;
    --success:#68C98C;
    --success-bg:#132A1C;

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  :root{ --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;
    letter-spacing:-0.01em;
    display:flex; justify-content:center;
  }
  .app{
    width:100%; max-width:480px; height:100vh; height:100dvh;
    background:var(--bg);
    display:flex; flex-direction:column;
    position:relative;
    isolation:isolate;
    overflow:hidden;
    /* transform (a harmless no-op here) makes .app the containing block for every
       position:fixed element inside it — the bottom nav, cart bar, FAB, toasts and
       sheets — so they anchor to THIS box's exact edges (sized with 100dvh, the
       real visible viewport) instead of the browser's "large viewport", which on
       mobile Chrome/Safari can be taller than what's actually on screen when the
       address bar is showing. Without this, a plain position:fixed;bottom:0 nav
       can render partly or fully below the visible fold on phones. */
    transform:translateZ(0);
  }
  /* Large, soft, "glassy" background watermark of the shop's logo (or the
     default Pesa mark), sitting behind the sidebar/topbar/content inside
     the app shell — see the #app-watermark note near <div class="app"> for
     why one shared element here covers every tab and sheet instead of each
     screen drawing its own. Kept faint and blurred so it never fights with
     text or buttons, and pointer-events:none keeps it from ever blocking a
     tap even though it already sits behind everything in paint order. */
  .app-watermark{
    position:absolute; inset:0; z-index:-1; pointer-events:none;
    overflow:hidden;
  }
  .app-watermark::before{
    content:""; position:absolute; left:50%; top:44%; width:380px; height:369px;
    margin-left:-190px; margin-top:-184.5px;
    background-image:var(--brand-logo-img); background-repeat:no-repeat; background-size:contain; background-position:center;
    opacity:0.055; filter:blur(0.6px); transform:rotate(-5deg);
    transition:opacity 0.3s ease;
  }
  /* A very soft light sheen over the mark for the "glass" feel — subtle in
     both themes, never enough to read as a shape of its own. */
  .app-watermark::after{
    content:""; position:absolute; inset:-25%;
    background:radial-gradient(circle at 50% 38%, rgba(255,255,255,0.5), rgba(255,255,255,0) 62%);
    opacity:0.4; mix-blend-mode:soft-light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .app-watermark::before{ opacity:0.1; }
    :root:not([data-theme="light"]) .app-watermark::after{ opacity:0.12; mix-blend-mode:overlay; }
  }
  :root[data-theme="dark"] .app-watermark::before{ opacity:0.1; }
  :root[data-theme="dark"] .app-watermark::after{ opacity:0.12; mix-blend-mode:overlay; }
  .brandmark{
    width:30px; height:30px; flex-shrink:0;
    background-image:var(--logo-img); background-repeat:no-repeat; background-size:contain; background-position:center;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,0.3));
  }
  h1,h2,h3,.display{ font-family:var(--font-sans); font-weight:700; letter-spacing:-0.02em; text-wrap:balance; margin:0; }
  .num{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; }

  /* ---------- header ---------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:linear-gradient(120deg, var(--primary) 0%, var(--primary-dim) 130%); color:var(--primary-contrast);
    padding:14px 16px 12px; display:flex; align-items:center; gap:10px;
    box-shadow: var(--shadow);
  }
  .topbar .shopmeta{ flex:1; min-width:0; }
  .topbar .shopname{ font-size:17px; font-weight:700; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .slogan{ font-size:11px; font-weight:600; font-style:italic; letter-spacing:0.01em; color:#F0C36A; line-height:1.2; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sidebar-head .slogan{ color:var(--accent); margin-top:2px; }
  .authbrand .slogan{ font-size:11px; }
  .topbar .shopdate{ font-size:11.5px; opacity:0.78; margin-top:1px; }
  .todaypill{
    background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.22);
    border-radius:999px; padding:6px 12px; text-align:right; flex-shrink:0;
  }
  .todaypill .lbl{ font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; opacity:0.75; }
  .todaypill .val{ font-size:14px; font-weight:600; }
  .icon-btn{
    width:34px; height:34px; border-radius:10px; border:1px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.1); color:var(--primary-contrast);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn:active{ background:rgba(255,255,255,0.2); }

  /* ---------- content ---------- */
  .content{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px calc(20px + env(safe-area-inset-bottom,0px)); }
  .section-title{ font-size:var(--fs-section); font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-muted); margin: 18px 2px 8px; display:flex; align-items:center; justify-content:space-between; }
  .section-title:first-child{ margin-top:2px; }
  .section-title .see-all{ font-size:11.5px; font-weight:600; color:var(--primary-dim); text-transform:none; letter-spacing:0; cursor:pointer; background:none; border:none; padding:0; font-family:inherit; }
  :root[data-theme="dark"] .section-title .see-all{ color:var(--primary); }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .section-title .see-all{ color:var(--primary); } }

  #content{ animation: contentIn 0.22s ease-out; }
  @keyframes contentIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ #content{ animation:none; } }

  /* ---------- dashboard: hero ---------- */
  .hero-card{
    position:relative; overflow:hidden; border-radius:14px; padding:13px 14px 10px;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
  }
  .hero-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .hero-lbl{ font-size:10.5px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.03em; }
  .hero-val{ font-size:20px; font-weight:700; font-family:var(--font-sans); letter-spacing:-0.02em; margin-top:3px; line-height:1.15; }
  .hero-delta{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; margin-top:6px; padding:2px 8px 2px 6px; border-radius:999px; background:rgba(46,125,79,0.12); color:var(--success); }
  .hero-delta.down{ background:rgba(179,58,44,0.12); color:var(--danger); }
  .hero-chart{ margin-top:4px; color:var(--primary); } .hero-chart svg{ max-height:38px; width:100%; }
  .hero-ticks{ display:flex; justify-content:space-between; margin-top:2px; padding:0 1px; }
  .hero-ticks span{ font-size:9.5px; color:var(--text-muted); font-weight:500; }

  .paysplit-label{ font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-muted); margin:16px 2px 8px; }
  .paysplit{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .paysplit .pt{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:13px 14px; }
  .paysplit .pt .l{ font-size:10.5px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.03em; line-height:1.3; }
  .paysplit .pt .v{ font-size:20px; font-weight:800; margin-top:3px; font-family:var(--font-sans); letter-spacing:-0.02em; }
  @media (min-width:420px){ .paysplit{ grid-template-columns:repeat(4,1fr); } }

  /* ---------- dashboard: quick actions ---------- */
  .qa-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px; }
  .qa-btn{
    display:flex; flex-direction:column; align-items:center; gap:7px; padding:12px 4px 10px;
    background:var(--surface); border:1px solid var(--border); border-radius:16px; cursor:pointer;
    color:var(--text); transition:transform 0.1s ease;
  }
  .qa-btn:active{ transform:scale(0.95); background:var(--surface-2); }
  .qa-ico{ width:36px; height:36px; border-radius:11px; background:var(--surface-3); color:var(--primary-dim); display:flex; align-items:center; justify-content:center; }
  :root[data-theme="dark"] .qa-ico{ color:var(--primary); }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .qa-ico{ color:var(--primary); } }
  .qa-btn .qa-lbl{ font-size:10.5px; font-weight:600; text-align:center; line-height:1.2; }

  /* ---------- dashboard: attention list ---------- */
  .att-row{ display:flex; align-items:center; gap:11px; padding:10px 2px; border-bottom:1px solid var(--border); cursor:pointer; }
  .att-row:last-child{ border-bottom:none; }
  .att-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--danger); }
  .att-dot.warn{ background:var(--accent); }
  .att-main{ flex:1; min-width:0; }
  .att-title{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .att-sub{ font-size:11.5px; color:var(--text-muted); }
  .att-val{ font-size:13px; font-weight:600; color:var(--danger); flex-shrink:0; }
  .all-clear{ display:flex; align-items:center; gap:10px; padding:6px 2px; color:var(--success); }
  .all-clear svg{ flex-shrink:0; }
  .all-clear span{ font-size:13.5px; font-weight:600; }

  .pressable:active{ transform:scale(0.98); }

  .searchbar{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:10px 12px; margin-bottom:12px;
  }
  .searchbar input{ border:none; outline:none; background:transparent; flex:1; font-size:14.5px; color:var(--text); min-width:0; }
  .searchbar svg{ flex-shrink:0; color:var(--text-muted); }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); }
  .pad{ padding:14px; }

  /* product grid */
  .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .pcard{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px;
    display:flex; flex-direction:column; gap:6px; cursor:pointer; text-align:left; position:relative;
    min-height:104px; transition:transform 0.1s ease;
  }
  .pcard:active{ background:var(--surface-2); transform:scale(0.97); }
  .pcard .pname{ font-size:13.5px; font-weight:600; line-height:1.25; }
  .pcard .pcat{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.03em; }
  .pcard .pprice{ margin-top:auto; font-size:15px; font-weight:600; color:var(--primary-dim); }
  :root[data-theme="dark"] .pcard .pprice, @media (prefers-color-scheme:dark){ .pcard .pprice{ color:var(--primary);} }
  .stockbadge{ position:absolute; top:10px; right:10px; font-size:9.5px; font-weight:600; padding:2px 6px; border-radius:999px; background:var(--surface-3); color:var(--text-muted); }
  .stockbadge.low{ background:var(--danger-bg); color:var(--danger); }
  .stockbadge.out{ background:var(--danger); color:#fff; }
  .empty{ text-align:center; padding:36px 16px; color:var(--text-muted); }
  .empty svg{ margin-bottom:10px; opacity:0.55; }
  .empty .t{ font-weight:600; color:var(--text); margin-bottom:3px; }
  .empty .s{ font-size:13px; }

  /* list rows (stock/customers/expenses) */
  .rowlist{ display:flex; flex-direction:column; gap:8px; }
  .row{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:transform 0.1s ease; }
  .row:active{ background:var(--surface-2); transform:scale(0.98); }
  .row .avatar{ width:38px; height:38px; border-radius:10px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--primary-dim); font-weight:700; font-family:var(--font-sans); letter-spacing:-0.01em; }
  .row .main{ flex:1; min-width:0; }
  .row .title{ font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .sub{ font-size:12px; color:var(--text-muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .trail{ text-align:right; flex-shrink:0; }
  .row .trail .amt{ font-size:14.5px; font-weight:600; }
  .row .trail .amt.owe{ color:var(--danger); }
  .row .trail .amt.ok{ color:var(--success); }
  .row .trail .note{ font-size:10.5px; color:var(--text-muted); margin-top:1px; }

  /* select mode / bulk delete */
  .selecttoolbar{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .selecttoolbar .btn{ padding:9px 14px; font-size:13px; }
  .selecttoolbar .spacer{ flex:1; }
  .row .rowcheck{ width:22px; height:22px; border-radius:7px; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--surface); transition:background .12s,border-color .12s; }
  .row .rowcheck svg{ display:none; width:14px; height:14px; }
  .row .rowcheck.checked{ background:var(--primary); border-color:var(--primary); }
  .row .rowcheck.checked svg{ display:block; }
  .row.checked{ outline:2px solid var(--primary); outline-offset:-2px; }
  .selectbar{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px)); width:100%; max-width:480px; padding:0 14px; z-index:26; }
  .selectbar-inner{ background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:14px; padding:10px 12px; display:flex; align-items:center; gap:8px; }
  .selectbar-inner .cnt{ font-size:12.5px; color:var(--text-muted); flex:0 0 auto; padding-left:2px; }
  .selectbar-inner .spacer{ flex:1; }
  .selectbar-inner .btn{ padding:9px 12px; font-size:12.5px; }

  .chip{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:999px; }
  .chip.low{ background:var(--danger-bg); color:var(--danger); }

  /* invoice archive */
  .inv-tools{ display:flex; gap:10px; align-items:flex-start; }
  .inv-tools .searchbar{ flex:1; min-width:0; margin-bottom:0; }
  .inv-tools .btn{ padding:11px 14px; font-size:13.5px; flex-shrink:0; }
  .inv-filters{ margin:12px 0 6px; }
  .inv-filters .segbtn{ padding:8px 6px; font-size:12.5px; }
  .inv-filters select{ width:100%; margin-top:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; padding:9px 10px; font-size:13px; font-family:inherit; }
  .inv-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .inv-top{ display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer; }
  .inv-top:active{ background:var(--surface-2); }
  .inv-top .main{ flex:1; min-width:0; }
  .inv-top .title{ font-size:14.5px; font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .inv-top .sub{ font-size:12px; color:var(--text-muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .inv-top .amt{ font-size:16px; font-weight:600; text-align:right; flex-shrink:0; }
  .chip.inv-type{ background:var(--surface-3); color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; font-size:9.5px; padding:2px 7px; }
  .inv-actions{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; border-top:1px solid var(--border); }
  .inv-actions button{ appearance:none; border:none; background:transparent; color:var(--text); font-family:inherit; font-size:12px; font-weight:600; padding:11px 4px; min-height:42px; display:flex; align-items:center; justify-content:center; gap:5px; cursor:pointer; }
  .inv-actions button + button{ border-left:1px solid var(--border); }
  .inv-actions button:active{ background:var(--surface-2); }
  .inv-actions button svg{ flex-shrink:0; }
  .inv-actions button.danger{ color:var(--danger); }
  .inv-items{ width:100%; border-collapse:collapse; font-size:13px; margin:4px 0 10px; }
  .inv-items th{ text-align:left; font-size:10.5px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-muted); padding:6px 0; border-bottom:1px solid var(--border); }
  .inv-items th.r, .inv-items td.r{ text-align:right; }
  .inv-items td{ padding:8px 0; border-bottom:1px solid var(--border); vertical-align:top; }
  .inv-items td.r{ white-space:nowrap; padding-left:8px; }
  .inv-meta{ display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin:2px 0 12px; font-size:13px; }
  .inv-meta .l{ font-size:10.5px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }

  /* monthly report archive */
  .rep-tools{ display:flex; gap:10px; flex-wrap:wrap; }
  .rep-tools .btn{ flex:1 1 180px; padding:11px 14px; font-size:13.5px; }
  .rep-filters{ display:flex; gap:8px; margin:12px 0 2px; }
  .rep-filters select{ flex:1; min-width:0; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; padding:9px 10px; font-size:13px; font-family:inherit; }
  .rep-sales{ text-align:right; flex-shrink:0; }
  .rep-sales .amt{ font-size:18px; font-weight:700; letter-spacing:-0.02em; }
  .rep-cap{ font-size:10px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; margin-top:1px; }
  .rep-figs{ white-space:normal !important; }
  .rep-note{ font-size:11.5px; color:var(--text-muted); line-height:1.55; margin:18px 2px 4px; text-align:center; }

  /* stat tiles */
  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:13px 14px; }
  .stat .lbl{ font-size:10.5px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }
  .stat .v{ font-size:20px; font-weight:700; margin-top:3px; font-family:var(--font-sans); letter-spacing:-0.02em; }
  .stat.wide{ grid-column:1/-1; }
  .stat .v.small{ font-size:16px; }

  .barrow{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .barrow .bl{ font-size:12.5px; flex:0 0 88px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
  .barrow .btrack{ flex:1; height:8px; border-radius:5px; background:var(--surface-3); overflow:hidden; }
  .barrow .bfill{ height:100%; border-radius:5px; background:var(--primary); }
  :root[data-theme="dark"] .barrow .bfill{ background:var(--primary); }
  .barrow .bv{ font-size:12px; flex:0 0 62px; text-align:right; color:var(--text-muted); }

  /* ---------- app-shell layout wrapper (replaces the removed bottom nav) ----------
     .appmain wraps the topbar+content+cartbarSlot so the persistent desktop
     sidebar (#appSidebar) can sit beside it as a flex row at wide viewports,
     while staying a plain block on mobile/tablet where the sidebar is an
     overlay drawer instead (see #appSidebar rules below). */
  .appmain{ display:flex; flex-direction:column; flex:1; min-height:0; min-width:0; }
  #appSidebar{ display:none; }

  /* buttons */
  .btn{ appearance:none; border:none; border-radius:12px; padding:12px 16px; font-size:14.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:background .12s ease, opacity .12s ease; }
  .btn-primary{ background:var(--primary); color:var(--primary-contrast); }
  .btn-accent{ background:var(--accent); color:var(--accent-contrast); }
  .btn-ghost{ background:var(--surface-2); color:var(--text); }
  .btn-danger{ background:var(--danger-bg); color:var(--danger); }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn:focus-visible, .icon-btn:focus-visible, .navbig:focus-visible, .drawer-row:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .fab{
    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px));
    transform:translateX(calc(-50% + 200px)); z-index:25;
    width:52px; height:52px; border-radius:16px; background:var(--accent); color:var(--accent-contrast);
    border:none; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  @media (max-width:480px){ .fab{ transform: translateX(calc(-50vw + 100% - 20px)); } }

  /* cart bar */
  .cartbar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px));
    width:100%; max-width:480px; padding:0 14px; z-index:24;
  }
  .cartbar-inner{
    background:var(--primary); color:var(--primary-contrast); border-radius:14px; padding:11px 14px;
    display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); cursor:pointer;
  }
  .cartbar-inner .cnt{ background:rgba(255,255,255,0.2); border-radius:999px; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
  .cartbar-inner .lbl{ flex:1; font-size:13.5px; font-weight:600; }
  .cartbar-inner .tot{ font-size:15px; font-weight:700; }

  /* sheet / modal */
  .overlay{ position:fixed; inset:0; background:rgba(10,14,12,0.5); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
  .overlay.center{ align-items:center; padding:20px; }
  .sheet{
    width:100%; max-width:480px; background:var(--surface); border-radius:20px 20px 0 0;
    max-height:88vh; overflow-y:auto; padding: 16px 16px calc(20px + env(safe-area-inset-bottom,0px));
    animation: sheetup 0.18s ease-out;
  }
  .overlay.center .sheet{ border-radius:18px; max-height:82vh; }
  @keyframes sheetup{ from{ transform:translateY(16px); opacity:0.6; } to{ transform:translateY(0); opacity:1; } }
  .sheet-handle{ width:36px; height:4px; background:var(--surface-3); border-radius:99px; margin:0 auto 12px; }
  .sheet-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }

  /* side drawer */
  .drawer-overlay{ position:fixed; inset:0; background:rgba(10,14,12,0.5); z-index:45; display:flex; align-items:stretch; justify-content:flex-start; }
  .drawer{
    width:84%; max-width:320px; height:100%; background:var(--surface);
    box-shadow:4px 0 28px rgba(0,0,0,0.28); overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));
    animation: drawerin 0.2s ease-out; display:flex; flex-direction:column;
    /* position:relative + isolation:isolate makes this drawer its own
       containing/stacking context for the watermark below, the same trick
       .app uses for the app-wide one — keeps the watermark clipped to the
       drawer and pinned behind its rows regardless of scroll position. */
    position:relative; isolation:isolate;
  }
  @keyframes drawerin{ from{ transform:translateX(-100%); } to{ transform:translateX(0); } }
  .drawer-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; padding:0 6px; }
  .drawer-head h2{ font-size:17px; flex:1; }
  /* Shop's own logo (or the default Pesa mark) in the top-right corner of
     the drawer header — shares --brand-logo-img with the topbar brandmark
     and the app watermark, so it stays in sync automatically. */
  .drawer-logo{
    width:28px; height:28px; flex-shrink:0; border-radius:8px;
    background-image:var(--brand-logo-img); background-repeat:no-repeat; background-size:contain; background-position:center;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,0.25));
  }
  .drawer-close{ width:30px; height:30px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .drawer-sub{ font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin:14px 8px 4px; }
  .drawer-row{ display:flex; align-items:center; gap:12px; padding:12px 8px; border-radius:12px; cursor:pointer; border:none; background:none; width:100%; text-align:left; color:var(--text); font-size:14.5px; font-weight:600; position:relative; z-index:1; }
  .drawer-row:active{ background:var(--surface-2); }
  .drawer-row .ico{ width:34px; height:34px; border-radius:10px; background:var(--surface-2); color:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .drawer-row .cnt{ margin-left:auto; font-size:12px; font-weight:600; color:var(--text-muted); }

  /* Training slideshow */
  .lesson-slide{ text-align:center; padding:8px 4px 4px; }
  .lesson-slide .ico{ width:72px; height:72px; border-radius:20px; background:var(--surface-2); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  .lesson-slide .ico svg{ width:34px; height:34px; }
  .lesson-slide h3{ font-size:17px; margin-bottom:10px; }
  .lesson-slide p{ font-size:14px; line-height:1.6; color:var(--text-muted); text-align:left; }
  .lesson-progress{ text-align:center; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:10px; }
  .lesson-progressbar{ height:4px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-bottom:16px; }
  .lesson-progressbar .fill{ height:100%; background:var(--primary); border-radius:99px; transition:width 0.25s ease; }
  .lesson-controls{ display:flex; align-items:center; gap:8px; margin-top:18px; }
  .lesson-controls .icon-btn{ width:42px; height:42px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .lesson-controls .navbig{ flex:1; }
  .sheet-head h2{ font-size:17px; flex:1; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:10px; padding:10px 11px; font-size:14.5px; outline:none;
  }
  .field textarea{ min-height:132px; resize:vertical; line-height:1.5; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:12.5px; }
  .bulk-row-card{ display:flex; flex-direction:column; gap:8px; }
  .bulk-row-top{ display:flex; align-items:center; gap:8px; }
  .bulk-row-top input{ flex:1; border:1px solid var(--border); background:var(--surface-2); border-radius:8px; padding:8px 10px; font-size:13.5px; font-weight:600; color:var(--text); }
  .bulk-del{ width:28px; height:28px; flex-shrink:0; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--danger); font-size:16px; line-height:1; cursor:pointer; }
  .bulk-row-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .bulk-row-grid input{ border:1px solid var(--border); background:var(--surface-2); border-radius:8px; padding:6px 7px; font-size:12px; color:var(--text); width:100%; min-width:0; }
  .bulk-row-grid input::placeholder{ color:var(--text-muted); }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--primary); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .segbtns{ display:flex; gap:8px; }
  .segbtn{ flex:1; border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:10px; padding:10px; font-size:13px; font-weight:600; cursor:pointer; text-align:center; }
  .segbtn.active{ background:var(--primary); color:var(--primary-contrast); border-color:var(--primary); }
  .actions{ display:flex; gap:10px; margin-top:16px; }
  .actions .btn{ flex:1; }

  /* cart list in sheet */
  .cartitem{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .cartitem:last-child{ border-bottom:none; }
  .cartitem .ci-name{ flex:1; min-width:0; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cartitem .ci-price{ font-size:11.5px; color:var(--text-muted); }
  .stepper{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .stepper button{ width:26px; height:26px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .stepper .qv{ min-width:18px; text-align:center; font-size:13.5px; font-weight:600; }
  .ci-line{ width:64px; text-align:right; font-size:13.5px; font-weight:600; flex-shrink:0; }

  .sumline{ display:flex; justify-content:space-between; padding:5px 0; font-size:13.5px; color:var(--text-muted); }
  .sumline.total{ font-size:16px; font-weight:700; color:var(--text); padding-top:9px; border-top:1px solid var(--border); margin-top:5px; }

  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px));
    background:var(--text); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:13px; z-index:60;
    box-shadow:var(--shadow); max-width:90%; text-align:center;
  }
  :root[data-theme="dark"] .toast{ background:var(--surface-3); color:var(--text); }

  .ledgeritem{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); }
  .ledgeritem:last-child{ border-bottom:none; }
  .ledgeritem .lt-l{ font-size:13px; }
  .ledgeritem .lt-l .d{ font-size:11px; color:var(--text-muted); display:block; margin-top:1px; }
  .ledgeritem .lt-v{ font-weight:600; font-size:13.5px; }
  .banner{ background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:12px; color:var(--text-muted); margin-bottom:12px; display:flex; gap:8px; align-items:flex-start; }
  .banner svg{ flex-shrink:0; margin-top:1px; }

  ::-webkit-scrollbar{ width:0; height:0; }

  /* ---------- tablet: full-width single column, still an overlay drawer ---------- */
  @media (min-width:640px) and (max-width:1023px){
    body{ align-items:flex-start; }
    .app{ max-width:none; width:100%; }
    .content{ max-width:680px; margin:0 auto; width:100%; }
  }

  /* ---------- desktop / installed-app shell: persistent pinned sidebar ----------
     Below this breakpoint the sidebar is the overlay drawer opened from the
     hamburger (openDashboardDrawer()); at or above it, the SAME row markup
     (menuRowsHtml()) is rendered permanently into #appSidebar instead — see
     renderSidebar() in the script. The bottom nav has been removed entirely;
     this pinned sidebar plus the drawer below the breakpoint are the only
     navigation surfaces, per the current design. */
  @media (min-width:1024px){
    body{ align-items:stretch; }
    .app{
      max-width:none; width:100%; height:100vh; height:100dvh; min-height:100vh; min-height:100dvh;
      display:flex; flex-direction:row;
    }
    #menuBtn{ display:none !important; }
    .app-watermark::before{ width:480px; height:466px; margin-left:-240px; margin-top:-233px; }
    #appSidebar{
      display:flex; flex-direction:column; flex:0 0 var(--sidebar-w); width:var(--sidebar-w);
      height:100%; background:var(--surface); border-right:1px solid var(--border);
      overflow-y:auto; -webkit-overflow-scrolling:touch;
      padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(18px + env(safe-area-inset-bottom,0px));
      position:relative; isolation:isolate;
    }
    .appmain{ flex:1; min-width:0; height:100%; }
    .topbar{ position:sticky; top:0; }
    .content{ padding:26px 32px 44px; max-width:1400px; width:100%; margin:0 auto; overflow-y:auto; height:100%; }
    .fab{ left:auto; right:36px; bottom:36px; transform:none; }
    .cartbar{ left:auto; right:28px; transform:none; width:380px; max-width:380px; bottom:28px; }
    .selectbar{ left:auto; right:28px; transform:none; width:380px; max-width:380px; bottom:28px; }
    .toast{ left:auto; right:28px; transform:none; }
    .sheet{ max-width:520px; border-radius:20px; max-height:86vh; }
    .overlay{ align-items:center; }
    .stats{ grid-template-columns:repeat(4,1fr) !important; }
    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); }
  }
  @media (min-width:1600px){
    .content{ max-width:1600px; }
  }
  /* ---------- persistent sidebar contents (reuses .drawer-row/.drawer-sub etc.) ---------- */
  .sidebar-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; padding:2px 8px 12px; border-bottom:1px solid var(--border); }
  .sidebar-head h2{ font-size:16px; flex:1; }
  .drawer-row.active{ background:var(--surface-2); color:var(--primary); }
  .drawer-row.active .ico{ background:var(--surface); color:var(--primary); }

  /* ---------- auth: company registration / login ---------- */
  .authscreen{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:none; align-items:flex-start; justify-content:center;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding: max(24px, env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px));
  }
  .authcard{ width:100%; max-width:440px; margin:12px 0; }

  /* ---------- animated welcome / launch splash ---------- */
  .splash-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:56vh; gap:18px; text-align:center; }
  .splash-stage{ position:relative; width:200px; height:200px; display:flex; align-items:center; justify-content:center; }
  .splash-glow{
    position:absolute; inset:-30px; border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, var(--primary) 45%, transparent 72%);
    filter:blur(30px); opacity:0; z-index:1;
    animation: pesaGlow 2.1s ease forwards;
  }
  .splash-logo{
    position:relative; z-index:2;
    width:190px; height:190px; background-image:var(--logo-img); background-repeat:no-repeat;
    background-size:contain; background-position:center;
    animation: pesaSplash 2.1s cubic-bezier(.34,1.4,.64,1) forwards;
    filter: drop-shadow(0 10px 26px rgba(0,0,0,0.22));
  }
  .splash-reflection{
    position:absolute; top:100%; left:0; width:100%; height:100%; z-index:1;
    transform:scaleY(-1); pointer-events:none;
    -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,0.32), transparent 72%);
    mask-image:linear-gradient(to top, rgba(0,0,0,0.32), transparent 72%);
  }
  .splash-reflection .splash-reflection-img{
    width:100%; height:100%; background-image:var(--logo-img); background-repeat:no-repeat;
    background-size:contain; background-position:center;
    animation: pesaSplash 2.1s cubic-bezier(.34,1.4,.64,1) forwards;
  }
  .splash-title{ font-size:22px; font-weight:800; letter-spacing:-0.02em; opacity:0; animation: pesaFadeUp 0.5s ease-out 1.35s forwards; }
  .splash-sub{ font-size:13.5px; color:var(--text-muted); opacity:0; animation: pesaFadeUp 0.5s ease-out 1.55s forwards; }
  @keyframes pesaSplash{
    0%   { transform:translateY(0) rotate(0deg) scale(0.7); opacity:0; }
    12%  { transform:translateY(0) rotate(0deg) scale(1); opacity:1; }
    28%  { transform:translateY(-26px) rotate(0deg) scale(1.04); }
    40%  { transform:translateY(0) rotate(0deg) scale(1); }
    52%  { transform:translateY(-16px) rotate(0deg) scale(1.02); }
    62%  { transform:translateY(0) rotate(0deg) scale(1); }
    64%  { transform:translateY(0) rotate(0deg) scale(1); }
    92%  { transform:translateY(0) rotate(360deg) scale(1); opacity:1; }
    100% { transform:translateY(0) rotate(360deg) scale(0.35); opacity:0; }
  }
  @keyframes pesaGlow{
    0%   { opacity:0; transform:scale(0.7); }
    12%  { opacity:0.35; transform:scale(1); }
    62%  { opacity:0.3; transform:scale(1.03); }
    100% { opacity:0; transform:scale(0.5); }
  }
  @keyframes pesaFadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    .splash-logo, .splash-reflection .splash-reflection-img{ animation:none; opacity:1; }
    .splash-glow{ animation:none; opacity:0.25; }
    .splash-title, .splash-sub{ animation:none; opacity:1; }
  }

  .authbrand{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px; text-align:center; }
  .authbrand .brandmark{ width:52px; height:52px; }
  .authbrand h1{ font-size:22px; }
  .authbrand p{ margin:0; font-size:13px; color:var(--text-muted); }
  .authbox{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:20px; box-shadow:var(--shadow); }
  .authbox .section-title{ margin-top:20px; }
  .authbox .section-title:first-child{ margin-top:0; }
  .stafftile{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface-2);
    border:2px solid transparent; border-radius:14px; padding:11px 13px; cursor:pointer; margin-bottom:8px;
  }
  .stafftile.active{ border-color:var(--primary); background:var(--surface); }
  .stafftile .avatar{ width:36px; height:36px; border-radius:10px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; color:var(--primary-dim); font-weight:700; flex-shrink:0; }
  .stafftile .main{ flex:1; min-width:0; }
  .stafftile .main .n{ font-size:14px; font-weight:600; }
  .stafftile .main .r{ font-size:11.5px; color:var(--text-muted); }
  .rolebadge{ display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; padding:3px 8px; border-radius:999px; background:var(--surface-3); color:var(--text-muted); }
  .rolebadge.owner{ background:var(--accent-bg,rgba(214,158,46,0.15)); color:var(--accent); }
  .rolebadge.manager{ background:rgba(59,130,246,0.15); color:#3B82F6; }
  .rolebadge.cashier{ background:var(--success-bg); color:var(--success); }
  .staffrow{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .staffrow:last-child{ border-bottom:none; }
  .staffrow .main{ flex:1; min-width:0; }
  .staffrow .main .n{ font-size:14px; font-weight:600; }
  .staffrow .main .e{ font-size:11.5px; color:var(--text-muted); }
  .staffrow.inactive{ opacity:0.5; }
  .authlink{ background:none; border:none; color:var(--primary-dim); font-weight:600; font-size:13px; cursor:pointer; padding:0; font-family:inherit; }
  :root[data-theme="dark"] .authlink{ color:var(--primary); }
  .compliance-note{ font-size:11.5px; line-height:1.5; color:var(--text-muted); background:var(--surface-2); border-radius:12px; padding:11px 13px; margin-top:14px; }
  /* ---------- till / cash-up reconciliation ---------- */
  .tillcard{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px; }
  .tillrow{ display:flex; align-items:center; justify-content:space-between; padding:7px 0; font-size:13.5px; border-bottom:1px dashed var(--border); }
  .tillrow:last-child{ border-bottom:none; }
  .tillrow .l{ color:var(--text-muted); }
  .tillrow .v{ font-weight:600; }
  .tillrow.grand{ font-size:15.5px; padding-top:11px; }
  .tillrow.grand .v{ font-weight:800; }
  .variance-ok{ color:var(--success); }
  .variance-bad{ color:var(--danger); }
  .variance-over{ color:#3B82F6; }
</style>

/* ============================== helpers ============================== */
function uid(prefix){
  var r = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2));
  return (prefix||'') + r;
}
function fmtMoney(n){
  n = Number(n)||0;
  var neg = n < 0; n = Math.abs(n);
  var s = n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg?'-':'') + 'N$' + s;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
function todayKey(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDay(iso){
  var d = new Date(iso);
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'});
}
function fmtDateTime(iso){
  var d = new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function startOfWeek(d){ d = new Date(d); var day = (d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d; }
function startOfMonth(d){ d = new Date(d); d.setHours(0,0,0,0); d.setDate(1); return d; }
function initials(name){
  name = (name||'?').trim();
  var parts = name.split(/\s+/);
  return ((parts[0]||'')[0]||'').toUpperCase() + ((parts[1]||'')[0]||'').toUpperCase();
}
function debounce(fn, ms){ var t; return function(){ var a=arguments,c=this; clearTimeout(t); t=setTimeout(function(){fn.apply(c,a);}, ms); }; }

/* ============================== store (db capability, with local fallback) ============================== */
var Store = (function(){
  var mode = 'pending'; // 'db' | 'local'
  var dbNs = null;
  var localColls = ['products','customers','sales','expenses'];
  var LKEY = 'otengu_shop_local_v1';
  var subs = {}; // path -> {cb, list}

  function localReadAll(){
    try { return JSON.parse(localStorage.getItem(LKEY) || '{}'); } catch(e){ return {}; }
  }
  function localWriteAll(all){
    try { localStorage.setItem(LKEY, JSON.stringify(all)); } catch(e){}
  }
  function localNotify(collPath){
    var subList = subs[collPath];
    if(!subList) return;
    var all = localReadAll();
    var coll = all[collPath] || {};
    var docs = Object.keys(coll).map(function(id){ return {id:id, data:coll[id]}; });
    subList.forEach(function(cb){ cb(docs); });
  }
  function localNotifyDoc(path){
    var subList = subs[path];
    if(!subList) return;
    var parts = path.split('/');
    var id = parts.pop();
    var collPath = parts.join('/');
    var all = localReadAll();
    var coll = all[collPath] || {};
    var data = coll[id];
    subList.forEach(function(cb){ cb(data || null); });
  }

  function localCollection(collPath){
    return {
      onSnapshot: function(cb){
        subs[collPath] = subs[collPath] || [];
        subs[collPath].push(cb);
        localNotify(collPath);
        return function(){
          var i = subs[collPath].indexOf(cb);
          if(i>=0) subs[collPath].splice(i,1);
        };
      },
      add: function(data){
        var id = uid();
        return this.doc(id).set(data).then(function(){ return {id:id}; });
      },
      doc: function(id){
        id = id || uid();
        var path = collPath + '/' + id;
        return {
          id:id,
          set: function(data){
            var all = localReadAll();
            all[collPath] = all[collPath] || {};
            all[collPath][id] = Object.assign({}, data);
            localWriteAll(all);
            localNotify(collPath); localNotifyDoc(path);
            return Promise.resolve();
          },
          update: function(patch){
            var all = localReadAll();
            all[collPath] = all[collPath] || {};
            all[collPath][id] = Object.assign({}, all[collPath][id]||{}, patch);
            localWriteAll(all);
            localNotify(collPath); localNotifyDoc(path);
            return Promise.resolve();
          },
          delete: function(){
            var all = localReadAll();
            if(all[collPath]) delete all[collPath][id];
            localWriteAll(all);
            localNotify(collPath); localNotifyDoc(path);
            return Promise.resolve();
          },
          collection: function(sub){ return localCollection(collPath+'/'+id+'/'+sub); },
          onSnapshot: function(cb){
            subs[path] = subs[path] || [];
            subs[path].push(cb);
            localNotifyDoc(path);
            return function(){
              var i = subs[path].indexOf(cb);
              if(i>=0) subs[path].splice(i,1);
            };
          }
        };
      }
    };
  }

  function wrapDbCollection(collRef){
    return {
      onSnapshot: function(cb){
        return collRef.onSnapshot(function(snap){
          var docs = snap.docs.filter(function(d){return d.exists;}).map(function(d){ return {id:d.id, data:d.data()}; });
          cb(docs);
        }, function(err){ console.warn('db snapshot error', err); cb([]); });
      },
      add: function(data){ return collRef.add(data); },
      doc: function(id){
        var ref = collRef.doc(id);
        return {
          id: ref.id,
          set: function(data){ return ref.set(data); },
          update: function(patch){ return ref.update(patch); },
          delete: function(){ return ref.delete(); },
          collection: function(sub){ return wrapDbCollection(ref.collection(sub)); },
          onSnapshot: function(cb){
            return ref.onSnapshot(function(snap){ cb(snap.exists ? snap.data() : null); }, function(err){ console.warn('doc snapshot error', err); cb(null); });
          }
        };
      }
    };
  }

  function collection(path){
    if(mode === 'db') return wrapDbCollection(dbNs.collection(path));
    return localCollection(path);
  }

  return {
    ready: (async function(){
      // window.claude.use('db') can lose a race with the artifact host's own
      // startup handshake on a cold load, especially right after the page is
      // reopened — retry a few times before accepting that it's truly
      // unavailable, so a slow-but-working connection isn't mistaken for no
      // connection at all (which would otherwise silently show a fresh
      // "register your business" screen even though the real data exists).
      for(var attempt=0; attempt<6; attempt++){
        try{
          if(window.claude && window.claude.use){
            var ns = await window.claude.use('db');
            if(ns){ dbNs = ns; mode = 'db'; return; }
          } else {
            break; // no window.claude at all (e.g. outside the artifact host) — no point retrying
          }
        }catch(e){ /* transient — retry below */ }
        await new Promise(function(resolve){ setTimeout(resolve, 350); });
      }
      mode = 'local';
    })(),
    collection: function(path){ return collection(path); },
    isCloud: function(){ return mode === 'db'; }
  };
})();

/* ============================== select mode / bulk delete ============================== */
function selState(tab){ return State.select[tab]; }
function selCount(tab){ return Object.keys(selState(tab).ids).length; }
function selListFor(tab){
  return tab==='stock' ? State.products : tab==='credit' ? State.customers : State.expenses;
}
function selRefFor(tab){
  return tab==='stock' ? refs.products : tab==='credit' ? refs.customers : refs.expenses;
}
function selLabelFor(tab, plural){
  var l = tab==='stock' ? 'product' : tab==='credit' ? 'customer' : 'expense';
  return plural ? l+'s' : l;
}
function toggleSelectMode(tab){
  var s = selState(tab);
  s.active = !s.active;
  s.ids = {};
  render();
}
function toggleSelectId(tab, id){
  var s = selState(tab);
  if(s.ids[id]) delete s.ids[id]; else s.ids[id] = true;
  render();
}
function selectAllInTab(tab){
  var s = selState(tab);
  var list = selListFor(tab);
  var allSelected = list.length>0 && list.every(function(x){ return s.ids[x.id]; });
  if(allSelected){ s.ids = {}; }
  else { list.forEach(function(x){ s.ids[x.id] = true; }); }
  render();
}
function deleteSelectedInTab(tab){
  var s = selState(tab);
  var ids = Object.keys(s.ids);
  if(ids.length===0) return;
  var refCol = selRefFor(tab);
  var label = selLabelFor(tab, ids.length>1);
  confirmSheet('Delete '+ids.length+' '+label+'?', 'This cannot be undone. Past sales already recorded are not affected.', 'Delete '+ids.length, function(){
    ids.forEach(function(id){ refCol.doc(id).delete(); });
    toast(ids.length+' '+label+' deleted');
    s.active = false; s.ids = {};
    render();
  }, true);
}
function deleteAllInTab(tab){
  var list = selListFor(tab);
  if(list.length===0) return;
  var refCol = selRefFor(tab);
  var label = selLabelFor(tab, true);
  confirmSheet('Delete all '+label+'?', 'This removes all '+list.length+' '+label+' and cannot be undone. Past sales already recorded are not affected.', 'Delete all', function(){
    list.forEach(function(x){ refCol.doc(x.id).delete(); });
    toast('All '+label+' deleted');
    var s = selState(tab); s.active = false; s.ids = {};
    render();
  }, true);
}

  var s = selState(tab);
  var list = selListFor(tab);
  var html = '<div class="selecttoolbar">' +
    '<button class="btn btn-ghost" id="selectModeBtn" data-tab="'+tab+'">'+(s.active?tr('Cancel'):ICONS.check.replace(/width="24" height="24"/,'width="15" height="15"')+' '+tr('Select'))+'</button>' +
    '<div class="spacer"></div>' +
    (!s.active && list.length>0 ? '<button class="btn btn-ghost" id="deleteAllBtn" data-tab="'+tab+'" style="color:var(--danger);">'+tr('Delete all')+'</button>' : '') +
  '</div>';
  return html;
}
function rowCheckHtml(tab, id){
  var checked = !!selState(tab).ids[id];
  return '<span class="rowcheck'+(checked?' checked':'')+'" data-selectcheck="'+id+'"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>';

function renderSelectBar(tab){
  var s = selState(tab);

/* ============================== audit trail ============================== */
// whenDate is optional: when a caller has already computed a single
// canonical Date for the event it is logging (for example the exact
// moment a verification stamp was generated), it passes that same Date
// object here so the stored audit record's timestamp is guaranteed to be
// the literal same instant as whatever was shown on screen or printed on
// a document, rather than a second, separately computed "now" that could
// in theory drift a few milliseconds from the first. Callers that have no
// such single moment to share just omit it and get the current time.
// extra is optional: a small object of additional fields stored on the
// record (e.g. { channel:'email', recipient:'jane@example.com' } for a
// document handed to the owner's email/WhatsApp/SMS app).
function logAudit(action, entityType, entityId, summary, whenDate, extra){
  try{
    refs.auditLog.add(Object.assign({}, extra || {}, {
      action: action, // 'create' | 'update' | 'delete' | 'other' | 'invoice_shared' | 'receipt_shared' | 'po_shared' | 'reminder_shared'
      entityType: entityType, // 'product' | 'sale' | 'expense' | 'staff' | 'till' | 'purchaseOrder' | 'wastage' | 'branch' | 'supplier' | 'verification_stamp' | 'invoice' | 'receipt' | 'customer'; action also 'invoice_deleted'
      entityId: entityId || null,
      summary: summary || '',
      userId: State.session ? State.session.userId : null,
      userName: State.session ? State.session.name : 'System',
      createdAt: (whenDate instanceof Date ? whenDate : new Date()).toISOString()
    }));
  }catch(e){ /* never let audit logging break the app */ }
}

  authEl.innerHTML = splashHtml(tr('Welcome, ')+businessName+'!', tr('Your business is set up and ready to go.'));
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){ if(done) done(); }, reduceMotion ? 400 : SPLASH_MS);
}

function sha256Hex(str){
  var enc = new TextEncoder().encode(String(str));
  return crypto.subtle.digest('SHA-256', enc).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  });
}
function roleTabs(role){
  if(role === 'cashier') return ['sell','till'];
  return ['dashboard','sell','stock','credit','invoices','reports','expenses','till'];
}
function isManagerOrOwner(){ return !!(State.session && (State.session.role==='owner' || State.session.role==='manager')); }
function isOwner(){ return !!(State.session && State.session.role==='owner'); }
function isCashier(){ return !!(State.session && State.session.role==='cashier'); }
function saveSessionLocal(userId){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify({userId:userId})); }catch(e){} }
function clearSessionLocal(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

function logout(){
  confirmSheet(tr('Log out?'), tr('You can log back in anytime with your password or PIN.'), tr('Log out'), function(){
    State.session = null;
    State.till.current = null;
    State.tab = 'dashboard';
    clearSessionLocal();
    closeModal();

function checkAuthAndRoute(){
  if(suppressAuthRoute) return;
  if(!State.ready.company || !State.ready.users) return;
  var appEl = document.getElementById('app');
  var authEl = document.getElementById('authScreen');
  if(!appEl || !authEl) return;

  if(!State.company){ showAuthScreen('register'); return; }

  if(!State.session){
    var saved = null;
    try{ saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){}
    if(saved && saved.userId){
      var u = State.users.find(function(x){ return x.id===saved.userId && x.active!==false; });
      if(u) State.session = { userId:u.id, name:u.name, role:u.role };
    }
  }
  if(!State.session){ showAuthScreen('login'); return; }

  authEl.style.display = 'none';
  appEl.style.display = '';
  var mine = State.tillSessions.find(function(t){ return t.cashierId===State.session.userId && t.status==='open'; });
  State.till.current = mine || null;
  var allowed = roleTabs(State.session.role);
  if(allowed.indexOf(State.tab) === -1) State.tab = allowed[0];
  render();
}

function showAuthScreen(view){
  var authEl = document.getElementById('authScreen');
  if(view === 'register' && !introSplashPlayed){
    introSplashPlayed = true;
    document.getElementById('app').style.display = 'none';
    authEl.style.display = 'flex';
    authEl.innerHTML = splashHtml(null, null);
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function(){
      // company/session state may have changed while the splash played
      if(State.company){ checkAuthAndRoute(); return; }
      authEl.innerHTML = renderRegisterCompanyHtml();
      wireRegisterCompany(authEl);
    }, reduceMotion ? 300 : SPLASH_MS);
    return;
  }
  document.getElementById('app').style.display = 'none';
  authEl.style.display = 'flex';
  authEl.innerHTML = view === 'register' ? renderRegisterCompanyHtml() : renderLoginHtml();
  if(view === 'register') wireRegisterCompany(authEl); else wireLoginView(authEl);
}

function wireRegisterCompany(root){
  root.querySelector('#rcSubmit').addEventListener('click', function(){
    var v = function(id){ return root.querySelector(id).value.trim(); };
    var companyName = v('#rcCompanyName'), regNumber = v('#rcRegNumber'), address = v('#rcAddress'),
        town = v('#rcTown'), region = v('#rcRegion'), phone = v('#rcPhone'),
        ownerName = v('#rcOwnerName'), ownerContact = v('#rcOwnerEmail'),
        pw = v('#rcOwnerPassword'), pw2 = v('#rcOwnerPassword2');
    var errEl = root.querySelector('#rcError');
    errEl.innerHTML = '';
    function fail(msg){ errEl.innerHTML = '<div class="banner">'+ICONS.warn+'<span>'+esc(msg)+'</span></div>'; }
    // Only the essentials are required — everything else can be filled in later,
    // once the business has it, from Settings → Company details.
    if(!companyName) return fail(tr('Enter your business name.'));
    if(!ownerName) return fail(tr('Enter the owner’s full name.'));
    if(!pw || pw.length<4) return fail(tr('Choose a password of at least 4 characters.'));
    if(pw !== pw2) return fail(tr('Passwords don’t match.'));
    var btn = root.querySelector('#rcSubmit');
    btn.disabled = true; btn.textContent = tr('Setting up…');
    suppressAuthRoute = true;
    (async function(){
      try{
        var passHash = await sha256Hex(pw);
        var tradingName = v('#rcTradingName');
        await refs.company.set({
          companyName: companyName, tradingName: tradingName, regNumber: regNumber,
          vatNumber: v('#rcVatNumber'), address: address, town: town, region: region,
          phone: phone, email: v('#rcEmail'), ownerName: ownerName,
          createdAt: new Date().toISOString()
        });
        var newUserRef = refs.users.doc();
        await newUserRef.set({ name: ownerName, email: ownerContact.toLowerCase(), role:'owner', passHash: passHash, active:true, createdAt: new Date().toISOString() });
        var displayName = tradingName || companyName;
        State.settings.shopName = displayName;
        try{ await refs.settings.set(State.settings); }catch(e2){}
        State.session = { userId: newUserRef.id, name: ownerName, role:'owner' };
        saveSessionLocal(newUserRef.id);
        showWelcomeSplash(displayName, function(){
          suppressAuthRoute = false;
          checkAuthAndRoute();
        });
      }catch(e){
        suppressAuthRoute = false;
        btn.disabled = false; btn.textContent = tr('Register & continue');
        fail(tr('Something went wrong saving your details — please try again.'));
      }
    })();
  });
}

function wireLoginView(root){
  var selectedId = null;
  root.querySelectorAll('[data-staff]').forEach(function(tile){
    tile.addEventListener('click', function(){
      root.querySelectorAll('[data-staff]').forEach(function(t){ t.classList.remove('active'); });
      tile.classList.add('active');
      selectedId = tile.getAttribute('data-staff');
      var u = State.users.find(function(x){ return x.id===selectedId; });
      var isCash = u && u.role === 'cashier';
      var box = root.querySelector('#loginUnlockBox');
      box.innerHTML =
        '<div class="field"><label>'+(isCash?tr('4-digit PIN'):tr('Password'))+'</label><input id="loginPass" type="password" inputmode="'+(isCash?'numeric':'text')+'" '+(isCash?'maxlength="4"':'')+' placeholder="'+(isCash?'••••':tr('Your password'))+'"></div>' +
        '<div id="loginError"></div>' +
        '<div class="actions"><button class="btn btn-primary btn-block" id="loginUnlockBtn">'+tr('Unlock')+'</button></div>';
      var passInput = box.querySelector('#loginPass');
      passInput.focus();
      function attempt(){
        var val = passInput.value;
        if(!val){ return; }
        var errEl = box.querySelector('#loginError');
        var unlockBtn = box.querySelector('#loginUnlockBtn');
        unlockBtn.disabled = true;
        sha256Hex(val).then(function(hash){
          if(hash === u.passHash){
            State.session = { userId:u.id, name:u.name, role:u.role };
            saveSessionLocal(u.id);
            toast(tr('Welcome back, ')+u.name+'!');
            checkAuthAndRoute();
          } else {
            unlockBtn.disabled = false;
            errEl.innerHTML = '<div class="banner">'+ICONS.warn+'<span>'+(isCash?tr('Incorrect PIN.'):tr('Incorrect password.'))+' '+tr('Ask an Owner or Manager to reset it from Settings → Team if you’ve forgotten it.')+'</span></div>';
            passInput.value=''; passInput.focus();
          }
        });
      }
      box.querySelector('#loginUnlockBtn').addEventListener('click', attempt);
      passInput.addEventListener('keydown', function(e){ if(e.key==='Enter') attempt(); });
    });
  });
}

    if(role === 'cashier'){
      f.innerHTML = '<div class="field"><label>'+tr('4-digit PIN (used to log in)')+'</label><input id="sfEmail" style="display:none;"><input id="sfPass" type="password" inputmode="numeric" maxlength="4" placeholder="e.g. 4821"></div>';
    } else {
      f.innerHTML = '<div class="field"><label>'+tr('Phone or email (optional, used to log in)')+'</label><input id="sfEmail" placeholder="081 234 5678 or name@example.com"></div>' +
        '<div class="field"><label>'+tr('Password')+'</label><input id="sfPass" type="password" placeholder="At least 4 characters"></div>';

        openTeamSheet();
      }
    })();
  });

/* ============================== till / cash-up (cash register reconciliation) ============================== */
function tillTotals(tillId){
  var sales = State.sales.filter(function(s){ return s.tillId === tillId; });
  var totals = {cash:0, card:0, wallet:0, credit:0};
  var items = {cash:0, card:0, wallet:0, credit:0};
  sales.forEach(function(s){
    var m = s.paymentMethod || 'cash';
    totals[m] = (totals[m]||0) + s.total;
    var qty = (s.items||[]).reduce(function(a,it){ return a+it.qty; }, 0);
    items[m] = (items[m]||0) + qty;
  });
  var itemTotal = items.cash+items.card+items.wallet+items.credit;
  return { totals:totals, items:items, saleCount:sales.length, itemTotal:itemTotal };
}

function renderTill(){
  if(isCashier()) return renderTillCashierView();
  return renderTillOverviewView();
}

function renderTillCashierView(){
  var open = State.till.current;
  if(!open){
    return '<div class="empty">'+ICONS.receipt+'<div class="t">'+tr('Your till is closed')+'</div><div class="s">'+tr('Count the cash in the drawer and open your register to start selling.')+'</div>' +
      '<div style="margin-top:14px;"><button class="btn btn-primary" id="startTillBtn">'+tr('Open till')+'</button></div></div>';
  }
  var t = tillTotals(open.id);
  var html = '<div class="banner" style="color:var(--success);">'+ICONS.check.replace(/width="24" height="24"/,'width="15" height="15"')+'<span>'+tr('Till open since')+' '+fmtDateTime(open.openedAt)+'</span></div>';
  html += tillSummaryCardHtml(open, t);
  html += '<button class="btn btn-danger btn-block" id="closeTillBtn" style="margin-top:14px;">'+tr('Close till &amp; count cash')+'</button>';

}

    '<div class="section-title" style="margin-top:0;">'+tr('Sales this shift')+'</div>' +
    '<div class="tillrow"><span class="l">'+tr('Opening float')+'</span><span class="v num">'+fmtMoney(session.openingFloat||0)+'</span></div>' +
    '<div class="tillrow"><span class="l">'+tr('Cash sales')+'</span><span class="v num">'+fmtMoney(t.totals.cash)+' ('+t.items.cash+' '+(t.items.cash===1?tr('item'):tr('items'))+')</span></div>' +
    '<div class="tillrow"><span class="l">'+tr('Card sales')+'</span><span class="v num">'+fmtMoney(t.totals.card)+' ('+t.items.card+' '+(t.items.card===1?tr('item'):tr('items'))+')</span></div>' +
    '<div class="tillrow"><span class="l">'+tr('Mobile wallet sales')+'</span><span class="v num">'+fmtMoney(t.totals.wallet)+' ('+t.items.wallet+' '+(t.items.wallet===1?tr('item'):tr('items'))+')</span></div>' +
    '<div class="tillrow"><span class="l">'+tr('Credit sales')+'</span><span class="v num">'+fmtMoney(t.totals.credit)+' ('+t.items.credit+' '+(t.items.credit===1?tr('item'):tr('items'))+')</span></div>' +

function renderTillOverviewView(){
  var openOnes = State.tillSessions.filter(function(t){ return t.status==='open'; });
  var closedOnes = State.tillSessions.filter(function(t){ return t.status==='closed'; });
  var html = '';
  if(openOnes.length > 0){
    html += '<div class="section-title" style="margin-top:0;">'+tr('Currently open')+' ('+openOnes.length+')</div>';
    html += '<div class="rowlist">' + openOnes.map(function(t){
      var tt = tillTotals(t.id);
      var cashExpected = (t.openingFloat||0) + tt.totals.cash;
      return '<div class="row" data-till="'+t.id+'">' +
        '<div class="avatar">'+esc(initials(t.cashierName))+'</div>' +
        '<div class="main"><div class="title">'+esc(t.cashierName)+'</div><div class="sub">'+tr('Open since')+' '+fmtDateTime(t.openedAt)+'</div></div>' +
        '<div class="trail"><div class="amt num">'+fmtMoney(cashExpected)+'</div><div class="note">'+tr('cash expected')+'</div></div>' +
      '</div>';
    }).join('') + '</div>';
  }
  html += '<div class="section-title">'+tr('Cash-up history')+'</div>';
  if(closedOnes.length === 0){
    html += '<div class="empty">'+ICONS.receipt+'<div class="t">'+tr('No cash-ups yet')+'</div><div class="s">'+tr('Closed till sessions from your cashiers will appear here.')+'</div></div>';
  } else {
    html += '<div class="rowlist">' + closedOnes.slice(0,40).map(function(t){
      var varClass = Math.abs(t.variance||0) < 0.01 ? 'variance-ok' : (t.variance<0 ? 'variance-bad' : 'variance-over');
      var varLabel = Math.abs(t.variance||0) < 0.01 ? tr('Balanced') : (t.variance<0 ? tr('Short')+' '+fmtMoney(Math.abs(t.variance)) : tr('Over')+' '+fmtMoney(t.variance));
      return '<div class="row" data-till="'+t.id+'">' +
        '<div class="avatar">'+esc(initials(t.cashierName))+'</div>' +
        '<div class="main"><div class="title">'+esc(t.cashierName)+'</div><div class="sub">'+fmtDay(t.closedAt)+'</div></div>' +
        '<div class="trail"><div class="amt num '+varClass+'">'+varLabel+'</div><div class="note">'+fmtMoney(t.expectedCash)+' '+tr('expected')+'</div></div>' +
      '</div>';
    }).join('') + '</div>';
  }
  return html;
}

function openStartTillSheet(){
  var html = '<div class="sheet-head"><h2>'+tr('Open till')+'</h2></div>' +
    '<div class="banner">'+tr('Count the cash currently in the drawer before you start selling.')+'</div>' +
    '<div class="field"><label>'+tr('Opening float (cash counted now)')+'</label><input id="tsFloat" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div>' +
    '<div class="actions"><button class="btn btn-primary btn-block" id="tsOpenBtn">'+tr('Open till')+'</button></div>';
  var ov = openSheet(html, {center:true});
  ov.querySelector('#tsOpenBtn').addEventListener('click', function(){
    var floatAmt = parseFloat(ov.querySelector('#tsFloat').value);
    if(isNaN(floatAmt) || floatAmt<0){ toast(tr('Enter the opening cash amount')); return; }
    var ref = refs.tills.doc();
    ref.set({
      cashierId: State.session.userId, cashierName: State.session.name,
      openingFloat: floatAmt, openedAt: new Date().toISOString(), status:'open'
    }).then(function(){
      State.till.current = { id: ref.id, cashierId:State.session.userId, cashierName:State.session.name, openingFloat:floatAmt, openedAt:new Date().toISOString(), status:'open' };
      logAudit('create','till',ref.id,'Till opened with '+fmtMoney(floatAmt));
      closeModal();
      toast(tr('Till opened with')+' '+fmtMoney(floatAmt));
      render();
    });
  });
}

function openCloseTillSheet(session){
  var t = tillTotals(session.id);
  var expectedFloat = (session.openingFloat||0) + t.totals.cash;
  var html = '<div class="sheet-head"><h2>'+tr('Close till')+'</h2></div>' +
    tillSummaryCardHtml(session, t) +
    '<div class="field"><label>'+tr('Cash paid out during shift (expenses paid from the drawer, if any)')+'</label><input id="tcPayout" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div>' +
    '<div class="field"><label>'+tr('Cash counted in drawer now')+'</label><input id="tcCounted" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div>' +
    '<div id="tcResult"></div>' +
    '<div class="actions"><button class="btn btn-danger btn-block" id="tcCloseBtn">'+tr('Confirm cash-up')+'</button></div>';
  var ov = openSheet(html, {center:true});
  function recalc(){
    var payout = parseFloat(ov.querySelector('#tcPayout').value) || 0;
    var counted = parseFloat(ov.querySelector('#tcCounted').value);
    var expected = expectedFloat - payout;
    var box = ov.querySelector('#tcResult');
    if(isNaN(counted)){ box.innerHTML=''; return; }
    var variance = counted - expected;
    var cls = Math.abs(variance)<0.01 ? 'variance-ok' : (variance<0?'variance-bad':'variance-over');
    var label = Math.abs(variance)<0.01 ? tr('Balanced — well done!') : (variance<0 ? tr('Cash is short by')+' '+fmtMoney(Math.abs(variance)) : tr('Cash is over by')+' '+fmtMoney(variance));
    box.innerHTML = '<div class="tillcard">' +
      '<div class="tillrow"><span class="l">'+tr('Expected in drawer')+'</span><span class="v num">'+fmtMoney(expected)+'</span></div>' +
      '<div class="tillrow"><span class="l">'+tr('Counted in drawer')+'</span><span class="v num">'+fmtMoney(counted)+'</span></div>' +
      '<div class="tillrow grand"><span class="l">'+tr('Variance')+'</span><span class="v num '+cls+'">'+label+'</span></div>' +
    '</div>';
  }
  ov.querySelector('#tcPayout').addEventListener('input', recalc);
  ov.querySelector('#tcCounted').addEventListener('input', recalc);
  ov.querySelector('#tcCloseBtn').addEventListener('click', function(){
    var payout = parseFloat(ov.querySelector('#tcPayout').value) || 0;
    var counted = parseFloat(ov.querySelector('#tcCounted').value);
    if(isNaN(counted)){ toast(tr('Enter the cash counted in the drawer')); return; }
    var expected = expectedFloat - payout;
    var variance = counted - expected;
    refs.tills.doc(session.id).update({
      status:'closed', closedAt:new Date().toISOString(), cashPayout:payout,
      closingCash:counted, expectedCash:expected, variance:variance,
      totals:t.totals, items:t.items
    }).then(function(){
      if(State.till.current && State.till.current.id === session.id) State.till.current = null;
      logAudit('update','till',session.id,'Till closed, variance '+fmtMoney(variance));
      if(notifyActive()){
        var tillTotal = Object.keys(t.totals||{}).reduce(function(a,k){ return a + (Number(t.totals[k])||0); }, 0);
        var today = todayKey();
        var todays = State.sales.filter(function(s){ return s.createdAt && todayKey(new Date(s.createdAt)) === today; });
        var dayTotal = todays.reduce(function(a,s){ return a + (s.total||0); }, 0);
        showDeviceNotification('Till closed: ' + (State.settings.shopName || 'Pesa'),
          'This till took ' + fmtMoney(tillTotal) + '. All sales today: ' + fmtMoney(dayTotal) + ' from ' + todays.length + ' sale(s). Cash ' +
          (Math.abs(variance)<0.01 ? 'balanced.' : (variance<0 ? 'short by ' + fmtMoney(Math.abs(variance)) + '.' : 'over by ' + fmtMoney(variance) + '.')),
          'pesa-till-' + session.id);
      }
      closeModal();
      toast(tr('Till closed')+' — '+(Math.abs(variance)<0.01?tr('balanced'):(variance<0?tr('short')+' '+fmtMoney(Math.abs(variance)):tr('over')+' '+fmtMoney(variance))));
      render();
    });
  });
}

function openTillDetailSheet(session){
  var t = session.status==='open' ? tillTotals(session.id) : { totals:session.totals||{cash:0,card:0,wallet:0,credit:0}, items:session.items||{cash:0,card:0,wallet:0,credit:0}, itemTotal:Object.values(session.items||{}).reduce(function(a,b){return a+b;},0) };
  var html = '<div class="sheet-head"><h2>'+esc(session.cashierName)+'</h2></div>' +
    '<div class="banner">'+(session.status==='open'?tr('Opened')+' '+fmtDateTime(session.openedAt):tr('Closed')+' '+fmtDateTime(session.closedAt))+'</div>' +
    tillSummaryCardHtml(session, t);
  if(session.status==='closed'){
    var cls = Math.abs(session.variance||0)<0.01 ? 'variance-ok' : (session.variance<0?'variance-bad':'variance-over');
    var label = Math.abs(session.variance||0)<0.01 ? tr('Balanced') : (session.variance<0?tr('Short')+' '+fmtMoney(Math.abs(session.variance)):tr('Over')+' '+fmtMoney(session.variance));
    html += '<div class="tillcard">' +
      '<div class="tillrow"><span class="l">'+tr('Cash paid out')+'</span><span class="v num">'+fmtMoney(session.cashPayout||0)+'</span></div>' +
      '<div class="tillrow"><span class="l">'+tr('Expected in drawer')+'</span><span class="v num">'+fmtMoney(session.expectedCash||0)+'</span></div>' +
      '<div class="tillrow"><span class="l">'+tr('Counted in drawer')+'</span><span class="v num">'+fmtMoney(session.closingCash||0)+'</span></div>' +
      '<div class="tillrow grand"><span class="l">'+tr('Variance')+'</span><span class="v num '+cls+'">'+label+'</span></div>' +
    '</div>';
  } else if(isManagerOrOwner()){
    html += '<div class="actions"><button class="btn btn-danger btn-block" id="managerCloseTillBtn">'+tr('Close this till')+'</button></div>';
  }
  var ov = openSheet(html);
  var mgrBtn = ov.querySelector('#managerCloseTillBtn');
  if(mgrBtn) mgrBtn.addEventListener('click', function(){ closeModal(); openCloseTillSheet(session); });
}

/* ============================== toast ============================== */
function toast(msg){
  var root = document.getElementById('toastRoot');
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.innerHTML = '';
  root.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 2200);
}

/* ============================== modal helpers ============================== */
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function openSheet(innerHtml, opts){
  opts = opts || {};
  var root = document.getElementById('modalRoot');
  var overlay = document.createElement('div');
  overlay.className = 'overlay' + (opts.center ? ' center' : '');
  overlay.innerHTML = '<div class="sheet">' + (opts.center ? '' : '<div class="sheet-handle"></div>') + innerHtml + '</div>';
  overlay.addEventListener('mousedown', function(e){ if(e.target === overlay) closeModal(); });
  root.innerHTML = '';
  root.appendChild(overlay);
  return overlay;
}
function confirmSheet(title, body, confirmLabel, onConfirm, danger){
  var html =
    '<div class="sheet-head"><h2>'+esc(title)+'</h2></div>' +
    '<div style="font-size:14px;color:var(--text-muted);margin-bottom:16px;line-height:1.5;">'+esc(body)+'</div>' +
    '<div class="actions">' +
      '<button class="btn btn-ghost btn-block" id="cfCancel">Cancel</button>' +
      '<button class="btn '+(danger?'btn-danger':'btn-primary')+' btn-block" id="cfOk">'+esc(confirmLabel)+'</button>' +
    '</div>';
  var ov = openSheet(html, {center:true});
  ov.querySelector('#cfCancel').addEventListener('click', closeModal);
  ov.querySelector('#cfOk').addEventListener('click', function(){ closeModal(); onConfirm(); });
}

function lastNDaysTotals(list, n){
  var days = [];
  for(var i=n-1;i>=0;i--){
    var d = new Date(); d.setDate(d.getDate()-i);
    days.push({ key: todayKey(d), label: d.toLocaleDateString('en-GB',{weekday:'narrow'}), total:0 });
  }
  var map = {};
  days.forEach(function(d){ map[d.key]=d; });
  list.forEach(function(s){
    var k = todayKey(new Date(s.createdAt));
    if(map[k]) map[k].total += s.total;
  });
  return days;
}
function sparklineSvg(days, opts){
  opts = opts || {};
  var w=280, h=56, pad=5;
  var vals = days.map(function(d){ return d.total; });
  var max = Math.max.apply(null, vals.concat([1]));
  var stepX = (w-pad*2) / (Math.max(vals.length-1,1));
  var pts = vals.map(function(v,i){
    var x = pad + i*stepX;
    var y = h-pad - (v/max)*(h-pad*2);
    return [x,y];
  });
  var lined = pts.map(function(p,i){ return (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  var areaD = lined + ' L' + pts[pts.length-1][0].toFixed(1) + ',' + (h-pad) + ' L' + pts[0][0].toFixed(1) + ',' + (h-pad) + ' Z';
  var last = pts[pts.length-1];
  var stroke = opts.stroke || 'currentColor';
  var fill = opts.fill || 'rgba(255,255,255,0.2)';
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:52px;display:block;" role="img" aria-label="Sales over the last '+days.length+' days">' +
    '<path d="'+areaD+'" fill="'+fill+'" stroke="none"></path>' +
    '<path d="'+lined+'" fill="none" stroke="'+stroke+'" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"></path>' +
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.5" fill="'+stroke+'"></circle>' +
  '</svg>';
}

function cartTotal(){ return State.cart.reduce(function(s,i){ return s + i.unitPrice*i.qty; }, 0); }

function cartCount(){ return State.cart.reduce(function(s,i){ return s + i.qty; }, 0); }

function addToCart(productId){
  var p = State.products.find(function(x){ return x.id===productId; });
  if(!p) return;
  var existing = State.cart.find(function(i){ return i.productId===productId; });
  var maxQty = p.stockQty==null ? Infinity : p.stockQty;
  if(existing){
    if(existing.qty >= maxQty){ toast('Only '+maxQty+' '+(p.unit||'in')+' stock'); return; }
    existing.qty += 1;
  } else {
    if(maxQty < 1){ toast('Out of stock'); return; }
    State.cart.push({ productId:p.id, name:p.name, unitPrice:p.sellPrice, cost:p.costPrice||0, qty:1, unit:p.unit||'', maxQty:maxQty });
  }
  renderCartBar();
}
function setCartQty(productId, qty){
  var item = State.cart.find(function(i){ return i.productId===productId; });
  if(!item) return;
  var p = State.products.find(function(x){ return x.id===productId; });
  var maxQty = p ? (p.stockQty==null?Infinity:p.stockQty) : Infinity;
  qty = Math.max(0, Math.min(qty, maxQty));
  if(qty === 0){
    State.cart = State.cart.filter(function(i){ return i.productId!==productId; });
  } else {
    item.qty = qty;
  }
  renderCartBar();
  if(document.getElementById('cartSheetBody')) renderCartSheetInPlace();
}
