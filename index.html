/** Build the report PDF for an explicit date range [start, end).
 * rangeLabel is the human-readable heading shown on the report. */
function buildReportPdf(start, end, rangeLabel){
  if(!getJsPDF()) return null;
  return drawReportPdf(computeReportFigures(start, end), rangeLabel, null);
}

/** Legacy helper: build a report for a whole calendar month ("YYYY-MM"). */
function buildMonthlyReportPdf(monthValue){
  var parts = monthValue.split('-');
  var yr = parseInt(parts[0],10), mo = parseInt(parts[1],10);
  var start = new Date(yr, mo-1, 1), end = new Date(yr, mo, 1);
  var label = start.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  return buildReportPdf(start, end, label);
}

/** Build a report for an arbitrary date range picked from the calendar UI.
 * fromStr/toStr are "YYYY-MM-DD" (inclusive on both ends). */
function buildReportPdfForRange(fromStr, toStr){
  var start = new Date(fromStr+'T00:00:00');
  var end = new Date(toStr+'T00:00:00'); end.setDate(end.getDate()+1); // make end exclusive, inclusive of the picked day
  var label = fmtDateNice(start) + ' – ' + fmtDateNice(new Date(toStr+'T00:00:00'));
  return buildReportPdf(start, end, label);
}

/* ============================== MONTHLY REPORT ARCHIVE ==============================
 * Every finished calendar month is filed as an immutable snapshot: the
 * computed figures are stored (not a pointer to live data), so an archived
 * report keeps showing what was true when it was filed even if sales,
 * expenses or products are edited or deleted afterwards. The PDF is rebuilt
 * on demand from the stored figures with drawReportPdf(), the same drawing
 * code as the Dashboard report. There is deliberately no "regenerate" on a
 * saved report: that would silently replace the record. To redo one, the
 * owner deletes it and files the month again. */
var REPORT_SNAPSHOT_VERSION = 1;
var REPORT_CATCHUP_MONTHS = 24;
var _reportsAutoFileDone = false;
function periodKeyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function periodLabelOf(key){ var p = key.split('-'); return new Date(+p[0], +p[1]-1, 1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }
function reportId(periodKey, scope, interim){ return (interim ? 'interim-' : 'monthly-') + periodKey + '-' + scope; }
function reportScopeLabel(rec){
  if(rec.branchId === 'all') return tr('Whole shop');
  var b = State.branches.find(function(x){ return x.id === rec.branchId; });
  return (b && b.name) || rec.branchName || tr('Branch');
}
function reportBranchName(scope){
  if(scope === 'all') return 'Whole shop';
  var b = State.branches.find(function(x){ return x.id === scope; });
  return b ? b.name : 'Branch';
}
/** periodKey -> { all:true, branches:{id:true} } for every month with a sale or expense. */
function reportMonthActivity(){
  var act = {};
  function mark(list){
    list.forEach(function(x){
      if(!x.createdAt) return;
      var d = new Date(x.createdAt); if(isNaN(d)) return;
      var k = periodKeyOf(d);
      var a = act[k] || (act[k] = { branches:{} });
      if(x.branchId) a.branches[x.branchId] = true;
    });
  }
  mark(State.sales); mark(State.expenses);
  return act;
}
function reportScopesFor(activity){
  var scopes = ['all'];
  if(State.branches.length >= 1){
    State.branches.forEach(function(b){ if(activity.branches[b.id]) scopes.push(b.id); });
  }
  return scopes;
}
/** Builds the storable record. `now` is the one canonical Date for this filing. */
function buildReportSnapshot(periodKey, scope, interim, now){
  var p = periodKey.split('-'), yr = +p[0], mo = +p[1];
  var start = new Date(yr, mo-1, 1), end = new Date(yr, mo, 1);
  var lastDay = new Date(yr, mo, 0);
  return {
    type: 'monthly',
    version: REPORT_SNAPSHOT_VERSION,
    interim: !!interim,
    periodKey: periodKey,
    label: periodLabelOf(periodKey),
    periodStart: todayKey(start),
    periodEnd: interim ? todayKey(now) : todayKey(lastDay),
    branchId: scope,
    branchName: reportBranchName(scope),
    generatedAt: now.toISOString(),
    generatedBy: State.session ? State.session.name : null,
    generatedById: State.session ? State.session.userId : null,
    shopName: State.settings.shopName || 'Pesa',
    vatNumber: (State.company && State.company.vatNumber) || '',
    figures: computeReportFigures(start, end, { scope: scope, snapshot: true })
  };
}
function fileMonthlyReports(periodKey, scopes, now, opts){
  opts = opts || {};
  var filed = 0;
  scopes.forEach(function(scope){
    var id = reportId(periodKey, scope, false);
    if(State.reports.some(function(r){ return r.id === id; })) return;
    refs.reports.doc(id).set(buildReportSnapshot(periodKey, scope, false, now));
    filed++;
    // the final report supersedes the interim one for the same month and scope
    var iid = reportId(periodKey, scope, true);
    if(State.reports.some(function(r){ return r.id === iid; })) refs.reports.doc(iid).delete();
  });
  return filed;
}
function reportsTombstones(){ return Array.isArray(State.settings.deletedReportIds) ? State.settings.deletedReportIds : []; }
/** Runs once per session for the owner or a manager, after all data has loaded. */
function maybeAutoFileReports(){
  if(_reportsAutoFileDone) return;
  if(!State.session || !isManagerOrOwner()) return;
  var r = State.ready;
  if(!(r.reports && r.sales && r.expenses && r.products && r.customers && r.settings && r.branches && r.wastage && r.tills)) return;
  _reportsAutoFileDone = true;
  try{
    var now = new Date();
    var cur = periodKeyOf(now);
    var act = reportMonthActivity();
    var keys = Object.keys(act).filter(function(k){ return k < cur; }).sort().reverse().slice(0, REPORT_CATCHUP_MONTHS);
    var dead = reportsTombstones();
    var filed = 0;
    keys.forEach(function(k){
      var scopes = reportScopesFor(act[k]).filter(function(s){ return dead.indexOf(reportId(k, s, false)) === -1; });
      filed += fileMonthlyReports(k, scopes, now);
    });
    // interim reports for months that have finished and now have a final report
    State.reports.forEach(function(rec){
      if(!rec.interim || !(rec.periodKey < cur)) return;
      var hasFinal = State.reports.some(function(x){ return x.id === reportId(rec.periodKey, rec.branchId, false); });
      if(hasFinal) refs.reports.doc(rec.id).delete();
    });
    if(filed > 0){
      logAudit('report_filed', 'report', null, 'Filed ' + filed + ' monthly report' + (filed === 1 ? '' : 's') + ' automatically', now);
      toast(filed + ' ' + (filed === 1 ? tr('monthly report filed in Reports') : tr('monthly reports filed in Reports')));
    }
  }catch(e){ /* filing must never break the app */ }
}
/** Manual: file (or refresh) the interim report for the month so far. */
function generateInterimReports(){
  var now = new Date();
  var key = periodKeyOf(now);
  var act = reportMonthActivity()[key];
  if(!act){ toast(tr('No sales or expenses recorded yet this month')); return; }
  var scopes = reportScopesFor(act);
  scopes.forEach(function(scope){ refs.reports.doc(reportId(key, scope, true)).set(buildReportSnapshot(key, scope, true, now)); });
  logAudit('report_generated', 'report', null, 'Generated interim report for ' + periodLabelOf(key), now);
  toast(tr('Report for the month so far saved'));
}
/** Manual: file a finished month that has no report (older than the automatic catch up, or deleted earlier). */
function openFileMonthSheet(){
  var now = new Date(), cur = periodKeyOf(now), act = reportMonthActivity();
  var keys = Object.keys(act).filter(function(k){
    return k < cur && !State.reports.some(function(r){ return r.id === reportId(k, 'all', false); });
  }).sort().reverse();
  var html = '<div class="sheet-head"><h2>'+tr('File a past month')+'</h2></div>';
  if(keys.length === 0){
    html += '<div class="banner">'+tr('Every finished month with sales or expenses already has a report.')+'</div>' +
      '<div class="actions"><button class="btn btn-ghost btn-block" id="fmClose" type="button">'+tr('Done')+'</button></div>';
    var ov0 = openSheet(html, {center:true});
    ov0.querySelector('#fmClose').addEventListener('click', closeModal);
    return;
  }
  html += '<div class="banner">'+tr('The report is built from the records in Pesa today and saved as a permanent copy.')+'</div>' +
    '<div class="field"><label>'+tr('Month')+'</label><select id="fmMonth">' +
      keys.map(function(k){ return '<option value="'+k+'">'+esc(periodLabelOf(k))+'</option>'; }).join('') + '</select></div>' +
    '<div class="actions"><button class="btn btn-primary btn-block" id="fmGo" type="button">'+tr('File report')+'</button></div>';
  var ov = openSheet(html, {center:true});
  ov.querySelector('#fmGo').addEventListener('click', function(){
    var k = ov.querySelector('#fmMonth').value;
    var scopes = reportScopesFor(act[k]);
    var ids = scopes.map(function(s){ return reportId(k, s, false); });
    var left = reportsTombstones().filter(function(id){ return ids.indexOf(id) === -1; });
    if(left.length !== reportsTombstones().length){
      State.settings = Object.assign({}, State.settings, { deletedReportIds: left });
      refs.settings.set(State.settings);
    }
    var n = fileMonthlyReports(k, scopes, new Date());
    logAudit('report_generated', 'report', null, 'Filed monthly report for ' + periodLabelOf(k));
    closeModal();
    toast(n ? tr('Report filed') : tr('That report already exists'));
  });
}

/* ---- records: PDF, CSV, print, share, delete ---- */
function reportFilename(rec, ext){
  var slug = rec.branchId === 'all' ? '' : '-' + String(reportScopeLabel(rec)).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return 'report-' + rec.periodKey + slug + (rec.interim ? '-interim' : '') + '.' + ext;
}
async function reportRecordPdf(rec){
  var ready = await ensureJsPDF();
  var doc = ready ? drawReportPdf(rec.figures, rec.label, {
    archived: true, interim: !!rec.interim, shopName: rec.shopName, scopeLabel: reportScopeLabel(rec),
    generatedAt: rec.generatedAt, generatedBy: rec.generatedBy, vatNumber: rec.vatNumber,
    periodText: fmtDateNice(rec.periodStart+'T00:00:00') + ' to ' + fmtDateNice(rec.periodEnd+'T00:00:00')
  }) : null;
  if(!doc) toast('Couldn’t load the PDF engine — check your connection and try again');
  return doc;
}
async function downloadReportRecord(rec){
  var doc = await reportRecordPdf(rec);
  if(!doc) return;
  var ok = await saveGeneratedPdf(doc, reportFilename(rec, 'pdf'));
  if(ok) toast(tr('Report downloaded'));
}
async function printReportRecord(rec){
  var doc = await reportRecordPdf(rec);
  if(doc) printPdfDoc(doc);
}
function reportCsv(rec){
  var f = rec.figures || {};
  function q(v){ v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
  var rows = [];
  function add(){ rows.push(Array.prototype.map.call(arguments, q).join(',')); }
  function m(n){ return (Math.round((Number(n)||0)*100)/100).toFixed(2); }
  add('Pesa monthly report', rec.label + (rec.interim ? ' (interim)' : ''));
  add('Shop', rec.shopName); add('Scope', reportScopeLabel(rec));
  add('Period', rec.periodStart + ' to ' + rec.periodEnd);
  add('Generated', rec.generatedAt); add('Generated by', rec.generatedBy || '');
  add('Amounts in', 'N$'); add();
  add('Summary', 'Amount');
  add('Sales revenue', m(f.revenue)); add('Number of sales', f.salesCount||0);
  add('Cost of goods sold', m(f.cogs)); add('Gross profit', m(f.grossProfit));
  add('Operating expenses', m(f.expensesTotal)); add('Net profit (loss)', m(f.netProfit));
  if(f.totalOwed != null){ add('Outstanding customer credit when filed', m(f.totalOwed)); add('Stock on hand at cost when filed', m(f.totalStockValue)); }
  add();
  add('Payment method', 'Amount');
  Object.keys(f.payments||{}).forEach(function(k){ add(k, m(f.payments[k])); });
  add();
  if(f.vat){ add('VAT', 'Amount'); add('VAT rate percent', f.vat.rate); add('Output VAT', m(f.vat.output)); add('Input VAT', m(f.vat.input)); add('Net VAT payable (refundable if negative)', m(f.vat.net)); add(); }
  if(f.wastageValue != null){ add('Wastage recorded at cost', m(f.wastageValue)); }
  if(f.tills){ add('Tills closed', f.tills.closedCount); add('Cash counted at till close', m(f.tills.cashCounted)); add('Total till variance', m(f.tills.variance)); }
  add();
  add('Expense category', 'Amount');
  (f.expenseRows||[]).forEach(function(r){ add(r.category, m(r.amount)); });
  add();
  add('Product', 'Quantity sold', 'Revenue', 'Profit');
  (f.productRows||[]).forEach(function(p){ add(p.name, p.qty, m(p.revenue), m(p.profit)); });
  if(f.productsOmitted) add('(' + f.productsOmitted + ' smaller products not listed)');
  return '﻿' + rows.join('\r\n') + '\r\n';
}
async function downloadReportCsv(rec){
  var ok = await saveBlobFile(reportFilename(rec, 'csv'), new Blob([reportCsv(rec)], { type:'text/csv;charset=utf-8' }));
  if(ok) toast(tr('CSV downloaded'));
}
function reportSendCtx(rec){
  var me = senderIdentity(), contactLine = senderContactLine();
  var f = rec.figures || {};
  var scope = reportScopeLabel(rec);
  var title = rec.label + (rec.interim ? ' (interim)' : '') + (rec.branchId === 'all' ? '' : ', ' + scope);
  var net = (f.netProfit < 0 ? 'Net loss ' : 'Net profit ') + fmtMoney(Math.abs(f.netProfit || 0));
  return {
    title: tr('Send report'),
    summaryHtml: esc(title) + ' · <strong class="num">' + esc(fmtMoney(f.revenue || 0)) + '</strong>',
    subject: 'Monthly report ' + title + ' from ' + me.name,
    emailBody: function(name, hasPdf){
      var lines = ['Dear ' + (name || 'Sir/Madam') + ',', ''];
      lines.push((hasPdf ? 'Please find attached' : 'Here is') + ' the monthly report for ' + title + ' from ' + me.name + '.', '');
      lines.push('Sales: ' + fmtMoney(f.revenue || 0), 'Expenses: ' + fmtMoney(f.expensesTotal || 0), net, '');
      if(hasPdf) lines.push('The report is attached as a PDF (' + reportFilename(rec, 'pdf') + ').', '');
      lines.push(contactLine ? 'If you have any questions, please contact us on ' + contactLine + '.' : 'If you have any questions, simply reply to this message.', '');
      lines.push('Kind regards,', me.name);
      return lines.join('\n');
    },
    shortText: function(name){
      return 'Hello' + (name ? ' ' + name : '') + ', monthly report for ' + title + ' from ' + me.name + '. Sales ' + fmtMoney(f.revenue || 0) + ', expenses ' + fmtMoney(f.expensesTotal || 0) + ', ' + net.toLowerCase() + '.' + (contactLine ? ' Questions? ' + contactLine : '');

    },
    defaultRecipient: 'manual',

    audit: { action:'report_shared', entityType:'report', entityId: rec.id, label: 'Monthly report ' + title, reference: rec.periodKey }

function deleteReportRecord(rec, after){
  if(!isOwner()){ toast(tr('Only the owner can delete reports')); return; }
  var name = rec.label + (rec.interim ? ' (' + tr('Interim') + ')' : '') + ' · ' + reportScopeLabel(rec);
  confirmSheet(tr('Delete') + ' ' + name + '?',
    tr('This removes the stored copy from the Reports list only. Your sales, expenses and stock are not changed. Copies you already downloaded, printed or sent stay with you. A deleted report is not filed again automatically; you can file that month again from File a past month.'),
    tr('Delete'), function(){
      refs.reports.doc(rec.id).delete();
      if(!rec.interim){
        var dead = reportsTombstones().filter(function(id){ return id !== rec.id; }); dead.push(rec.id);
        State.settings = Object.assign({}, State.settings, { deletedReportIds: dead.slice(-500) });
        refs.settings.set(State.settings);
      }
      logAudit('report_deleted', 'report', rec.id, 'Deleted ' + (rec.interim ? 'interim ' : 'monthly ') + 'report ' + rec.label + ' (' + reportScopeLabel(rec) + ', sales ' + fmtMoney((rec.figures||{}).revenue||0) + ')');
      toast(tr('Report deleted'));
      if(after) after();
    }, true);
}
function reportRunAction(act, rec){
  if(act === 'view') openReportDetailSheet(rec);
  else if(act === 'share') openSendSheet(reportSendCtx(rec));
  else if(act === 'download') downloadReportRecord(rec);
  else if(act === 'print') printReportRecord(rec);
  else if(act === 'csv') downloadReportCsv(rec);
  else if(act === 'delete') deleteReportRecord(rec);
}

/* ---- page ---- */
function repSortedList(){
  return State.reports.slice().sort(function(a,b){
    if(a.periodKey !== b.periodKey) return a.periodKey < b.periodKey ? 1 : -1;
    var sa = a.branchId === 'all' ? 0 : 1, sb = b.branchId === 'all' ? 0 : 1;
    if(sa !== sb) return sa - sb;
    if(!!a.interim !== !!b.interim) return a.interim ? 1 : -1;
    return String(reportScopeLabel(a)).localeCompare(String(reportScopeLabel(b)));
  });
}
function repFilteredList(){
  var f = State.repFilter || {};
  return repSortedList().filter(function(r){
    if(f.year && f.year !== 'all' && String(r.periodKey).slice(0,4) !== f.year) return false;
    if(f.scope && f.scope !== 'any' && r.branchId !== f.scope) return false;
    return true;
  });
}
function repProfitHtml(fig){

function wireReportsPage(content){
  var g = content.querySelector('#repGenBtn'); if(g) g.addEventListener('click', generateInterimReports);
  var fb = content.querySelector('#repFileBtn'); if(fb) fb.addEventListener('click', openFileMonthSheet);
  var wrap = content.querySelector('#repListWrap');
  function wireList(){
    if(!wrap) return;
    wrap.querySelectorAll('[data-rep-act]').forEach(function(el){
      function go(){
        var card = el.closest('[data-rep]');
        var rec = card && State.reports.find(function(r){ return r.id === card.getAttribute('data-rep'); });
        if(rec) reportRunAction(el.getAttribute('data-rep-act'), rec);
      }
      el.addEventListener('click', go);
      if(el.getAttribute('role') === 'button') el.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } });
    });
  }
  function refreshList(){ if(wrap){ wrap.innerHTML = repListHtml(); wireList(); } }
  wireList();
  var ys = content.querySelector('#repYearSel'); if(ys) ys.addEventListener('change', function(){ State.repFilter.year = ys.value; refreshList(); });
  var ss = content.querySelector('#repScopeSel'); if(ss) ss.addEventListener('change', function(){ State.repFilter.scope = ss.value; refreshList(); });
}

  html += '<div class="rowlist">' + State.expenses.slice(0,60).map(function(e){
    var checked = !!selE.ids[e.id];
    return '<div class="row'+(checked?' checked':'')+'" data-expense="'+e.id+'" data-select-id="'+e.id+'">' +
      (selE.active ? rowCheckHtml('expenses', e.id) : '') +
      '<div class="avatar">'+ICONS.receipt.replace(/width="26" height="26"/,'width="17" height="17"')+'</div>' +
      '<div class="main"><div class="title">'+esc(e.category)+'</div><div class="sub">'+esc(e.note||fmtDay(e.createdAt))+'</div></div>' +
      '<div class="trail"><div class="amt num">'+fmtMoney(e.amount)+'</div><div class="note">'+fmtDay(e.createdAt)+'</div></div>' +
    '</div>';
  }).join('') + '</div>';

  return html;
}

function openExpenseSheet(expense){
  var isEdit = !!expense;
  var opts = EXPENSE_CATEGORIES.map(function(c){ return '<option '+(expense&&expense.category===c?'selected':'')+'>'+c+'</option>'; }).join('');
  var html = '<div class="sheet-head"><h2>'+(isEdit?tr('Edit expense'):tr('Add expense'))+'</h2></div>' +
    '<div class="field"><label>'+tr('Category')+'</label><select id="efCat">'+opts+'</select></div>' +
    '<div class="field"><label>'+tr('Amount')+'</label><input id="efAmt" type="number" inputmode="decimal" step="0.01" placeholder="0.00" value="'+(expense?expense.amount:'')+'"></div>' +
    '<div class="field"><label>'+tr('Note (optional)')+'</label><input id="efNote" placeholder="Details" value="'+esc(expense?expense.note||'':'')+'"></div>' +
    '<div class="actions">' +
      (isEdit ? '<button class="btn btn-danger" id="efDelete">'+tr('Delete')+'</button>' : '') +
      '<button class="btn btn-primary btn-block" id="efSave">'+(isEdit?'Save':tr('Add expense'))+'</button>' +
    '</div>';
  var ov = openSheet(html, {center:true});
  ov.querySelector('#efSave').addEventListener('click', function(){
    var amt = parseFloat(ov.querySelector('#efAmt').value);
    if(!amt || amt<=0){ toast('Enter an amount'); return; }
    var data = { category: ov.querySelector('#efCat').value, amount:amt, note: ov.querySelector('#efNote').value.trim() };
    if(isEdit){
      refs.expenses.doc(expense.id).update(data);
      logAudit('update','expense',expense.id,'Edited expense '+fmtMoney(amt)+' ('+data.category+')');
      toast('Expense updated');
    } else {
      data.createdAt = new Date().toISOString();
      refs.expenses.doc().set(data);
      logAudit('create','expense',null,'Added expense '+fmtMoney(amt)+' ('+data.category+')');
      toast('Expense added');
    }
    closeModal();
  });
  if(isEdit){
    ov.querySelector('#efDelete').addEventListener('click', function(){
      confirmSheet('Delete expense?', 'This cannot be undone.', 'Delete', function(){ refs.expenses.doc(expense.id).delete(); logAudit('delete','expense',expense.id,'Deleted expense'); toast('Expense deleted'); }, true);
    });
  }
}

/* ============================== TAB: DASHBOARD ============================== */
function renderDashboard(){
  if(!State.ready.sales || !State.ready.expenses || !State.ready.products || !State.ready.customers){
    return '<div class="empty">Loading your shop…</div>';
  }
  // Multi-branch: an owner viewing a specific branch sees dashboard figures
  // scoped to it (records with no branchId — i.e. everything made before
  // multi-branch existed — still count everywhere, so nothing disappears).
  // Non-owners, and owners who never create a second branch, see the exact
  // same combined figures as before.
  var realSales = State.sales, realProducts = State.products;
  var branchBannerHtml = '';
  if(isOwner() && State.branches.length>0){
    var bid = State.settings.currentBranchId || 'all';
    State.sales = branchScoped(realSales);
    State.products = branchScoped(realProducts);
    if(bid !== 'all'){
      var b = State.branches.find(function(x){ return x.id===bid; });
      branchBannerHtml = '<div class="banner">Viewing: <strong>'+esc(b?b.name:'branch')+'</strong> — switch branches in Settings.</div>';
    }
  }
  var now = new Date();
  var wk = startOfWeek(now), mo = startOfMonth(now);
  var sumOf = function(list){ return list.reduce(function(s,x){return s+x.total;},0); };
  function since(d){ return State.sales.filter(function(s){ return new Date(s.createdAt) >= d; }); }

  var days7 = lastNDaysTotals(State.sales, 7);
  var todayTotal = days7[days7.length-1].total;
  var yestTotal = days7[days7.length-2] ? days7[days7.length-2].total : 0;
  var delta = yestTotal > 0 ? ((todayTotal-yestTotal)/yestTotal*100) : (todayTotal>0?100:0);
  var deltaUp = delta >= 0;

  var todaySales = State.sales.filter(function(s){ return todayKey(new Date(s.createdAt))===todayKey(); });
  var weekSales = since(wk);
  var monthSales = since(mo);
  var monthExpenses = State.expenses.filter(function(e){ return new Date(e.createdAt) >= mo; }).reduce(function(s,e){return s+e.amount;},0);
  var monthRevenue = monthSales.reduce(function(s,x){return s+x.total;},0);
  var monthProfit = monthSales.reduce(function(s,x){return s+(x.profit!=null?x.profit:0);},0) - monthExpenses;
  var totalOwed = State.customers.reduce(function(s,c){return s+(c.balance||0);},0);

  var pmTotals = {cash:0, card:0, wallet:0, credit:0};
  todaySales.forEach(function(s){ pmTotals[s.paymentMethod] = (pmTotals[s.paymentMethod]||0) + s.total; });

  var lowStockProducts = State.products.filter(function(p){ return p.stockQty!=null && p.stockQty <= (p.lowStock!=null?p.lowStock:State.settings.lowStockDefault); })
    .sort(function(a,b){ return a.stockQty-b.stockQty; });
  var debtors = State.customers.filter(function(c){ return (c.balance||0) > 0; }).sort(function(a,b){ return b.balance-a.balance; });

  var byProduct = {};
  monthSales.forEach(function(s){ (s.items||[]).forEach(function(it){ byProduct[it.name] = (byProduct[it.name]||0) + it.lineTotal; }); });
  var top = Object.keys(byProduct).map(function(k){ return {name:k, v:byProduct[k]}; }).sort(function(a,b){return b.v-a.v;}).slice(0,5);
  var topMax = top.length ? top[0].v : 1;

  /* ---- hero ---- */
  var html = '<div class="hero-card">' +
    '<div class="hero-top"><div>' +
      '<div class="hero-lbl">Today’s sales</div>' +
      '<div class="hero-val num">'+fmtMoney(todayTotal)+'</div>' +
      '<div class="hero-delta'+(deltaUp?'':' down')+'">'+(deltaUp?ICONS.trendUp:ICONS.trendDown)+' '+Math.abs(Math.round(delta))+'% vs yesterday</div>' +
    '</div></div>' +
    '<div class="hero-chart">' + sparklineSvg(days7, {stroke:'currentColor', fill:'rgba(79,169,138,0.18)'}) +
      '<div class="hero-ticks">' + days7.map(function(d){ return '<span>'+d.label+'</span>'; }).join('') + '</div>' +
    '</div>' +
  '</div>';

  html += '<div class="paysplit-label">'+tr('Today’s sales by payment method')+'</div>';
  html += '<div class="paysplit">' +
    '<div class="pt"><div class="l">'+tr('Cash sales')+'</div><div class="v">'+fmtMoney(pmTotals.cash)+'</div></div>' +
    '<div class="pt"><div class="l">'+tr('Card sales')+'</div><div class="v">'+fmtMoney(pmTotals.card)+'</div></div>' +
    '<div class="pt"><div class="l">'+tr('Mobile wallet sales')+'</div><div class="v">'+fmtMoney(pmTotals.wallet)+'</div></div>' +
    '<div class="pt"><div class="l">'+tr('Credit sales')+'</div><div class="v">'+fmtMoney(pmTotals.credit)+'</div></div>' +
  '</div>';

  /* ---- quick actions ---- */
  html += '<div class="qa-row">' +
    '<button class="qa-btn" data-qa="sell"><span class="qa-ico">'+ICONS.cart.replace(/width="26" height="26"/,'width="18" height="18"')+'</span><span class="qa-lbl">'+tr('Sell')+'</span></button>' +
    '<button class="qa-btn" data-qa="stock"><span class="qa-ico">'+ICONS.box.replace(/width="26" height="26"/,'width="18" height="18"')+'</span><span class="qa-lbl">'+tr('Stock')+'</span></button>' +
    '<button class="qa-btn" data-qa="expense"><span class="qa-ico">'+ICONS.receipt.replace(/width="26" height="26"/,'width="18" height="18"')+'</span><span class="qa-lbl">'+tr('Expenses')+'</span></button>' +
    '<button class="qa-btn" data-qa="customer"><span class="qa-ico">'+ICONS.people.replace(/width="26" height="26"/,'width="18" height="18"')+'</span><span class="qa-lbl">'+tr('Customer')+'</span></button>' +
  '</div>';

  /* ---- stat grid ---- */
  html += '<div class="section-title">'+tr('Overview')+'</div><div class="stats">' +
    '<div class="stat"><div class="lbl">This week</div><div class="v num">'+fmtMoney(sumOf(weekSales))+'</div></div>' +
    '<div class="stat"><div class="lbl">This month</div><div class="v num">'+fmtMoney(monthRevenue)+'</div></div>' +
    '<div class="stat"><div class="lbl">Est. profit (mo.)</div><div class="v num small" style="color:'+(monthProfit>=0?'var(--success)':'var(--danger)')+'">'+fmtMoney(monthProfit)+'</div></div>' +
    '<div class="stat"><div class="lbl">Owed to you</div><div class="v num small" style="color:var(--danger)">'+fmtMoney(totalOwed)+'</div></div>' +
  '</div>';

  /* ---- needs attention ---- */
  var attnCount = lowStockProducts.length + debtors.length;
  html += '<div class="section-title">'+tr('Needs attention')+(attnCount?' <span style="text-transform:none;letter-spacing:0;color:var(--text-muted);font-weight:500;">('+attnCount+')</span>':'')+'</div><div class="card pad">';
  if(attnCount === 0){
    html += '<div class="all-clear">'+ICONS.check+'<span>All caught up — stock is healthy and no one owes you.</span></div>';
  } else {
    lowStockProducts.slice(0,3).forEach(function(p){
      var out = p.stockQty<=0;
      html += '<div class="att-row" data-goto-product="'+p.id+'">' +
        '<div class="att-dot'+(out?'':' warn')+'"></div>' +
        '<div class="att-main"><div class="att-title">'+esc(p.name)+'</div><div class="att-sub">'+(out?'Out of stock':'Running low')+'</div></div>' +
        '<div class="att-val">'+p.stockQty+' '+(p.unit||'left')+'</div>' +
      '</div>';
    });
    debtors.slice(0,3).forEach(function(c){
      html += '<div class="att-row" data-goto-customer="'+c.id+'">' +
        '<div class="att-dot"></div>' +
        '<div class="att-main"><div class="att-title">'+esc(c.name)+'</div><div class="att-sub">Owes since last visit</div></div>' +
        '<div class="att-val num">'+fmtMoney(c.balance)+'</div>' +
      '</div>';
    });
  }
  html += '</div>';

  /* ---- top sellers ---- */
  html += '<div class="section-title">'+tr('Top sellers this month')+'</div><div class="card pad">' +
    (top.length===0 ? '<div style="color:var(--text-muted);font-size:13px;">No sales yet this month.</div>' :
      top.map(function(t){ return '<div class="barrow"><div class="bl">'+esc(t.name)+'</div><div class="btrack"><div class="bfill" style="width:'+(t.v/topMax*100)+'%"></div></div><div class="bv num">'+fmtMoney(t.v)+'</div></div>'; }).join('')) +
  '</div>';

  /* ---- sales insights (collapsible) ---- */
  html += dashboardInsightsHtml();

  /* ---- recent sales ---- */
  html += '<div class="section-title">'+tr('Recent sales')+'</div>';
  if(State.sales.length === 0){
    html += '<div class="card pad" style="color:var(--text-muted);font-size:13px;">No sales recorded yet.</div>';
  } else {
    html += '<div class="rowlist">' + State.sales.slice(0,5).map(function(s){
      var pmLabel = s.paymentMethod==='cash'?tr('Cash'):(s.paymentMethod==='card'?tr('Card'):(s.paymentMethod==='wallet'?tr('Mobile wallet'):tr('Credit')));
      var itemCount = (s.items||[]).reduce(function(a,i){return a+i.qty;},0);
      return '<div class="row" style="cursor:default;">' +
        '<div class="avatar">'+ICONS.cart.replace(/width="26" height="26"/,'width="16" height="16"')+'</div>' +
        '<div class="main"><div class="title">'+itemCount+' item'+(itemCount===1?'':'s')+'</div><div class="sub">'+pmLabel+' · '+fmtDateTime(s.createdAt)+'</div></div>' +
        '<div class="trail"><div class="amt num">'+fmtMoney(s.total)+'</div><button class="note" data-invoice-sale="'+s.id+'" style="background:none;border:none;padding:0;color:var(--primary-dim);font-weight:600;font-size:10.5px;cursor:pointer;">'+tr('Invoice')+'</button></div>' +
      '</div>';
    }).join('') + '</div>';
  }

  /* ---- invoicing ---- */
  html += '<div class="section-title">'+tr('Invoicing')+'</div><div class="card pad" style="display:flex;flex-direction:column;gap:10px;">' +
    '<button class="btn btn-accent btn-block" id="createInvoiceBtn">'+tr('Create an invoice')+'</button>' +
    '<div style="font-size:11.5px;color:var(--text-muted);text-align:center;">Downloads as a PDF you can print or share. Add your logo in Settings to brand it.</div>' +
  '</div>';

  /* ---- report ---- */
  var todayISO = todayKey();
  var monthStartISO = (function(){ var d=new Date(); d.setDate(1); return todayKey(d); })();
  html += '<div class="section-title">'+tr('Reports')+'</div><div class="card pad" style="display:flex;flex-direction:column;gap:10px;">' +
    '<div class="segbtns" id="reportPresetBtns">' +
      '<button type="button" class="segbtn active" data-preset="month">'+tr('This month')+'</button>' +
      '<button type="button" class="segbtn" data-preset="lastmonth">'+tr('Last month')+'</button>' +
      '<button type="button" class="segbtn" data-preset="custom">'+tr('Custom')+'</button>' +
    '</div>' +
    '<div class="field-row" id="reportRangeRow" style="display:none;margin:0;">' +
      '<div class="field" style="margin:0;"><label>'+tr('From')+'</label><input type="date" id="reportFrom" value="'+monthStartISO+'" max="'+todayISO+'"></div>' +
      '<div class="field" style="margin:0;"><label>'+tr('To')+'</label><input type="date" id="reportTo" value="'+todayISO+'" max="'+todayISO+'"></div>' +
    '</div>' +
    '<button class="btn btn-ghost btn-block" id="downloadReportBtn">'+tr('Download report (PDF)')+'</button>' +
    (isManagerOrOwner() ? '<button class="btn btn-ghost btn-block" id="viewReportArchiveBtn" type="button">'+tr('View report archive')+'</button>' : '') +
    '<div style="font-size:11.5px;color:var(--text-muted);text-align:center;">Revenue, cost of goods, expenses, profit or loss, and a full stock valuation for any date range you pick.</div>' +
  '</div>';

  /* ---- data ---- */
  html += '<div class="section-title">'+tr('Data')+'</div><div class="card pad" style="display:flex;flex-direction:column;gap:10px;">' +
    '<button class="btn btn-ghost btn-block" id="exportDataBtn">'+tr('Export all data (.json)')+'</button>' +
    '<div style="font-size:11.5px;color:var(--text-muted);text-align:center;">'+(Store.isCloud()?'Saved securely and synced automatically.':'Saved on this device only.')+'</div>' +
  '</div>';

  State.sales = realSales; State.products = realProducts;
  return branchBannerHtml + html;
}

function exportData(){
  var payload = {
    exportedAt: new Date().toISOString(),
    shop: State.settings,
    products: State.products,
    customers: State.customers,
    sales: State.sales,
    expenses: State.expenses,
    invoices: State.invoices,
    reports: State.reports
  };
  var json = JSON.stringify(payload, null, 2);
  var filename = 'pesa-export-'+todayKey()+'.json';
  (async function(){
    try{
      if(window.claude && window.claude.use){
        var dl = await window.claude.use('downloads');
        if(dl){
          await dl.save({ filename: filename, data: json });
          toast('Export ready');
          return;
        }
      }
    }catch(e){
      if(e && e.code === 'declined') return;
    }
    if(browserDownload(filename, new Blob([json], {type:'application/json'}))){
      toast('Export ready');
    } else {
      toast('Downloads not available in this view');
    }
  })();
}

// Builds the app's one complete navigation menu — used both for the mobile
// overlay drawer (openDashboardDrawer(), below the desktop breakpoint) and
// for the persistent pinned sidebar (renderSidebar(), at/above it) — so the
// two surfaces can never drift out of sync. Tab rows are filtered by the
// signed-in role the same way the old bottom nav used to (roleTabs()).
function menuRowsHtml(){
  var allowedTabs = State.session ? roleTabs(State.session.role) : ['dashboard','sell','stock','credit','invoices','reports','expenses','till'];
  var rows = '';
  rows += '<div class="drawer-sub">Main menu</div>';
  if(allowedTabs.indexOf('dashboard')!==-1) rows += drawerRowHtml('tab-dashboard', ICONS.dashboard, 'Dashboard');
  if(allowedTabs.indexOf('sell')!==-1) rows += drawerRowHtml('tab-sell', ICONS.cart, 'Sell');
  if(allowedTabs.indexOf('stock')!==-1) rows += drawerRowHtml('tab-stock', ICONS.box, 'Stock');
  if(allowedTabs.indexOf('credit')!==-1) rows += drawerRowHtml('tab-credit', ICONS.people, 'Credit');
  if(allowedTabs.indexOf('invoices')!==-1) rows += drawerRowHtml('tab-invoices', ICONS.invoice, 'Invoices');
  if(allowedTabs.indexOf('reports')!==-1) rows += drawerRowHtml('tab-reports', ICONS.chartbar, 'Reports');
  if(allowedTabs.indexOf('expenses')!==-1) rows += drawerRowHtml('tab-expenses', ICONS.receipt, 'Expenses');
  if(allowedTabs.indexOf('till')!==-1) rows += drawerRowHtml('tab-till', ICONS.till, 'Till');
  if(!isCashier()){
    rows += '<div class="drawer-sub">Insights</div>';
    rows += drawerRowHtml('insights', ICONS.chartbar, 'Sales insights');
  }
  if(isManagerOrOwner()){
    rows += '<div class="drawer-sub">Operations</div>';
    rows += drawerRowHtml('suppliers', ICONS.truck, 'Suppliers', State.suppliers.length);
    rows += drawerRowHtml('pos', ICONS.clipboard, 'Purchase orders', State.purchaseOrders.length);
    rows += drawerRowHtml('wastage', ICONS.trash, 'Wastage & shrinkage');
    if(isOwner()) rows += drawerRowHtml('branches', ICONS.branch, 'Branches', State.branches.length+1);
    rows += drawerRowHtml('vat', ICONS.percent, 'NamRA VAT summary');
    rows += drawerRowHtml('audit', ICONS.clock, 'Activity log');
  }
  rows += '<div class="drawer-sub">Help</div>';
  rows += drawerRowHtml('training', ICONS.book, 'Training');
  rows += drawerRowHtml('about', ICONS.info, 'About Pesa');
  return rows;
}
// Shared destination for a menu row click, whichever surface it came from.
function handleDrawerAction(key){
  if(key==='tab-dashboard') setTab('dashboard');
  else if(key==='tab-sell') setTab('sell');
  else if(key==='tab-stock') setTab('stock');
  else if(key==='tab-credit') setTab('credit');
  else if(key==='tab-invoices') setTab('invoices');
  else if(key==='tab-reports') setTab('reports');
  else if(key==='tab-expenses') setTab('expenses');
  else if(key==='tab-till') setTab('till');
  else if(key==='insights'){
    setTab('dashboard');
    _insightsOpen = true;
    render();
    setTimeout(function(){
      var t = document.getElementById('insightsToggle');
      if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
    }, 60);
  } else if(key==='suppliers') openSuppliersSheet();
  else if(key==='pos') openPurchaseOrdersSheet();
  else if(key==='wastage') openWastageSheet();
  else if(key==='branches') openBranchesSheet();
  else if(key==='vat') openVatSummarySheet();
  else if(key==='audit') openAuditLogSheet();
  else if(key==='training') openTrainingSheet();
  else if(key==='about') openAboutSheet();
}
function openDashboardDrawer(){
  var root = document.getElementById('modalRoot');
  var overlay = document.createElement('div');
  overlay.className = 'drawer-overlay';
  overlay.innerHTML = '<div class="drawer">' +
    '<div class="app-watermark" aria-hidden="true"></div>' +
    '<div class="drawer-head"><h2>Menu</h2>' +
      '<div class="drawer-logo" aria-hidden="true" title="Pesa"></div>' +
      '<button class="drawer-close" id="drawerCloseBtn" type="button" aria-label="Close">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>' +
    '</button></div>' +
    menuRowsHtml() +
  '</div>';
  root.innerHTML = '';
  root.appendChild(overlay);
  function closeDrawer(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); }
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeDrawer(); });
  overlay.querySelector('#drawerCloseBtn').addEventListener('click', closeDrawer);
  overlay.querySelectorAll('[data-drawer-row]').forEach(function(el){
    el.addEventListener('click', function(){
      var key = el.getAttribute('data-drawer-row');
      closeDrawer();
      handleDrawerAction(key);
    });
  });
}
// Renders the SAME menu permanently into the persistent desktop sidebar
// (#appSidebar, shown only at >=1024px — see CSS). Called from render() so
// it always reflects the current tab, role and counts, just like the drawer
// does when it's (re)opened.
function renderSidebar(){
  var el = document.getElementById('appSidebar');
  if(!el) return;
  el.innerHTML = '<div class="app-watermark" aria-hidden="true"></div>' +
    '<div class="sidebar-head"><div class="drawer-logo" aria-hidden="true" title="Pesa"></div><div style="flex:1;min-width:0;"><h2 style="margin:0;">Pesa</h2><div class="slogan">Your Mula, Your Pride</div></div></div>' +
    menuRowsHtml();

function importDataFromFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try{ data = JSON.parse(reader.result); }catch(e){ toast('That file isn’t a valid Pesa backup'); return; }
    confirmSheet('Restore backup?', 'This replaces your shop settings, products, customers, sales, expenses, stored invoices and saved monthly reports with the contents of this file. This cannot be undone.', 'Restore', function(){
      (async function(){
        try{
          if(data.shop) { State.settings = Object.assign({}, State.settings, data.shop); refs.settings.set(State.settings); }
          var restoreCollection = async function(colRef, rows){
            if(!Array.isArray(rows)) return;
            for(var i=0;i<rows.length;i++){
              var row = Object.assign({}, rows[i]);
              var id = row.id; delete row.id;
              await colRef.doc(id).set(row);
            }
          };
          await restoreCollection(refs.products, data.products);
          await restoreCollection(refs.customers, data.customers);
          await restoreCollection(refs.sales, data.sales);
          await restoreCollection(refs.expenses, data.expenses);
          await restoreCollection(refs.invoices, data.invoices); // older backups have no invoices: restoreCollection skips a missing list
          await restoreCollection(refs.reports, data.reports); // older backups have no reports: skipped the same way
          toast('Backup restored');
          closeModal();
        }catch(err){ toast('Restore failed — the backup file may be corrupted'); }
      })();
    }, true);
  };
  reader.readAsText(file);
}

function handleBrandImageUpload(file, kind){
  toast('Processing image…');
  resizeImageFile(file, kind==='letterhead' ? 900 : 300, 0.85).then(function(result){
    var patch = {};
    if(kind==='logo'){ patch.logoDataUrl = result.dataUrl; patch.logoImgMeta = {w:result.w,h:result.h}; }
    else { patch.letterheadDataUrl = result.dataUrl; patch.letterheadImgMeta = {w:result.w,h:result.h}; }
    State.settings = Object.assign({}, State.settings, patch);
    refs.settings.set(State.settings);
    closeModal();
    openSettingsSheet();
    toast((kind==='logo'?'Logo':'Letterhead') + ' updated');
  }).catch(function(){
    toast('Couldn’t process that image — try a different file');
  });
}

function removeBrandImage(kind){
  var patch = {};
  if(kind==='logo'){ patch.logoDataUrl = null; patch.logoImgMeta = null; }
  else { patch.letterheadDataUrl = null; patch.letterheadImgMeta = null; }
  State.settings = Object.assign({}, State.settings, patch);
  refs.settings.set(State.settings);
  closeModal();
  openSettingsSheet();
  toast((kind==='logo'?'Logo':'Letterhead') + ' removed');
}

function applyStaticTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    el.textContent = tr(el.getAttribute('data-i18n'));
  });
}

/** Keeps the in-app background watermark (--brand-logo-img) showing the
 * shop's own uploaded logo once the owner has set one in Settings ›
 * Invoice branding, falling back to the default Pesa mark — same source
 * and precedence as the logo already drawn on invoices/receipts/reports.
 * Cheap and idempotent, so it's fine to call on every render(). */
function applyBrandLogo(){
  try{
    var url = (State.settings && State.settings.logoDataUrl) ? State.settings.logoDataUrl : PESA_LOGO_DATA_URL;
    document.documentElement.style.setProperty('--brand-logo-img', 'url("'+url+'")');
  }catch(e){}
}

  document.getElementById('shopNameEl').textContent = State.settings.shopName;
  document.getElementById('shopDateEl').textContent = new Date().toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
  var todayTotal = State.sales.filter(function(s){ return todayKey(new Date(s.createdAt))===todayKey(); }).reduce(function(s,x){return s+x.total;},0);
  document.getElementById('todayTotalEl').textContent = fmtMoney(todayTotal);
  updateSyncBadge();
}

function render(){
  updateHeader();
  // The hamburger lives in the persistent app-shell topbar, so it opens the
  // sidebar drawer from every tab, not just Dashboard — the sidebar is now
  // the one place that lists every page in the app (see openDashboardDrawer()).
  var menuBtn = document.getElementById('menuBtn');
  if(menuBtn) menuBtn.style.display = 'flex';
  applyStaticTranslations();
  document.documentElement.setAttribute('lang', currentLangCode()==='en' ? 'en' : currentLangCode());
  var content = document.getElementById('content');
  var html = '';
  if(State.tab === 'dashboard') html = renderDashboard();
  else if(State.tab === 'sell') html = renderSell();
  else if(State.tab === 'stock') html = renderStock();
  else if(State.tab === 'credit') html = renderCredit();
  else if(State.tab === 'expenses') html = renderExpenses();
  else if(State.tab === 'till') html = renderTill();
  else if(State.tab === 'invoices') html = renderInvoicesPage();
  else if(State.tab === 'reports') html = renderReportsPage();
  content.innerHTML = html;
  wireContent();
  renderCartBar();
  renderSidebar();
  if(!_reportsAutoFileDone) setTimeout(maybeAutoFileReports, 0);

  // FAB for stock/credit/expenses (add new)
  var oldFab = document.getElementById('fabBtn');
  if(oldFab) oldFab.remove();
  if((State.tab === 'stock' || State.tab === 'credit' || State.tab === 'expenses') && !selState(State.tab).active){
    var fab = document.createElement('button');
    fab.className = 'fab'; fab.id = 'fabBtn';
    fab.innerHTML = ICONS.plus;
    fab.addEventListener('click', function(){
      if(State.tab === 'stock') openProductSheet(null);
      else if(State.tab === 'credit') openCustomerSheet(null);
      else openExpenseSheet(null);
    });
    document.getElementById('app').appendChild(fab);
  }
}

function openBarcodeScanSheet(onCode){
  var supportsDetector = ('BarcodeDetector' in window);
  var html = '<div class="sheet-head"><h2>Scan barcode</h2></div>' +
    (supportsDetector ?
      '<div id="bcCamWrap" style="position:relative;border-radius:12px;overflow:hidden;background:#000;margin-bottom:12px;">' +
        '<video id="bcVideo" playsinline autoplay muted style="width:100%;display:block;max-height:260px;object-fit:cover;"></video>' +
        '<div style="position:absolute;inset:0;border:2px solid rgba(255,255,255,0.5);pointer-events:none;"></div>' +
      '</div><div id="bcCamStatus" class="banner">Point the camera at a barcode…</div>'
      : '<div class="banner">'+ICONS.warn+'<span>Camera barcode scanning isn’t supported in this browser. Type the barcode instead.</span></div>') +
    '<div class="field"><label>Barcode number</label><div style="display:flex;gap:8px;"><input id="bcManual" inputmode="numeric" placeholder="Type or scan a barcode" style="flex:1;"><button class="btn btn-primary" id="bcManualBtn" type="button">Use</button></div></div>';
  var ov = openSheet(html, {center:true});
  var stream = null, detecting = false, rafId = null, detector = null;
  function stopCam(){
    detecting = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  }
  function finish(code){
    stopCam();
    closeModal();
    if(onCode) onCode(String(code).trim());
  }
  ov.querySelector('#bcManualBtn').addEventListener('click', function(){
    var v = ov.querySelector('#bcManual').value.trim();
    if(!v){ toast('Type a barcode number first'); return; }
    finish(v);
  });
  ov.querySelector('#bcManual').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); ov.querySelector('#bcManualBtn').click(); }
  });
  if(supportsDetector){
    (async function(){
      try{
        detector = new window.BarcodeDetector({ formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code','itf'] });
      }catch(e){
        var st = ov.querySelector('#bcCamStatus');
        if(st) st.innerHTML = ICONS.warn+'<span>Couldn’t start the scanner. Type the barcode instead.</span>';
        return;
      }
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' } });
      }catch(e){
        var st2 = ov.querySelector('#bcCamStatus');
        if(st2) st2.innerHTML = ICONS.warn+'<span>Camera access was denied. Type the barcode instead.</span>';
        var wrap = ov.querySelector('#bcCamWrap'); if(wrap) wrap.style.display = 'none';
        return;
      }
      var video = ov.querySelector('#bcVideo');
      if(!video || !document.body.contains(video)){ stopCam(); return; }
      video.srcObject = stream;
      detecting = true;
      var loop = async function(){
        if(!detecting) return;
        try{
          var codes = await detector.detect(video);
          if(codes && codes.length){ finish(codes[0].rawValue); return; }
        }catch(e){ /* keep trying */ }
        rafId = requestAnimationFrame(loop);
      };
      loop();
    })();
  }
  var origClose = closeModal;
  // Ensure the camera stops if the sheet is dismissed some other way (overlay tap / back).
  var overlayEl = document.querySelector('.overlay');
  if(overlayEl){
    overlayEl.addEventListener('click', function(e){ if(e.target === overlayEl) stopCam(); });
  }
}

/* ============================== BLUETOOTH THERMAL RECEIPT PRINTING ============================== */
var BLE_PRINTER_SERVICES = ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 0xFFE0, 0xFF00];
var BLE_PRINTER_WRITE_CHARS = ['00002af1-0000-1000-8000-00805f9b34fb', '49535343-8841-43f4-a8d4-ecbe34729bb3', 0xFFE1];
var blePrinterDevice = null, blePrinterChar = null;

function bluetoothSupported(){ return !!(navigator && navigator.bluetooth); }

async function connectBluetoothPrinter(){
  if(!bluetoothSupported()) throw new Error('unsupported');
  var device = await navigator.bluetooth.requestDevice({
    filters: BLE_PRINTER_SERVICES.map(function(s){ return { services:[s] }; }),
    optionalServices: BLE_PRINTER_SERVICES
  });
  var server = await device.gatt.connect();
  var char = null;
  for(var i=0;i<BLE_PRINTER_SERVICES.length && !char; i++){
    try{
      var service = await server.getPrimaryService(BLE_PRINTER_SERVICES[i]);
      var chars = await service.getCharacteristics();
      char = chars.find(function(c){ return c.properties.write || c.properties.writeWithoutResponse; }) || null;
    }catch(e){ /* try next known service uuid */ }
  }
  if(!char) throw new Error('no-writable-characteristic');
  blePrinterDevice = device;
  blePrinterChar = char;
  return { device: device, char: char };
}

function escposReceiptBytes(draft, shopName){
  var lines = [];
  var ESC = '\x1b', GS = '\x1d';
  lines.push(ESC + '@'); // init
  lines.push(ESC + 'a' + '\x01'); // center
  lines.push((shopName || 'Pesa') + '\n');
  lines.push(ESC + 'a' + '\x00'); // left
  lines.push('--------------------------------\n');
  lines.push('Receipt ' + (draft.number||'') + '\n');
  lines.push((draft.dateStr||'') + '\n');
  if(draft.billToName) lines.push('Customer: ' + draft.billToName + '\n');
  lines.push('--------------------------------\n');
  var total = 0;
  (draft.items||[]).forEach(function(it){
    var lineTotal = (it.qty||0) * (it.unitPrice||0);
    total += lineTotal;
    var name = String(it.desc||'').slice(0,20);
    lines.push(name + '\n');
    lines.push('  ' + it.qty + ' x ' + fmtMoney(it.unitPrice) + ' = ' + fmtMoney(lineTotal) + '\n');
  });
  lines.push('--------------------------------\n');
  lines.push('TOTAL: ' + fmtMoney(total) + '\n');
  lines.push('\n');
  lines.push('Thank you!\n');
  lines.push('\n\n\n');
  lines.push(GS + 'V' + '\x42' + '\x00'); // partial cut
  var text = lines.join('');
  var bytes = [];
  for(var i=0;i<text.length;i++) bytes.push(text.charCodeAt(i) & 0xFF);
  return new Uint8Array(bytes);
}

async function writeBleInChunks(char, bytes){
  var chunkSize = 180;
  for(var i=0;i<bytes.length;i+=chunkSize){
    var chunk = bytes.slice(i, i+chunkSize);
    if(char.properties.writeWithoutResponse){ await char.writeValueWithoutResponse(chunk); }
    else { await char.writeValue(chunk); }
  }
}

async function printReceiptViaBluetooth(draft, btn){
  if(!bluetoothSupported()){ toast('Bluetooth printing isn’t supported on this device/browser'); return; }
  var oldLabel = btn ? btn.textContent : '';
  try{
    if(btn){ btn.disabled = true; btn.textContent = 'Connecting…'; }
    if(!blePrinterChar){ await connectBluetoothPrinter(); }
    if(btn) btn.textContent = 'Printing…';
    var bytes = escposReceiptBytes(draft, State.settings.shopName);
    await writeBleInChunks(blePrinterChar, bytes);
    toast('Sent to printer');
  }catch(e){
    if(e && e.name === 'NotFoundError'){ toast('No printer selected'); }
    else toast('Couldn’t print — check the printer is on and paired');
    blePrinterDevice = null; blePrinterChar = null;
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = oldLabel || 'Print via Bluetooth'; }
  }
}

function bluetoothPrintButtonHtml(id){
  var supported = bluetoothSupported();
  return '<button class="btn btn-ghost btn-block" id="'+id+'" type="button" '+(supported?'':'disabled title="Bluetooth printing isn’t supported on this device/browser"')+' style="'+(supported?'':'opacity:.55;')+'">'+ (supported ? 'Print via Bluetooth' : 'Bluetooth printing unavailable') +'</button>';
}

/* ============================== SALES INSIGHTS (dashboard) ============================== */
var _insightsOpen = false;
function computeSalesInsights(sales){
  var byQty = {}, byRev = {}, byDow = [0,0,0,0,0,0,0], byHour = new Array(24).fill(0);
  sales.forEach(function(s){
    var d = new Date(s.createdAt);
    byDow[(d.getDay()+6)%7] += s.total; // Mon=0..Sun=6
    byHour[d.getHours()] += s.total;
    (s.items||[]).forEach(function(it){
      byQty[it.name] = (byQty[it.name]||0) + it.qty;
      byRev[it.name] = (byRev[it.name]||0) + it.lineTotal;
    });
  });
  var toSorted = function(obj, asc){
    return Object.keys(obj).map(function(k){ return {name:k, v:obj[k]}; }).sort(function(a,b){ return asc ? a.v-b.v : b.v-a.v; });
  };
  return {
    bestByQty: toSorted(byQty).slice(0,5),
    bestByRev: toSorted(byRev).slice(0,5),
    worst: toSorted(byQty, true).slice(0,5),
    byDow: byDow,
    byHour: byHour
  };
}
function dashboardInsightsHtml(){
  if(State.sales.length === 0) return '';
  var insights = computeSalesInsights(State.sales);
  var dowLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var dowMax = Math.max.apply(null, insights.byDow.concat([1]));
  var hourMax = Math.max.apply(null, insights.byHour.concat([1]));
  var barList = function(items, fmt){
    if(items.length===0) return '<div style="color:var(--text-muted);font-size:13px;">No data yet.</div>';
    var max = Math.max.apply(null, items.map(function(i){return i.v;}).concat([1]));
    return items.map(function(it){ return '<div class="barrow"><div class="bl">'+esc(it.name)+'</div><div class="btrack"><div class="bfill" style="width:'+(it.v/max*100)+'%"></div></div><div class="bv num">'+fmt(it.v)+'</div></div>'; }).join('');
  };
  var html = '<div class="section-title" id="insightsToggle" style="cursor:pointer;display:flex;align-items:center;gap:6px;">Sales insights <span style="font-weight:400;color:var(--text-muted);text-transform:none;letter-spacing:0;">('+(_insightsOpen?'hide':'show')+')</span></div>';
  if(!_insightsOpen) return html;
  html += '<div class="card pad" style="display:flex;flex-direction:column;gap:14px;">' +
    '<div><div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;">Best sellers by quantity</div>' + barList(insights.bestByQty, function(v){ return v+''; }) + '</div>' +
    '<div><div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;">Best sellers by revenue</div>' + barList(insights.bestByRev, fmtMoney) + '</div>' +
    '<div><div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;">Slowest sellers</div>' + barList(insights.worst, function(v){ return v+''; }) + '</div>' +
    '<div><div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;">Sales by day of week</div>' +
      insights.byDow.map(function(v,i){ return '<div class="barrow"><div class="bl">'+dowLabels[i]+'</div><div class="btrack"><div class="bfill" style="width:'+(v/dowMax*100)+'%"></div></div><div class="bv num">'+fmtMoney(v)+'</div></div>'; }).join('') +
    '</div>' +
    '<div><div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;">Sales by hour of day</div>' +
      '<div style="display:flex;align-items:flex-end;gap:2px;height:70px;">' + insights.byHour.map(function(v){ return '<div style="flex:1;background:var(--primary);opacity:'+(v>0?1:0.12)+';height:'+Math.max(3,(v/hourMax*100))+'%;border-radius:2px 2px 0 0;"></div>'; }).join('') + '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--text-muted);margin-top:3px;"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span></div>' +
    '</div>' +
  '</div>';
  return html;
}

/* ============================== SYNC STATUS ============================== */
function syncStatusHtml(){
  var dot, label;
  if(Store.isCloud()){
    dot = State.online ? 'var(--success)' : 'var(--danger)';
    label = State.online ? 'Synced' : 'Offline';
  } else if(window.claude && window.claude.use){
    // We are on the artifact host but running on the local fallback — either
    // still connecting, or genuinely offline; either way data is queued locally.
    dot = 'var(--warn, #d98e2b)';
    label = State.online ? 'Syncing…' : ('Offline — ' + localPendingCount() + ' pending');
  } else {
    dot = State.online ? 'var(--success)' : 'var(--danger)';
    label = State.online ? 'Online (device only)' : 'Offline (device only)';
  }
  return '<div class="syncbadge" id="syncBadge" title="'+esc(label)+'" style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-muted);">' +
    '<span style="width:7px;height:7px;border-radius:50%;background:'+dot+';flex-shrink:0;"></span><span>'+esc(label)+'</span>' +
  '</div>';
}
function localPendingCount(){
  try{
    var all = JSON.parse(localStorage.getItem('otengu_shop_local_v1')||'{}');
    var n = 0;
    Object.keys(all).forEach(function(k){ n += Object.keys(all[k]||{}).length; });
    return n;
  }catch(e){ return 0; }
}
function updateSyncBadge(){
  var slot = document.getElementById('syncBadgeSlot');
  if(!slot) return;
  slot.innerHTML = syncStatusHtml();
}
window.addEventListener('online', function(){ State.online = true; updateSyncBadge(); attemptCloudReconnect(); });
window.addEventListener('offline', function(){ State.online = false; updateSyncBadge(); });

var _reconnectTried = false;
function attemptCloudReconnect(){
  // Only meaningful inside the Claude artifact host, when we're currently on
  // the local fallback (e.g. the very first window.claude.use('db') attempt
  // failed while offline at cold load). GitHub Pages has no cloud db at all,
  // so there is nothing to reconnect to there — the badge there only ever
  // reflects navigator.onLine, never claims a cloud sync that can't exist.
  if(Store.isCloud() || !(window.claude && window.claude.use) || _reconnectTried) return;
  _reconnectTried = true;
  (async function(){
    try{
      var ns = await window.claude.use('db');
      if(!ns){ _reconnectTried = false; return; }
      State.syncing = true; updateSyncBadge();
      // Push every locally-queued record up into the matching cloud collection,
      // using the same ids so a record already pushed is simply overwritten
      // rather than duplicated.
      var all = JSON.parse(localStorage.getItem('otengu_shop_local_v1')||'{}');
      var paths = Object.keys(all);
      for(var i=0;i<paths.length;i++){
        var path = paths[i];
        if(path.indexOf('/')>-1) continue; // skip nested sub-collections (e.g. ledger) — top-level only for this migration
        var coll = ns.collection(path);
        var ids = Object.keys(all[path]||{});
        for(var j=0;j<ids.length;j++){
          try{ await coll.doc(ids[j]).set(all[path][ids[j]]); }catch(e2){ /* keep going */ }
        }
      }
      toast('Reconnected — your offline sales and changes are now synced to the cloud');
      // Reload so every part of the app re-subscribes cleanly against the
      // now-available cloud database instead of the local fallback.
      setTimeout(function(){ location.reload(); }, 1200);
    }catch(e){
      _reconnectTried = false; // allow a later retry (e.g. next 'online' event)
    }
  })();
}
setInterval(function(){ if(State.online) attemptCloudReconnect(); }, 20000);

/* ============================== NAMRA VAT SUMMARY ============================== */
function openVatSummarySheet(){
  var rate = (State.settings.vatRate!=null) ? State.settings.vatRate : 15;
  var now = new Date();
  var defFrom = todayKey(new Date(now.getFullYear(), now.getMonth(), 1));
  var defTo = todayKey(now);
  var html = '<div class="sheet-head"><h2>NamRA VAT summary</h2></div>' +
    '<div class="banner">Uses your company’s VAT number (from Company details) and the VAT rate below, applied to sales and expenses as VAT-inclusive amounts.</div>' +
    '<div class="field"><label>VAT rate (%)</label><input id="vatRate" type="number" inputmode="decimal" step="0.1" value="'+rate+'"></div>' +
    '<div class="field-row"><div class="field"><label>From</label><input id="vatFrom" type="date" value="'+defFrom+'"></div><div class="field"><label>To</label><input id="vatTo" type="date" value="'+defTo+'"></div></div>' +
    '<div id="vatResult"></div>' +
    '<div class="actions"><button class="btn btn-accent btn-block" id="vatDownloadBtn">Download VAT summary (PDF)</button></div>';
  var ov = openSheet(html);
  function compute(){
    var r = parseFloat(ov.querySelector('#vatRate').value) || 0;
    var from = ov.querySelector('#vatFrom').value, to = ov.querySelector('#vatTo').value;
    var fromD = from ? new Date(from+'T00:00:00') : new Date(0);
    var toD = to ? new Date(to+'T23:59:59') : new Date();
    var sales = State.sales.filter(function(s){ var d=new Date(s.createdAt); return d>=fromD && d<=toD; });
    var expenses = State.expenses.filter(function(e){ var d=new Date(e.createdAt); return d>=fromD && d<=toD; });
    var salesTotal = sales.reduce(function(s,x){ return s+x.total; },0);
    var expTotal = expenses.reduce(function(s,x){ return s+x.amount; },0);
    var outputVat = salesTotal * r / (100+r);
    var inputVat = expTotal * r / (100+r);
    var net = outputVat - inputVat;
    return { r:r, from:from, to:to, salesTotal:salesTotal, expTotal:expTotal, outputVat:outputVat, inputVat:inputVat, net:net };
  }
  function renderResult(){
    var c = compute();
    ov.querySelector('#vatResult').innerHTML =
      '<div class="tillcard">' +
      '<div class="tillrow"><span class="l">Total sales (incl. VAT)</span><span class="v num">'+fmtMoney(c.salesTotal)+'</span></div>' +
      '<div class="tillrow"><span class="l">Output VAT</span><span class="v num">'+fmtMoney(c.outputVat)+'</span></div>' +
      '<div class="tillrow"><span class="l">Total expenses (incl. VAT)</span><span class="v num">'+fmtMoney(c.expTotal)+'</span></div>' +
      '<div class="tillrow"><span class="l">Input VAT</span><span class="v num">'+fmtMoney(c.inputVat)+'</span></div>' +
      '<div class="tillrow grand"><span class="l">Net VAT '+(c.net>=0?'payable':'refundable')+'</span><span class="v num">'+fmtMoney(Math.abs(c.net))+'</span></div>' +
      '</div>';
  }
  renderResult();
  ov.querySelector('#vatRate').addEventListener('input', renderResult);
  ov.querySelector('#vatFrom').addEventListener('change', renderResult);
  ov.querySelector('#vatTo').addEventListener('change', renderResult);
  ov.querySelector('#vatDownloadBtn').addEventListener('click', async function(){
    var c = compute();
    State.settings = Object.assign({}, State.settings, { vatRate: c.r });
    refs.settings.set(State.settings);
    var btn = ov.querySelector('#vatDownloadBtn');
    btn.disabled = true; var old = btn.textContent; btn.textContent = 'Preparing…';
    var ready = await ensureJsPDF();
    if(!ready){ btn.disabled=false; btn.textContent=old; toast('Couldn’t load the PDF engine — check your connection and try again'); return; }
    var JsPDFCtor = getJsPDF();
    // mm units (not pt) so this can share drawDocHeader() with the
    // invoice/receipt/report PDFs — that's what puts the shop's logo (or
    // the default Pesa mark) at the top of this document too.
    var doc = new JsPDFCtor({ unit:'mm', format:'a4' });
    var head = drawDocHeader(doc);
    var margin = head.margin, contentW = head.contentW, pageW = head.pageW, y = head.y;
    var t = head.t, primary=t.primary, muted=t.muted, dark=t.dark;

    doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(primary[0],primary[1],primary[2]);
    doc.text(State.settings.shopName || 'Pesa', margin, y+6);
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(muted[0],muted[1],muted[2]);
    doc.text('NamRA VAT summary', margin, y+12);
    doc.text('Generated '+fmtDateNice(new Date()), pageW-margin, y+6, {align:'right'});
    y += 20;
    doc.setDrawColor(220,224,218); doc.line(margin,y,pageW-margin,y); y+=9;

    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(dark[0],dark[1],dark[2]);
    if(State.company && State.company.vatNumber){ doc.text('VAT number: '+State.company.vatNumber, margin, y); y += 6; }
    doc.text('Period: '+(c.from||'—')+' to '+(c.to||'—'), margin, y); y += 6;
    doc.text('VAT rate: '+c.r+'%', margin, y); y += 10;

    var rows = [
      ['Total sales (incl. VAT)', fmtMoney(c.salesTotal)],
      ['Output VAT', fmtMoney(c.outputVat)],
      ['Total expenses (incl. VAT)', fmtMoney(c.expTotal)],
      ['Input VAT', fmtMoney(c.inputVat)],
      ['Net VAT ' + (c.net>=0?'payable':'refundable'), fmtMoney(Math.abs(c.net))]
    ];
    rows.forEach(function(r, i){
      var last = i===rows.length-1;
      if(last){ doc.setDrawColor(220,224,218); doc.line(margin,y-4,pageW-margin,y-4); y += 2; }
      pdfSummaryLine(doc, margin, y, contentW, r[0], r[1], {bold:last, size: last?12:10});
      y += last ? 9 : 6.5;
    });
    y += 8;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(muted[0],muted[1],muted[2]);
    var vatNoteLines = doc.splitTextToSize('This is a working summary generated from your recorded sales and expenses. Please confirm figures and filing requirements with NamRA.', contentW);

    saveGeneratedPdf(doc, 'namra-vat-summary-'+(c.from||'')+'_to_'+(c.to||'')+'.pdf').then(function(ok){
      btn.disabled=false; btn.textContent=old;
      if(ok) toast('VAT summary downloaded');
    });
  });
}

var _trainState = { lessonId:null, idx:0, playing:false, autoTimer:null };

function speechSupported(){
  return typeof window!=='undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
}

function stopNarration(){
  _trainState.playing = false;
  if(_trainState.autoTimer){ clearTimeout(_trainState.autoTimer); _trainState.autoTimer = null; }
  try{ if(speechSupported()) window.speechSynthesis.cancel(); }catch(e){}
}

// Picks a slower, clearly spoken male English voice for lesson narration,
// where the browser or operating system exposes one. Voice names and lang
// codes vary a lot by platform, so this uses a broad set of common signals
// (the word "male" in the name, and well known male voice names on major
// platforms) rather than relying on any single exact match. Falls back to
// the first available English voice, and ultimately to the browser's own
// default voice, so narration always still works on a device that has no
// labelled male voice installed.
var _narrationVoice = null;
var MALE_VOICE_HINTS = ['male','david','mark','daniel','alex','fred','george','james','oliver','ryan','guy','tom','arthur','matthew','brian','eric','justin','paul','liam','ravi'];
function pickNarrationVoice(voices){
  if(!voices || !voices.length) return null;
  var english = voices.filter(function(v){ return /^en(-|_|$)/i.test(v.lang||''); });
  var pool = english.length ? english : voices;
  function score(v){
    var name = (v.name||'').toLowerCase(), lang = (v.lang||'').toLowerCase(), s = 0;
    if(MALE_VOICE_HINTS.some(function(h){ return name.indexOf(h)!==-1; })) s += 10;
    if(name.indexOf('female')!==-1) s -= 10;
    if(lang==='en-gb') s += 3;
    if(lang==='en-us') s += 2;
    if(v.localService) s += 1;
    return s;
  }
  var best = pool[0], bestScore = -Infinity;
  pool.forEach(function(v){ var s = score(v); if(s>bestScore){ bestScore=s; best=v; } });
  return best;
}
function refreshNarrationVoice(){
  try{
    var voices = window.speechSynthesis.getVoices();
    if(voices && voices.length) _narrationVoice = pickNarrationVoice(voices);
  }catch(e){}
}
(function setupNarrationVoice(){
  if(!speechSupported()) return;
  try{
    refreshNarrationVoice();
    // Many browsers (notably Chrome) load their voice list asynchronously,
    // so the very first getVoices() call above can come back empty. This
    // event fires once the real list is ready, and we re-pick from it.
    window.speechSynthesis.onvoiceschanged = refreshNarrationVoice;
  }catch(e){}
})();

function openLessonSlideshow(lessonId){
  var lesson = LESSONS.filter(function(l){ return l.id===lessonId; })[0];
  if(!lesson) return;
  stopNarration();
  _trainState.lessonId = lessonId;
  _trainState.idx = 0;
  var supported = speechSupported();

  function renderSlide(){
    var ov = document.querySelector('#modalRoot .sheet');
    if(!ov) return;
    var i = _trainState.idx, n = lesson.slides.length, slide = lesson.slides[i];
    var pct = Math.round(((i+1)/n)*100);
    var muted = !(State.settings.soundEnabled!==false);
    ov.querySelector('#lsBody').innerHTML =
      '<div class="lesson-progress">'+tr('Slide')+' '+(i+1)+' '+tr('of')+' '+n+'</div>' +
      '<div class="lesson-progressbar"><div class="fill" style="width:'+pct+'%;"></div></div>' +
      '<div class="lesson-slide"><div class="ico">'+ICONS[lesson.icon]+'</div>' +
        '<h3>'+esc(tr(slide.title))+'</h3>' +
        '<p>'+esc(tr(slide.text))+'</p>' +
      '</div>' +
      (supported ?
        '<div class="lesson-controls">' +
          '<button class="icon-btn" id="lsPrev" type="button" aria-label="Previous" '+(i===0?'disabled style="opacity:.4;"':'')+'>'+ICONS.back+'</button>' +
          '<button class="icon-btn" id="lsMute" type="button" aria-label="Mute">'+(muted?ICONS.soundOff:ICONS.soundOn)+'</button>' +
          '<button class="btn btn-primary navbig" id="lsPlay" type="button">'+(_trainState.playing?tr('Pause'):tr('Play'))+'</button>' +
          '<button class="icon-btn" id="lsNext" type="button" aria-label="Next" '+(i===n-1?'disabled style="opacity:.4;"':'')+'><span style="display:inline-block;transform:rotate(180deg);">'+ICONS.back+'</span></button>' +
        '</div>'
        :
        '<div class="lesson-controls">' +
          '<button class="btn btn-ghost navbig" id="lsPrev" type="button" '+(i===0?'disabled':'')+'>'+tr('Previous')+'</button>' +
          '<button class="btn btn-primary navbig" id="lsNext" type="button" '+(i===n-1?'disabled':'')+'>'+tr('Next')+'</button>' +
        '</div>'
      );
    wireSlideButtons();
    if(supported && State.settings.soundEnabled!==false){ startNarration(); } else { _trainState.playing=false; }
  }

  function goTo(newIdx){
    stopNarration();
    _trainState.idx = Math.max(0, Math.min(lesson.slides.length-1, newIdx));
    renderSlide();
  }

  function startNarration(){
    if(!supported || State.settings.soundEnabled===false) return;
    try{ window.speechSynthesis.cancel(); }catch(e){}
    var slide = lesson.slides[_trainState.idx];
    var u = new SpeechSynthesisUtterance(slide.title + '. ' + slide.text);
    if(!_narrationVoice) refreshNarrationVoice();
    if(_narrationVoice){ u.voice = _narrationVoice; u.lang = _narrationVoice.lang || 'en-US'; }
    else { u.lang = 'en-US'; }
    u.rate = 0.82; // slower than the default 1.0, for clear, easy to follow speech
    u.pitch = 1;
    u.onend = function(){
      _trainState.playing = false;
      var btn = document.getElementById('lsPlay');
      if(btn) btn.textContent = tr('Play');
      // Auto-advance to the next slide once narration finishes, after a
      // short, natural pause — but only if the user hasn't navigated away.
      if(_trainState.idx < lesson.slides.length-1){
        _trainState.autoTimer = setTimeout(function(){ goTo(_trainState.idx+1); }, 900);
      }
    };
    u.onerror = function(){ _trainState.playing = false; };
    _trainState.playing = true;
    try{ window.speechSynthesis.speak(u); }catch(e){ _trainState.playing = false; }
  }

  function togglePlay(){
    if(!supported) return;
    if(_trainState.playing){
      try{ window.speechSynthesis.pause(); }catch(e){}
      _trainState.playing = false;
      if(_trainState.autoTimer){ clearTimeout(_trainState.autoTimer); _trainState.autoTimer = null; }
    } else {
      try{
        if(window.speechSynthesis.paused){ window.speechSynthesis.resume(); _trainState.playing = true; }
        else { startNarration(); }
      }catch(e){ startNarration(); }
    }
    var btn = document.getElementById('lsPlay');
    if(btn) btn.textContent = _trainState.playing ? tr('Pause') : tr('Play');
  }

  function toggleMute(){
    var next = (State.settings.soundEnabled===false); // currently muted -> unmute, and vice versa
    State.settings = Object.assign({}, State.settings, { soundEnabled: next });
    refs.settings.set(State.settings);
    if(!next){ stopNarration(); } else { startNarration(); }
    renderSlide();
  }

  function wireSlideButtons(){
    var ov = document.querySelector('#modalRoot .sheet');
    if(!ov) return;
    var prev = ov.querySelector('#lsPrev'); if(prev) prev.addEventListener('click', function(){ if(_trainState.idx>0) goTo(_trainState.idx-1); });
    var next = ov.querySelector('#lsNext'); if(next) next.addEventListener('click', function(){ if(_trainState.idx<lesson.slides.length-1) goTo(_trainState.idx+1); });
    var play = ov.querySelector('#lsPlay'); if(play) play.addEventListener('click', togglePlay);
    var mute = ov.querySelector('#lsMute'); if(mute) mute.addEventListener('click', toggleMute);
  }

  var html = '<div class="sheet-head"><button class="drawer-close" id="lsBack" type="button" aria-label="Back">'+ICONS.back+'</button><h2 style="flex:1;">'+esc(tr(lesson.title))+'</h2></div>' +
    '<div id="lsBody"></div>';
  var ov = openSheet(html);
  ov.querySelector('#lsBack').addEventListener('click', function(){ stopNarration(); closeModal(); openTrainingSheet(); });
  renderSlide();
}
