function finalizeSale(method, customer){
  var items = State.cart.map(function(i){ return { productId:i.productId, name:i.name, qty:i.qty, unitPrice:i.unitPrice, cost:i.cost||0, lineTotal:i.unitPrice*i.qty }; });
  var total = cartTotal();
  var cost = cartCost();
  var sale = {
    items: items,
    total: total,
    cost: cost,
    profit: total - cost,
    paymentMethod: method,
    customerId: customer ? customer.id : null,
    customerName: customer ? customer.name : null,
    tillId: State.till.current ? State.till.current.id : null,
    cashierName: State.session ? State.session.name : null,
    branchId: (State.settings.currentBranchId && State.settings.currentBranchId!=='all') ? State.settings.currentBranchId : null,
    createdAt: new Date().toISOString()
  };
  refs.sales.add(sale).then(function(ref){ logAudit('create','sale', ref&&ref.id, (items.length)+' item(s), '+fmtMoney(total)); });
  // decrement stock
  var stockChanges = [];
  items.forEach(function(it){
    var p = State.products.find(function(x){ return x.id===it.productId; });
    if(p && p.stockQty!=null){
      var newQty = Math.max(0, p.stockQty - it.qty);
      refs.products.doc(p.id).update({ stockQty: newQty });
      stockChanges.push({ product:p, newQty:newQty });
    }
  });
  checkLowStockAlerts(stockChanges);
  // credit ledger
  if(method === 'credit' && customer){
    var newBal = (customer.balance||0) + total;
    refs.customers.doc(customer.id).update({ balance: newBal });
    refs.customers.doc(customer.id).collection('ledger').add({ type:'charge', amount: total, note:'Sale on credit', createdAt:new Date().toISOString(), balanceAfter:newBal });
  }
  State.cart = [];
  closeModal();
  renderCartBar();
  toast('Sale recorded — ' + fmtMoney(total));
  offerSaleReceipt(sale, customer);
}

    dateStr: todayKey(),
    dueDateStr: '',
    notes: '',
    items: (sale.items||[]).map(function(it){ return { desc: it.name, qty: it.qty, unitPrice: it.unitPrice }; })
  };
  var sendKind = sale.paymentMethod === 'credit' ? 'invoice' : 'receipt';
  var html = '<div class="sheet-head"><h2>'+tr('Sale recorded')+'</h2></div>' +
    '<div style="font-size:14px;color:var(--text-muted);margin-bottom:16px;">Total '+fmtMoney(sale.total)+'. Print a receipt for the customer?</div>' +
    '<div class="actions">' +

  var ov = openSheet(html, {center:true});

  ov.querySelector('#saleSendBtn').addEventListener('click', function(){
    openSendSheet(documentSendCtx(draft, sendKind, {
      customerId: customer ? customer.id : null,
      onHandedOff: function(){ if(!saleNumberCommitted){ saleNumberCommitted = true; commitInvoiceNumber(draft, sendKind, customer ? customer.id : null); } }
    }));
  });
  var btPrintBtn = ov.querySelector('#saleBtPrintBtn');
  if(btPrintBtn && !btPrintBtn.disabled) btPrintBtn.addEventListener('click', function(){ printReceiptViaBluetooth(draft, btPrintBtn); });
  ov.querySelector('#saleReceiptBtn').addEventListener('click', async function(){
    var btn = ov.querySelector('#saleReceiptBtn');

    saveGeneratedPdf(doc, 'receipt-'+todayKey()+'-'+sale.total+'.pdf').then(function(ok){

      refs.products.doc().set(data);

/* ============================== BULK STOCK IMPORT ============================== */
var Bulk = { rows: [] };

function parseNum(s){
  if(s==null || s==='') return 0;
  var n = parseFloat(String(s).replace(/[^\d.\-]/g,''));
  return isNaN(n) ? 0 : n;
}

function parsePastedText(text){
  var lines = String(text||'').split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  var rows = [], skipped = 0;
  lines.forEach(function(line){
    if(/^name\s*,/i.test(line)) return; // skip an obvious header line
    var parts = line.split(',').map(function(p){ return p.trim(); });
    var name = parts[0];
    if(!name){ skipped++; return; }
    rows.push({
      id: uid(), name: name,
      costPrice: parseNum(parts[1]),
      sellPrice: parseNum(parts[2]),
      stockQty: parts[3]!=null ? (parseInt(parts[3],10)||0) : 0,
      category: parts[4] || '',
      unit: parts[5] || '',
      lowStock: null
    });
  });
  return { rows:rows, skipped:skipped };
}

function parseCsvLine(line){
  var result = [], cur = '', inQuotes = false;
  for(var i=0;i<line.length;i++){
    var c = line[i];
    if(c === '"'){ inQuotes = !inQuotes; }
    else if(c === ',' && !inQuotes){ result.push(cur); cur=''; }
    else cur += c;
  }
  result.push(cur);
  return result.map(function(s){ return s.trim().replace(/^"|"$/g,''); });
}

function parseCsvText(text){
  var lines = String(text||'').split(/\r?\n/).filter(function(l){ return l.trim().length>0; });
  if(lines.length===0) return { rows:[], skipped:0 };
  var header = parseCsvLine(lines[0]).map(function(h){ return h.toLowerCase(); });
  var hasHeader = header.some(function(h){ return /name|product|item/.test(h); });
  var idx = { name:0, cost:1, sell:2, qty:3, category:4, unit:5, low:-1 };
  if(hasHeader){
    idx = { name:-1, cost:-1, sell:-1, qty:-1, category:-1, unit:-1, low:-1 };
    header.forEach(function(h,i){
      if(/name|product|item/.test(h)) idx.name=i;
      else if(/categ/.test(h)) idx.category=i;
      else if(/unit/.test(h)) idx.unit=i;
      else if(/cost/.test(h)) idx.cost=i;
      else if(/sell|price/.test(h)) idx.sell=i;
      else if(/qty|quantity|stock/.test(h)) idx.qty=i;
      else if(/low/.test(h)) idx.low=i;
    });
  }
  var dataLines = hasHeader ? lines.slice(1) : lines;
  var rows = [], skipped = 0;
  dataLines.forEach(function(line){
    var parts = parseCsvLine(line);
    var name = idx.name>-1 ? parts[idx.name] : '';
    if(!name){ skipped++; return; }
    rows.push({
      id: uid(), name: name,
      category: idx.category>-1 ? (parts[idx.category]||'') : '',
      unit: idx.unit>-1 ? (parts[idx.unit]||'') : '',
      costPrice: idx.cost>-1 ? parseNum(parts[idx.cost]) : 0,
      sellPrice: idx.sell>-1 ? parseNum(parts[idx.sell]) : 0,
      stockQty: idx.qty>-1 ? (parseInt(parts[idx.qty],10)||0) : 0,
      lowStock: idx.low>-1 && parts[idx.low] ? (parseInt(parts[idx.low],10)||null) : null
    });
  });
  return { rows:rows, skipped:skipped };
}

function handleCsvImport(file, statusEl){
  statusEl.innerHTML = '<div class="banner">Reading file…</div>';
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var res = parseCsvText(String(reader.result||''));
      if(res.rows.length===0){
        statusEl.innerHTML = '<div class="banner">'+ICONS.warn+'<span>No products found in that file.</span></div>';
        return;
      }
      Bulk.rows = Bulk.rows.concat(res.rows);
      statusEl.innerHTML = '<div class="banner" style="color:var(--success);"><span>Found '+res.rows.length+' product'+(res.rows.length===1?'':'s')+(res.skipped?' ('+res.skipped+' row'+(res.skipped===1?'':'s')+' skipped)':'')+'.</span></div>';
      renderBulkPreview();
    }catch(e){
      statusEl.innerHTML = '<div class="banner">'+ICONS.warn+'<span>Couldn’t read that file. Make sure it’s a .csv file.</span></div>';
    }
  };
  reader.onerror = function(){ statusEl.innerHTML = '<div class="banner">'+ICONS.warn+'<span>Couldn’t read that file.</span></div>'; };
  reader.readAsText(file);
}

function wireBulkPreview(){
  var list = document.getElementById('bulkRowList');
  if(!list) return;
  list.querySelectorAll('[data-brow]').forEach(function(cardEl){
    var id = cardEl.getAttribute('data-brow');
    var row = Bulk.rows.find(function(r){ return r.id===id; });
    if(!row) return;
    cardEl.querySelectorAll('[data-bf]').forEach(function(inp){
      inp.addEventListener('input', function(){
        var f = inp.getAttribute('data-bf');
        if(f==='costPrice' || f==='sellPrice'){ row[f] = parseFloat(inp.value)||0; }
        else if(f==='stockQty'){ row[f] = parseInt(inp.value,10)||0; }
        else { row[f] = inp.value; }
      });
    });
    var delBtn = cardEl.querySelector('[data-bdel]');
    if(delBtn) delBtn.addEventListener('click', function(){
      Bulk.rows = Bulk.rows.filter(function(r){ return r.id!==id; });
      renderBulkPreview();
    });
  });
}

  var rows = Bulk.rows.filter(function(r){ return r.name && r.name.trim(); });

  var commitBtn = document.getElementById('bulkCommitBtn');
  if(commitBtn){ commitBtn.disabled = true; commitBtn.textContent = 'Adding…'; }
  Promise.all(rows.map(function(r){
    return refs.products.doc().set({
      name: r.name.trim(), category:(r.category||'').trim(), unit:(r.unit||'').trim(),
      costPrice: r.costPrice||0, sellPrice: r.sellPrice||0, stockQty: r.stockQty||0,
      lowStock: r.lowStock!=null ? r.lowStock : null, createdAt: now, updatedAt: now
    });
  })).then(function(){
    closeModal();
    toast(rows.length + ' product' + (rows.length===1?'':'s') + ' added');
  }).catch(function(err){
    console.warn(err);
    toast('Some products could not be saved — try again');
    if(commitBtn){ commitBtn.disabled = false; commitBtn.textContent = 'Add ' + rows.length + ' product' + (rows.length===1?'':'s'); }
  });
}

function resizeImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxDim/Math.max(w,h));
        var tw = Math.max(1, Math.round(w*scale)), th = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement('canvas');
        canvas.width = tw; canvas.height = th;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,tw,th);
        ctx.drawImage(img, 0, 0, tw, th);
        resolve({ dataUrl: canvas.toDataURL('image/jpeg', quality||0.85), w:tw, h:th });
      };
      img.onerror = function(){ reject(new Error('bad image')); };
      img.src = String(reader.result||'');
    };
    reader.onerror = function(){ reject(new Error('read failed')); };
    reader.readAsDataURL(file);
  });
}

function getJsPDF(){ return (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : null; }
// The PDF library loads from an external CDN via a <script> tag; on a slow
// connection or right after a cold app launch it may not have finished
// loading yet by the time someone taps a PDF button. Poll briefly instead
// of failing immediately, so a slow-but-working load isn't mistaken for a
// broken one.
function ensureJsPDF(maxWaitMs){
  if(getJsPDF()) return Promise.resolve(true);
  maxWaitMs = maxWaitMs || 6000;
  return new Promise(function(resolve){
    var waited = 0, step = 150;
    var timer = setInterval(function(){
      if(getJsPDF()){ clearInterval(timer); resolve(true); return; }
      waited += step;
      if(waited >= maxWaitMs){ clearInterval(timer); resolve(false); }
    }, step);
  });
}
function fmtDateNice(d){ return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }

function hexToRgb(hex){
  hex = String(hex||'').replace('#','').trim();
  if(hex.length===3) hex = hex.split('').map(function(c){ return c+c; }).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(hex)) hex = '16463B';
  var num = parseInt(hex,16);
  return [(num>>16)&255, (num>>8)&255, num&255];
}

// Standard browser download — works anywhere the app is opened as a normal
// web page (e.g. installed from GitHub Pages), unlike the Claude-only
// 'downloads' capability which only exists inside the artifact host.
function browserDownload(filename, blob){
  try{
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return true;
  }catch(e){
    return false;
  }
}

async function saveGeneratedPdf(doc, filename){
  return saveBlobFile(filename, doc.output('blob'));
}
async function saveBlobFile(filename, blob){
  try{
    if(window.claude && window.claude.use){
      var dl = await window.claude.use('downloads');
      if(dl){
        await dl.save({ filename: filename, data: blob });
        return true;
      }
    }
  }catch(e){
    if(e && e.code === 'declined') return false;
    // fall through to the browser-native download below
  }
  if(browserDownload(filename, blob)) return true;
  toast('Couldn’t save the file — try again');
  return false;
}

/* ============================== SEND: email / WhatsApp / SMS ==============================
 * Everything here runs on the device. Pesa never sends a message by itself:
 * each channel opens the shop owner's own email, WhatsApp or SMS app with the
 * message (and, where the phone supports it, the PDF) already filled in, and
 * the owner taps Send there. Fully automatic sending would need a server and
 * a paid email/SMS provider account with secret keys, which a public web page
 * cannot hold safely, so it is deliberately not built.
 * Message text stays in plain English ASCII (no curly quotes or dashes) so
 * SMS stays in the cheap GSM character set and every mail app shows it
 * cleanly, whatever language the app itself is set to. */
function senderIdentity(){
  var c = State.company || {};
  return {
    name: State.settings.shopName || c.tradingName || c.companyName || 'Our shop',
    phone: c.phone || '',
    email: c.email || ''
  };
}
function senderContactLine(){
  var s = senderIdentity(), bits = [];
  if(s.phone) bits.push(s.phone);
  if(s.email) bits.push(s.email);
  return bits.join(' / ');
}
// Loose on purpose: something before an @, and a dot somewhere after it.
function looksLikeEmail(s){
  s = String(s||'').trim();
  var at = s.indexOf('@');
  if(at < 1 || /\s/.test(s)) return false;
  var dot = s.indexOf('.', at);
  return dot > at+1 && dot < s.length-1;
}
// Namibian numbers to international digits: "081 234 5678" -> "264812345678".
// Keeps +264 / 264 / 00264 as-is (minus the + or 00), and leaves other
// international numbers alone.
function normalizeNamPhone(raw){
  var s = String(raw||'').trim();
  if(!s) return '';
  s = s.replace(/[\s\-().\/]/g, '');
  if(s.charAt(0) === '+') s = s.slice(1);
  else if(s.indexOf('00') === 0) s = s.slice(2);
  else if(s.charAt(0) === '0') s = '264' + s.slice(1);
  else if(/^[68]\d{8}$/.test(s)) s = '264' + s;
  return s.replace(/\D/g, '');
}
function buildMailtoUrl(to, subject, body){
  var addr = String(to||'').split(/[;,]/).map(function(a){ return a.trim(); }).filter(Boolean)
    .map(function(a){ return encodeURIComponent(a).replace(/%40/g, '@'); }).join(',');
  return 'mailto:' + addr + '?subject=' + encodeURIComponent(subject||'') +
    '&body=' + encodeURIComponent(String(body||'').replace(/\r?\n/g, '\r\n'));
}
function buildWhatsAppUrl(phone, text){
  return 'https://wa.me/' + normalizeNamPhone(phone) + '?text=' + encodeURIComponent(text||'');
}
// "?&body=" is the form both iOS Messages and Android SMS apps accept.
function buildSmsUrl(phone, text){
  var n = normalizeNamPhone(phone);
  return 'sms:' + (n ? '+'+n : '') + '?&body=' + encodeURIComponent(text||'');
}
function openExternalUrl(url){
  try{
    if(/^https?:/i.test(url)){
      window.open(url, '_blank', 'noopener');
      return true;
    }
    var a = document.createElement('a');
    a.href = url; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    return true;
  }catch(e){ return false; }
}
// Pull the first email / phone number out of a free-text contact box.
function contactFromText(text){
  text = String(text||'');
  var em = text.match(/[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+/);
  var ph = text.match(/\+?\d[\d\s\-()]{6,}\d/);
  return { email: em ? em[0] : '', phone: ph ? ph[0].trim() : '' };
}
function findCustomerByName(name){
  name = String(name||'').trim().toLowerCase();
  if(!name) return null;
  return State.customers.find(function(c){ return (c.name||'').trim().toLowerCase() === name; }) || null;
}

/** Shared "Send" sheet. Opens on top of whatever sheet is showing (so an
 * invoice being edited is not lost) and closes back to it.
 * ctx = {
 *   title, summaryHtml,             // heading + one-line banner
 *   subject,                        // email subject
 *   emailBody(name), shortText(name, channel),  // message builders
 *   buildFile(): Promise<File|null> // optional PDF to attach
 *   defaultRecipient: 'c:<id>' | 's:<id>' | 'manual',
 *   manualEmail, manualPhone,       // prefill when no saved contact matches
 *   allowCustomers, allowSuppliers, // which saved contacts to offer
 *   audit: { action, entityType, entityId, label },
 *   onHandedOff(channel)            // called once the message is handed to an app
 * } */
function openSendSheet(ctx){
  var allowC = ctx.allowCustomers !== false, allowS = ctx.allowSuppliers !== false;
  var opts = '';
  if(allowC && State.customers.length){
    opts += '<optgroup label="'+esc(tr('Customers'))+'">' + State.customers.map(function(c){
      return '<option value="c:'+c.id+'">'+esc(c.name)+'</option>';
    }).join('') + '</optgroup>';
  }
  if(allowS && State.suppliers.length){
    opts += '<optgroup label="'+esc(tr('Suppliers'))+'">' + State.suppliers.map(function(s){
      return '<option value="s:'+s.id+'">'+esc(s.name)+'</option>';
    }).join('') + '</optgroup>';
  }
  opts += '<option value="manual">'+esc(tr('Someone else (type below)'))+'</option>';

  var root = document.getElementById('modalRoot');
  var overlay = document.createElement('div');
  overlay.className = 'overlay center send-overlay';
  overlay.innerHTML = '<div class="sheet">' +
    '<div class="sheet-head"><h2>'+esc(ctx.title)+'</h2></div>' +
    (ctx.summaryHtml ? '<div class="banner">'+ctx.summaryHtml+'</div>' : '') +
    '<div class="field"><label>'+tr('Send to')+'</label><select id="sdRecipient">'+opts+'</select></div>' +
    '<div class="field-row">' +
      '<div class="field"><label>'+tr('Email')+'</label><input id="sdEmail" type="email" inputmode="email" autocomplete="off" placeholder="name@example.com"></div>' +
      '<div class="field"><label>'+tr('Mobile number')+'</label><input id="sdPhone" type="tel" inputmode="tel" autocomplete="off" placeholder="081 234 5678"></div>' +
    '</div>' +
    '<div class="section-title">'+tr('Send by')+'</div>' +
    '<div class="actions" style="margin-top:0;">' +
      '<button class="btn btn-primary" type="button" data-channel="email">'+tr('Email')+'</button>' +
      '<button class="btn btn-ghost" type="button" data-channel="whatsapp">'+tr('WhatsApp')+'</button>' +
      '<button class="btn btn-ghost" type="button" data-channel="sms">'+tr('SMS')+'</button>' +
    '</div>' +
    '<div class="banner" style="margin-top:12px;">'+tr('This opens your own email, WhatsApp or SMS app with everything filled in. Check it, then tap Send there. Pesa does not send messages by itself.')+'</div>' +
    '<div id="sdResult"></div>' +
    '<div class="actions"><button class="btn btn-ghost btn-block" type="button" id="sdDone">'+tr('Done')+'</button></div>' +
  '</div>';
  root.appendChild(overlay);
  function close(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); }
  overlay.addEventListener('mousedown', function(e){ if(e.target === overlay) close(); });
  overlay.querySelector('#sdDone').addEventListener('click', close);

  var sel = overlay.querySelector('#sdRecipient');
  var emailIn = overlay.querySelector('#sdEmail'), phoneIn = overlay.querySelector('#sdPhone');
  function contactFor(val){
    if(!val || val === 'manual') return null;
    var id = val.slice(2);
    var list = val.charAt(0) === 'c' ? State.customers : State.suppliers;
    return list.find(function(x){ return x.id === id; }) || null;
  }
  function fillFromSelection(){
    var c = contactFor(sel.value);
    if(c){ emailIn.value = c.email || ''; phoneIn.value = c.phone || ''; }
    else { emailIn.value = ctx.manualEmail || ''; phoneIn.value = ctx.manualPhone || ''; }
  }
  var def = ctx.defaultRecipient || 'manual';
  if(!sel.querySelector('option[value="'+def+'"]')) def = 'manual';
  sel.value = def;
  fillFromSelection();
  sel.addEventListener('change', fillFromSelection);
  function recipientName(){
    var c = contactFor(sel.value);
    if(c) return c.contact && sel.value.charAt(0) === 's' ? c.contact : c.name;
    return ctx.manualName || '';
  }
  function recipientLabel(channel){
    var c = contactFor(sel.value);
    var who = c ? c.name : (ctx.manualName || 'a typed-in contact');
    var addr = channel === 'email' ? emailIn.value.trim() : phoneIn.value.trim();
    return who + (addr ? ' ('+addr+')' : '');
  }

  // Build the PDF as soon as the sheet opens, so that tapping Email can call
  // the share sheet straight away (iOS only allows it right after a tap).
  var readyFile, filePromise = Promise.resolve(null);
  if(ctx.buildFile){
    filePromise = Promise.resolve().then(ctx.buildFile).catch(function(){ return null; });
    filePromise.then(function(f){ readyFile = f; });
  }

  var result = overlay.querySelector('#sdResult');
  function showResult(msg, url, text){
    result.innerHTML = '<div class="banner" style="flex-direction:column;gap:6px;">' +
      '<span>'+esc(msg)+'</span>' +
      (url ? '<a href="'+esc(url)+'" '+(/^https?:/i.test(url)?'target="_blank" rel="noopener"':'')+' style="color:var(--primary);font-weight:600;">'+tr('If nothing opened, tap here')+'</a>' : '') +
      (text ? '<button class="btn btn-ghost" type="button" id="sdCopy" style="align-self:flex-start;padding:6px 12px;min-height:0;">'+tr('Copy message')+'</button>' : '') +
    '</div>';
    var cp = result.querySelector('#sdCopy');
    if(cp) cp.addEventListener('click', function(){
      try{
        navigator.clipboard.writeText(text).then(function(){ toast(tr('Message copied')); }, function(){ toast(tr('Couldn’t copy — select the text in your app instead')); });
      }catch(e){ toast(tr('Couldn’t copy — select the text in your app instead')); }
    });
  }
  var handedOff = false;
  function logSend(channel, how){
    var a = ctx.audit || {};
    var chLabel = channel === 'email' ? 'email' : (channel === 'whatsapp' ? 'WhatsApp' : 'SMS');
    logAudit(a.action || 'other', a.entityType || 'document', a.entityId || null,
      (a.label || 'Document') + ' prepared for ' + chLabel + ' to ' + recipientLabel(channel) + (how ? ' ('+how+')' : ''),
      null,
      { channel: channel, recipient: channel === 'email' ? emailIn.value.trim() : normalizeNamPhone(phoneIn.value), recipientName: recipientName() || null, reference: a.reference || null, method: how || null });
    if(!handedOff){ handedOff = true; if(ctx.onHandedOff) try{ ctx.onHandedOff(channel); }catch(e){} }
  }

  async function sendEmail(){
    var to = emailIn.value.trim();
    if(to && !looksLikeEmail(to)){ toast(tr('Enter a valid email address')); emailIn.focus(); return; }
    var name = recipientName();
    var file = null;
    if(ctx.buildFile){
      file = (readyFile !== undefined) ? readyFile : await filePromise;
      if(!file) toast(tr('Couldn’t prepare the PDF — opening the message without it'));
    }
    var body = ctx.emailBody(name, !!file);
    var canShareFile = false;
    if(file && navigator.share && navigator.canShare){
      try{ canShareFile = navigator.canShare({ files:[file] }); }catch(e){ canShareFile = false; }
    }
    if(canShareFile){
      try{
        await navigator.share({ files:[file], title: ctx.subject, text: body });
        logSend('email', 'share sheet with PDF');
        showResult(tr('Handed to the app you picked. Check the message and tap Send there.'), null, null);
        return;
      }catch(e){
        if(e && e.name === 'AbortError') return; // user closed the share sheet
        toast(tr('Couldn’t open the share menu — downloading the PDF instead'));
        // fall through to the download + mailto path below
      }
    }
    var url = buildMailtoUrl(to, ctx.subject, body);
    openExternalUrl(url);
    if(file){
      var saved = await saveBlobFile(file.name, file);
      logSend('email', saved ? 'PDF downloaded, email app opened' : 'email app opened, PDF download failed');
      toast(saved ? tr('PDF downloaded. Attach it to the email before you tap Send.') : tr('Opening your email app…'));
      showResult(saved ? tr('Opening your email app… The PDF was downloaded: attach it to the email, then tap Send.') : tr('Opening your email app…'), url, body);
    } else {
      logSend('email', 'email app opened');
      toast(tr('Opening your email app…'));
      showResult(tr('Opening your email app…'), url, body);
    }
  }
  function sendText(channel){
    var phone = phoneIn.value.trim();
    var n = normalizeNamPhone(phone);
    if(phone && n.length < 8){ toast(tr('Check the mobile number')); phoneIn.focus(); return; }
    var text = ctx.shortText(recipientName(), channel);
    var url = channel === 'whatsapp' ? buildWhatsAppUrl(phone, text) : buildSmsUrl(phone, text);
    openExternalUrl(url);
    logSend(channel, channel === 'whatsapp' ? 'WhatsApp opened' : 'SMS app opened');
    var msg = channel === 'whatsapp' ? tr('Opening WhatsApp…') : tr('Opening your SMS app…');
    toast(msg);
    showResult(msg + (n ? '' : ' ' + tr('No number entered, so choose the contact in the app.')), url, text);
  }
  overlay.querySelectorAll('[data-channel]').forEach(function(b){
    b.addEventListener('click', function(){
      var ch = b.getAttribute('data-channel');
      if(ch === 'email') sendEmail(); else sendText(ch);
    });
  });
  return overlay;
}

/* ---- message builders ---- */
function draftTotal(draft){
  return (draft.items||[]).reduce(function(s,it){ return s + (Number(it.qty)||0)*(Number(it.unitPrice)||0); }, 0);
}
/** kind: 'invoice' (amount due) or 'receipt' (already paid). */
function documentSendCtx(draft, kind, opts){
  opts = opts || {};
  var me = senderIdentity();
  var isReceipt = kind === 'receipt';
  var docWord = isReceipt ? 'Receipt' : 'Invoice';
  var total = fmtMoney(draftTotal(draft));
  var filename = (isReceipt ? 'receipt-' : 'invoice-') + draft.number + '.pdf';
  var contactLine = senderContactLine();
  var parsed = contactFromText(draft.billToContact);
  var cust = opts.customerId ? State.customers.find(function(c){ return c.id === opts.customerId; }) : findCustomerByName(draft.billToName);
  return {
    title: isReceipt ? tr('Send receipt') : tr('Send invoice'),
    summaryHtml: esc(docWord+' '+draft.number) + ' · <strong class="num">' + esc(total) + '</strong>' + (draft.billToName && draft.billToName !== 'Customer' ? ' · ' + esc(draft.billToName) : ''),
    subject: docWord + ' ' + draft.number + ' from ' + me.name,
    emailBody: function(name, hasPdf){
      var lines = [];
      lines.push('Dear ' + (name || 'Sir/Madam') + ',', '');
      if(isReceipt){
        lines.push('Thank you for your purchase. ' + (hasPdf ? 'Please find attached' : 'Here is') + ' your receipt ' + draft.number + ' from ' + me.name + '.', '');
        lines.push('Amount paid: ' + total);
        lines.push('Date: ' + fmtDateNice(draft.dateStr));
      } else {
        lines.push((hasPdf ? 'Please find attached' : 'Here are the details of') + ' invoice ' + draft.number + ' from ' + me.name + '.', '');
        lines.push('Amount due: ' + total);
        lines.push('Invoice date: ' + fmtDateNice(draft.dateStr));
        if(draft.dueDateStr) lines.push('Due date: ' + fmtDateNice(draft.dueDateStr));
      }
      lines.push('');
      if(hasPdf) lines.push('The ' + docWord.toLowerCase() + ' is attached as a PDF (' + filename + ').', '');
      lines.push('If you have any questions' + (contactLine ? ', please contact us on ' + contactLine : ', simply reply to this message') + '.', '');
      lines.push('Kind regards,', me.name);
      return lines.join('\n');
    },
    shortText: function(name, channel){
      var hi = 'Hello' + (name ? ' ' + name : '') + ', ';
      var t;
      if(isReceipt){
        t = hi + 'thank you for shopping at ' + me.name + '. Receipt ' + draft.number + ': ' + total + ' paid on ' + fmtDateNice(draft.dateStr) + '.';
      } else {
        t = hi + 'this is invoice ' + draft.number + ' from ' + me.name + '. Amount due: ' + total + '.' +
          (draft.dueDateStr ? ' Due date: ' + fmtDateNice(draft.dueDateStr) + '.' : '');
        if(channel === 'whatsapp'){
          t += '\n\n' + (draft.items||[]).slice(0,10).map(function(it){ return '- ' + (Number(it.qty)||0) + ' x ' + it.desc + ': ' + fmtMoney((Number(it.qty)||0)*(Number(it.unitPrice)||0)); }).join('\n') +
            ((draft.items||[]).length > 10 ? '\n- and ' + ((draft.items||[]).length-10) + ' more item(s)' : '');
        }
      }
      if(contactLine) t += (channel === 'whatsapp' ? '\n\n' : ' ') + 'Questions? ' + contactLine;
      if(!isReceipt) t += (channel === 'whatsapp' ? '\n' : ' ') + 'Thank you.';
      return t;
    },
    buildFile: async function(){
      if(!(await ensureJsPDF())) return null;
      var doc = isReceipt ? buildReceiptPdf(draft) : buildInvoicePdf(draft);
      if(!doc) return null;
      return new File([doc.output('blob')], filename, { type:'application/pdf' });
    },
    defaultRecipient: cust ? 'c:' + cust.id : 'manual',
    manualName: cust ? '' : (draft.billToName && draft.billToName !== 'Customer' ? draft.billToName : ''),
    manualEmail: parsed.email,
    manualPhone: parsed.phone,
    audit: { action: isReceipt ? 'receipt_shared' : 'invoice_shared', entityType: isReceipt ? 'receipt' : 'invoice', entityId: draft.number, label: docWord + ' ' + draft.number, reference: draft.number },
    onHandedOff: opts.onHandedOff
  };
}
function paymentReminderSendCtx(customer){
  var me = senderIdentity(), contactLine = senderContactLine();
  var bal = fmtMoney(customer.balance||0);
  return {
    title: tr('Send reminder'),
    summaryHtml: esc(customer.name) + ' ' + esc(tr('owes')) + ' <strong class="num">' + esc(bal) + '</strong>',
    subject: 'Friendly payment reminder from ' + me.name,
    emailBody: function(name){
      return ['Dear ' + (name || customer.name) + ',', '',
        'This is a friendly reminder from ' + me.name + ' that your account has an outstanding balance of ' + bal + ' as of ' + fmtDateNice(new Date()) + '.', '',
        'We would appreciate it if you could settle this at your earliest convenience. If you have already paid, thank you, and please ignore this message.', '',
        contactLine ? 'If you have any questions, please contact us on ' + contactLine + '.' : 'If you have any questions, simply reply to this message.', '',
        'Kind regards,', me.name].join('\n');
    },
    shortText: function(name){
      return 'Hello ' + (name || customer.name) + ', this is a friendly reminder from ' + me.name + ' that your account balance of ' + bal +
        ' is outstanding. Please settle it when you can. If you have already paid, thank you.' + (contactLine ? ' Questions? ' + contactLine : '');
    },
    defaultRecipient: 'c:' + customer.id,
    allowSuppliers: false,
    audit: { action:'reminder_shared', entityType:'customer', entityId: customer.id, label: 'Payment reminder (' + bal + ') for ' + customer.name }
  };
}
function poReference(po){ return 'PO-' + String(po.id||'').replace(/[^a-zA-Z0-9]/g,'').slice(-6).toUpperCase(); }
function purchaseOrderSendCtx(po){
  var me = senderIdentity(), contactLine = senderContactLine();
  var sup = State.suppliers.find(function(s){ return s.id === po.supplierId; });
  var ref = poReference(po);
  var total = (po.items||[]).reduce(function(a,i){ return a + (i.qty*i.cost); }, 0);
  var itemLines = (po.items||[]).map(function(it){ return '- ' + it.qty + ' x ' + it.name + (it.cost ? ' @ ' + fmtMoney(it.cost) : ''); });
  return {
    title: tr('Send to supplier'),
    summaryHtml: esc(ref) + ' · ' + esc(sup ? sup.name : 'Supplier') + ' · <strong class="num">' + esc(fmtMoney(total)) + '</strong>',
    subject: 'Purchase order ' + ref + ' from ' + me.name,
    emailBody: function(name){
      return ['Dear ' + (name || (sup ? sup.name : 'Supplier')) + ',', '',
        'Please supply the following for ' + me.name + ' (purchase order ' + ref + ', dated ' + fmtDateNice(po.createdAt) + '):', '',
        itemLines.join('\n'), '',
        'Estimated total: ' + fmtMoney(total) + ' (at the prices noted above)', '',
        'Please confirm availability, final pricing and a delivery date.' + (contactLine ? ' You can reach us on ' + contactLine + '.' : ''), '',
        'Kind regards,', me.name].join('\n');
    },
    shortText: function(name){
      return 'Hello' + (name ? ' ' + name : '') + ', purchase order ' + ref + ' from ' + me.name + ':\n' + itemLines.join('\n') +
        '\nEstimated total: ' + fmtMoney(total) + '.\nPlease confirm availability and delivery date.' + (contactLine ? ' Contact: ' + contactLine : '');
    },
    defaultRecipient: sup ? 's:' + sup.id : 'manual',
    allowCustomers: false,
    audit: { action:'po_shared', entityType:'purchaseOrder', entityId: po.id, label: 'Purchase order ' + ref + (sup ? ' for ' + sup.name : ''), reference: ref }
  };
}
/** Uses up the invoice number and, when a draft is given, stores the
 * document in the Invoices archive at that same moment. kind is 'invoice'
 * or 'receipt' (a post-sale receipt consumes a number just like an invoice). */
function commitInvoiceNumber(draft, kind, customerId){
  var nextNum = (State.settings.invoiceNextNumber||1) + 1;
  State.settings = Object.assign({}, State.settings, { invoiceNextNumber: nextNum });
  refs.settings.set(State.settings);
  if(draft) saveInvoiceRecord(draft, kind || 'invoice', customerId);
}
/* ============================== INVOICE ARCHIVE ==============================
 * Every invoice/receipt that consumed a number is stored as plain data (not
 * a PDF); the PDF is rebuilt on demand with buildInvoicePdf/buildReceiptPdf
 * so it always looks exactly like a freshly generated one (with the shop's
 * current branding). Documents made before this archive existed are not
 * listed: nothing was stored for them. */
var _invRecIds = {}; // type|number -> doc id created in this session, so a re-download updates instead of duplicating
function saveInvoiceRecord(draft, kind, customerId){
  try{
    var key = kind + '|' + draft.number;
    var contact = contactFromText(draft.billToContact);
    var total = draftTotal(draft);
    var data = {
      type: kind,
      number: draft.number,
      billToName: draft.billToName || 'Customer',
      billToContact: draft.billToContact || '',
      billToEmail: contact.email,
      billToPhone: contact.phone,
      dateStr: draft.dateStr || todayKey(),
      dueDateStr: draft.dueDateStr || '',
      notes: draft.notes || '',
      items: (draft.items||[]).map(function(it){ return { desc: it.desc||'', qty: Number(it.qty)||0, unitPrice: Number(it.unitPrice)||0 }; }),
      subtotal: total,
      total: total,
      templateKey: State.settings.invoiceTemplate || 'classic',
      customerId: customerId || null
    };
    if(_invRecIds[key]){ refs.invoices.doc(_invRecIds[key]).update(data); return; }
    data.branchId = (State.settings.currentBranchId && State.settings.currentBranchId!=='all') ? State.settings.currentBranchId : null;
    data.createdById = State.session ? State.session.userId : null;
    data.createdBy = State.session ? State.session.name : null;
    data.createdAt = new Date().toISOString();
    var d = refs.invoices.doc();
    _invRecIds[key] = d.id;
    d.set(data);
  }catch(e){ /* archiving must never block the invoice itself */ }
}
/** Shown after an invoice PDF has been downloaded, so it can go straight out. */
function openInvoiceReadySheet(draft, customerId){
  var html = '<div class="sheet-head"><h2>'+tr('Invoice ready')+'</h2></div>' +
    '<div style="font-size:14px;color:var(--text-muted);margin-bottom:16px;">Invoice '+esc(draft.number)+' for '+esc(fmtMoney(draftTotal(draft)))+' was downloaded. Send it to the customer or a supplier now?</div>' +
    '<div class="actions">' +
      '<button class="btn btn-ghost btn-block" id="irDone" type="button">'+tr('Done')+'</button>' +
      '<button class="btn btn-accent btn-block" id="irSend" type="button">'+tr('Send invoice')+'</button>' +
    '</div>' +
    (roleTabs(State.session ? State.session.role : 'owner').indexOf('invoices') !== -1 ?
      '<div class="actions" style="margin-top:10px;"><button class="btn btn-ghost btn-block" id="irView" type="button">'+tr('View in Invoices')+'</button></div>' : '');
  var ov = openSheet(html, {center:true});
  ov.querySelector('#irDone').addEventListener('click', closeModal);
  var irView = ov.querySelector('#irView');
  if(irView) irView.addEventListener('click', function(){ closeModal(); State.invFilter = { q:'', period:'all', client:'' }; setTab('invoices'); });
  ov.querySelector('#irSend').addEventListener('click', function(){ openSendSheet(documentSendCtx(draft, 'invoice', { customerId: customerId })); });
}

/** Opens the browser's print dialog for the PDF via a hidden iframe. Where a
 * browser cannot print from an iframe (many phones), the PDF opens in a new
 * tab instead and the person prints from there. It only ever reports that the

/** Shared by invoices and reports: print a built jsPDF document. */
function printPdfDoc(doc){
  var blob = doc.output('blob');
  if(!blob || blob.type !== 'application/pdf') blob = new Blob([blob], { type:'application/pdf' });
  var url = URL.createObjectURL(blob);
  var frame = null, settled = false, timer = null;
  function cleanup(){ setTimeout(function(){ try{ if(frame && frame.parentNode) frame.parentNode.removeChild(frame); URL.revokeObjectURL(url); }catch(e){} }, 120000); }
  function fallback(){
    if(settled) return; settled = true; clearTimeout(timer);
    var w = null;
    try{ w = window.open(url, '_blank'); }catch(e){}
    toast(w ? tr('Use your browser’s print option') : tr('Couldn’t open the PDF. Download it and print from your files.'));
    cleanup();
  }
  try{
    frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden', 'true');
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none;';
    frame.onload = function(){
      if(settled) return;
      try{
        var cw = frame.contentWindow;
        cw.focus();
        cw.print();
        settled = true; clearTimeout(timer);
        toast(tr('Print dialog opened'));
        cleanup();
      }catch(e){ fallback(); }
    };
    frame.src = url;
    document.body.appendChild(frame);
    timer = setTimeout(fallback, 5000);
  }catch(e){ fallback(); }
}

/* ============================== ON-DEVICE ALERTS (Notification API) ==============================
 * Local notifications only: shown by this browser on this device while Pesa
 * is open or was used recently. They are not emails or SMS and reach nobody
 * else. The on/off choice is stored per device (each staff phone decides for
 * itself), not in the shared business settings. */
var NOTIFY_PREF_KEY = 'pesa_notify_v1';
var NOTIFY_SEEN_KEY = 'pesa_lowstock_alerted_v1';
function notifySupported(){ try{ return 'Notification' in window && typeof Notification.requestPermission === 'function'; }catch(e){ return false; } }
function notifyPrefOn(){ try{ return localStorage.getItem(NOTIFY_PREF_KEY) === '1'; }catch(e){ return false; } }
function setNotifyPref(on){ try{ localStorage.setItem(NOTIFY_PREF_KEY, on ? '1' : '0'); }catch(e){} }
function notifyActive(){ return notifySupported() && notifyPrefOn() && Notification.permission === 'granted'; }
var _lowAlerted = null;
function lowAlertedMap(){
  if(_lowAlerted) return _lowAlerted;
  _lowAlerted = {};
  try{ var raw = localStorage.getItem(NOTIFY_SEEN_KEY); if(raw) _lowAlerted = JSON.parse(raw) || {}; }catch(e){ _lowAlerted = {}; }
  return _lowAlerted;
}
function saveLowAlerted(){ try{ localStorage.setItem(NOTIFY_SEEN_KEY, JSON.stringify(_lowAlerted || {})); }catch(e){} }
function showDeviceNotification(title, body, tag){
  if(!notifyActive()) return false;
  var opts = { body: body, tag: tag || undefined, icon: 'icon-192.png' };
  function direct(){ try{ new Notification(title, opts); return true; }catch(e){ return false; } }
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(function(reg){
        if(reg && reg.showNotification) return reg.showNotification(title, opts).catch(direct);
        direct();
      }).catch(direct);
      return true;
    }
  }catch(e){}
  return direct();
}
function lowThresholdOf(p){ return p.lowStock != null ? p.lowStock : State.settings.lowStockDefault; }
/** changes: [{ product, newQty }] for products whose stock just went down.
 * Alerts once per product; the product is released for a new alert only after
 * it has been restocked above its threshold. */
function checkLowStockAlerts(changes){
  try{
    var seen = lowAlertedMap(), changed = {}, fresh = [];
    (changes||[]).forEach(function(c){
      var p = c.product;
      if(!p || c.newQty == null) return;
      changed[p.id] = true;
      // It was restocked above its threshold since the last alert: release it.
      if(seen[p.id] && p.stockQty != null && p.stockQty > lowThresholdOf(p)) delete seen[p.id];
      if(c.newQty <= lowThresholdOf(p)){
        if(!seen[p.id]){ seen[p.id] = new Date().toISOString(); fresh.push({ p:p, qty:c.newQty }); }
      } else if(seen[p.id]) delete seen[p.id];
    });
    State.products.forEach(function(p){
      if(!changed[p.id] && seen[p.id] && p.stockQty != null && p.stockQty > lowThresholdOf(p)) delete seen[p.id];
    });
    saveLowAlerted();
    if(!fresh.length) return;
    var title = fresh.length === 1 ? 'Low stock: ' + fresh[0].p.name : fresh.length + ' products are low on stock';
    var body = fresh.map(function(f){ return f.p.name + ': ' + f.qty + ' left'; }).join(', ') + '. Time to reorder.';
    showDeviceNotification(title, body, 'pesa-lowstock-' + (fresh.length === 1 ? fresh[0].p.id : 'multi'));
    // In-app message regardless of notification permission (after the
    // "Sale recorded" message has had its turn on screen).
    setTimeout(function(){ toast(title + ' (' + fresh.map(function(f){ return f.qty + ' left'; }).join(', ') + ')'); }, 2300);
    try{
      if(navigator.setAppBadge){
        var qtyNow = {};
        (changes||[]).forEach(function(c){ if(c.product) qtyNow[c.product.id] = c.newQty; });
        var lowCount = State.products.filter(function(p){
          var q = qtyNow[p.id] != null ? qtyNow[p.id] : p.stockQty;
          return q != null && q <= lowThresholdOf(p);
        }).length;
        navigator.setAppBadge(lowCount).catch(function(){});
      }
    }catch(e){}
  }catch(e){ /* alerts must never break a sale */ }
}
function notifyStatusCopy(){
  var base = tr('Alerts show on this device while Pesa is open or was used recently: a product dropping to its low-stock level after a sale or wastage, and a short summary when the till is closed. They are not emails or SMS and are not sent to anyone else. Each staff phone switches this on for itself.');
  if(notifySupported() && Notification.permission === 'denied'){
    return tr('Notifications are blocked for Pesa in this browser’s site settings. Allow them there, then switch this on again.') + ' ' + base;
  }
  return base;
}
function notificationSettingsHtml(){
  var html = '<div class="section-title">'+tr('Notifications')+'</div>';
  if(!notifySupported()){
    return html + '<div class="banner">'+tr('This browser can’t show device notifications, so the switch is hidden. Low-stock warnings still appear inside Pesa as messages and under Needs attention on the dashboard.')+'</div>';
  }
  var on = notifyActive();
  return html +
    '<div class="field"><label>'+tr('Low-stock and till alerts on this device')+'</label>' +
      '<div class="segbtns" id="stNotifySeg">' +
        '<button type="button" class="segbtn'+(on?'':' active')+'" data-notify="off">'+tr('Off')+'</button>' +
        '<button type="button" class="segbtn'+(on?' active':'')+'" data-notify="on">'+tr('On')+'</button>' +
      '</div></div>' +
    '<div class="banner" id="stNotifyNote">'+esc(notifyStatusCopy())+'</div>';
}
function wireNotificationSettings(ov){
  var seg = ov.querySelector('#stNotifySeg');
  if(!seg) return;
  function paint(){
    var on = notifyActive();
    seg.querySelectorAll('[data-notify]').forEach(function(b){ b.classList.toggle('active', (b.getAttribute('data-notify') === 'on') === on); });
    var note = ov.querySelector('#stNotifyNote'); if(note) note.textContent = notifyStatusCopy();
  }
  seg.querySelectorAll('[data-notify]').forEach(function(b){
    b.addEventListener('click', function(){
      if(b.getAttribute('data-notify') === 'off'){ setNotifyPref(false); paint(); toast(tr('Device alerts off')); return; }
      function granted(){
        setNotifyPref(true); paint();
        toast(tr('Device alerts on'));
        showDeviceNotification('Pesa alerts are on', 'You will see low-stock and till alerts here on this device.', 'pesa-test');
      }
      if(Notification.permission === 'granted'){ granted(); return; }
      if(Notification.permission === 'denied'){ setNotifyPref(false); paint(); toast(tr('Notifications are blocked in this browser’s settings')); return; }
      var done = false;
      function handle(perm){
        if(done) return; done = true;
        if(perm === 'granted') granted();
        else { setNotifyPref(false); paint(); toast(tr('Notifications weren’t allowed, so alerts stay inside Pesa')); }
      }
      try{
        var p = Notification.requestPermission(handle);
        if(p && p.then) p.then(handle, function(){ handle('denied'); });
      }catch(e){ handle('denied'); }
    });
  });
}

function buildInvoicePdf(draft){
  var jsPDFCtor = getJsPDF();
  if(!jsPDFCtor) return null;
  var doc = new jsPDFCtor({ unit:'mm', format:'a4' });
  var head = drawDocHeader(doc);
  var margin = head.margin, contentW = head.contentW, pageW = head.pageW, y = head.y;
  var t = head.t, primary=t.primary, accent=t.accent, muted=t.muted, dark=t.dark;
  var headerTop = y;

  if(State.settings.letterheadDataUrl){
    var lh = State.settings.letterheadImgMeta || {};
    var w = contentW, h = 24;
    if(lh.w && lh.h){ h = Math.min(24, w*lh.h/lh.w); w = h*lh.w/lh.h; if(w>contentW){ w=contentW; h=w*lh.h/lh.w; } }
    try{ doc.addImage(State.settings.letterheadDataUrl, 'JPEG', margin, y, w, h); }catch(e){}
    y += h + 8;
  } else {
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(dark[0],dark[1],dark[2]);
    doc.text(State.settings.shopName || 'My Shop', margin, y+7);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(muted[0],muted[1],muted[2]);
    var cy = y+13;
    (State.settings.businessContact||'').split('\n').filter(Boolean).forEach(function(line){ doc.text(line, margin, cy); cy+=4.2; });
    y = Math.max(y+18, cy+2);
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(primary[0],primary[1],primary[2]);
  doc.text('INVOICE', pageW-margin, headerTop+8, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text('No. '+draft.number, pageW-margin, headerTop+14, {align:'right'});
  doc.text('Date: '+fmtDateNice(draft.dateStr), pageW-margin, headerTop+19, {align:'right'});
  if(draft.dueDateStr) doc.text('Due: '+fmtDateNice(draft.dueDateStr), pageW-margin, headerTop+24, {align:'right'});

  y = Math.max(y, headerTop+30);
  doc.setDrawColor(220,224,218); doc.setLineWidth(0.4); doc.line(margin,y,pageW-margin,y); y+=8;

  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text('BILL TO', margin, y); y+=5.5;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(dark[0],dark[1],dark[2]);
  doc.text(draft.billToName || 'Customer', margin, y); y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(muted[0],muted[1],muted[2]);
  (draft.billToContact||'').split('\n').filter(Boolean).forEach(function(line){ doc.text(line, margin, y); y+=4.5; });
  y += 6;

  var colDesc = margin+3, colQty = margin+contentW-70, colPrice = margin+contentW-46, colAmt = margin+contentW-3;
  doc.setFillColor(primary[0],primary[1],primary[2]); doc.rect(margin, y, contentW, 8, 'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('DESCRIPTION', colDesc, y+5.5);
  doc.text('QTY', colQty, y+5.5, {align:'right'});
  doc.text('PRICE', colPrice, y+5.5, {align:'right'});
  doc.text('AMOUNT', colAmt, y+5.5, {align:'right'});
  y += 8;

  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(dark[0],dark[1],dark[2]);
  var subtotal = 0;
  draft.items.forEach(function(it, idx){
    var qty = Number(it.qty)||0, price = Number(it.unitPrice)||0, amt = qty*price; subtotal += amt;
    if(y > 260){ doc.addPage(); y = margin; }
    if(idx % 2 === 1){ doc.setFillColor(244,246,243); doc.rect(margin, y, contentW, 7.5, 'F'); }
    var descLines = doc.splitTextToSize(it.desc || '', colQty-colDesc-4);
    doc.text(descLines, colDesc, y+5.2);
    doc.text(String(qty), colQty, y+5.2, {align:'right'});
    doc.text(fmtMoney(price), colPrice, y+5.2, {align:'right'});
    doc.text(fmtMoney(amt), colAmt, y+5.2, {align:'right'});
    y += Math.max(7.5, descLines.length*4.6);
  });

  y += 4;
  doc.setDrawColor(220,224,218); doc.line(margin, y, pageW-margin, y); y+=7;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text('Subtotal', colPrice, y, {align:'right'});
  doc.setTextColor(dark[0],dark[1],dark[2]);
  doc.text(fmtMoney(subtotal), colAmt, y, {align:'right'});
  y += 9;
  doc.setFillColor(accent[0],accent[1],accent[2]);
  doc.rect(colPrice-32, y-5.5, contentW-(colPrice-32-margin), 10, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(255,255,255);
  doc.text(t.totalLabel, colPrice, y+1, {align:'right'});
  doc.text(fmtMoney(subtotal), colAmt, y+1, {align:'right'});
  y += 16;

  var noteText = draft.notes || t.defaultNote;
  if(noteText){
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(muted[0],muted[1],muted[2]);
    doc.text('NOTES', margin, y); y+=5;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(dark[0],dark[1],dark[2]);
    var noteLines = doc.splitTextToSize(noteText, contentW);
    doc.text(noteLines, margin, y);
  }

  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text('Generated with Pesa · '+fmtDateNice(new Date()), margin, 290);
  return doc;
}

/** Compact, narrow (80mm) till-style receipt — company logo + slogan up top,
 * itemized list, total, and a small Pesa attribution in the footer. Uses the
 * same draft shape as buildInvoicePdf (number/dateStr/billToName/items/notes). */
function buildReceiptPdf(draft){
  var jsPDFCtor = getJsPDF();
  if(!jsPDFCtor) return null;
  var t = getActiveTemplate();
  var primary=t.primary, accent=t.accent, muted=t.muted, dark=t.dark;
  var pageW = 80, margin = 5, contentW = pageW - margin*2;
  var subtotal = draft.items.reduce(function(s,it){ return s + (Number(it.qty)||0)*(Number(it.unitPrice)||0); }, 0);
  var lineEstimate = 40 + draft.items.length*8 + (draft.notes||t.defaultNote ? 16:0) + (State.settings.businessSlogan?6:0) + (State.settings.logoDataUrl?18:0);
  var doc = new jsPDFCtor({ unit:'mm', format:[pageW, Math.max(120, lineEstimate)] });
  var y = margin;

  if(State.settings.logoDataUrl){
    var lg = State.settings.logoImgMeta || {};
    var boxH = 14, boxW = 14;
    if(lg.w && lg.h){ if(lg.w>lg.h){ boxH = 14*lg.h/lg.w; } else { boxW = 14*lg.w/lg.h; } }
    try{ doc.addImage(State.settings.logoDataUrl, 'JPEG', (pageW-boxW)/2, y, boxW, boxH); }catch(e){}
    y += boxH + 3;
  }
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(dark[0],dark[1],dark[2]);
  doc.text(State.settings.shopName || 'My Shop', pageW/2, y+3, {align:'center'}); y += 6;
  if(State.settings.businessSlogan){
    doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(muted[0],muted[1],muted[2]);
    doc.text(State.settings.businessSlogan, pageW/2, y, {align:'center'}); y += 5;
  }
  (State.settings.businessContact||'').split('\n').filter(Boolean).slice(0,2).forEach(function(line){
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(muted[0],muted[1],muted[2]);
    doc.text(line, pageW/2, y, {align:'center'}); y += 3.6;
  });
  y += 2;
  doc.setDrawColor(200,200,200); doc.setLineWidth(0.3); doc.line(margin,y,pageW-margin,y); y+=5;

  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(primary[0],primary[1],primary[2]);
  doc.text('RECEIPT', pageW/2, y, {align:'center'}); y += 5;
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text('No. '+draft.number, margin, y);
  doc.text(fmtDateNice(draft.dateStr), pageW-margin, y, {align:'right'}); y += 4;
  if(draft.billToName && draft.billToName !== 'Customer'){
    doc.text('Customer: '+draft.billToName, margin, y); y += 4;
  }
  y += 1;
  doc.setDrawColor(220,220,220); doc.line(margin,y,pageW-margin,y); y += 4.5;

  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(dark[0],dark[1],dark[2]);
  draft.items.forEach(function(it){
    var qty = Number(it.qty)||0, price = Number(it.unitPrice)||0, amt = qty*price;
    var descLines = doc.splitTextToSize(it.desc||'', contentW);
    doc.text(descLines, margin, y); y += descLines.length*3.6;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(muted[0],muted[1],muted[2]);
    doc.text(qty+' x '+fmtMoney(price), margin, y);
    doc.setTextColor(dark[0],dark[1],dark[2]);
    doc.text(fmtMoney(amt), pageW-margin, y, {align:'right'});
    doc.setFontSize(8);
    y += 4.6;
  });
  y += 1;
  doc.setDrawColor(200,200,200); doc.line(margin,y,pageW-margin,y); y += 5;

  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(dark[0],dark[1],dark[2]);
  doc.text(t.totalLabel, margin, y);
  doc.text(fmtMoney(subtotal), pageW-margin, y, {align:'right'}); y += 7;

  var noteText = draft.notes || t.defaultNote;
  if(noteText){
    doc.setFont('helvetica','italic'); doc.setFontSize(7); doc.setTextColor(muted[0],muted[1],muted[2]);
    var noteLines = doc.splitTextToSize(noteText, contentW);
    doc.text(noteLines, pageW/2, y, {align:'center'}); y += noteLines.length*3.4 + 3;
  }

  y += 2;
  var markH = 6, markW = markH / PESA_LOGO_ASPECT;
  try{ doc.addImage(PESA_LOGO_DATA_URL, 'PNG', (pageW-markW)/2, y, markW, markH); }catch(e){}
  y += markH + 2;
  doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text('Powered by Pesa', pageW/2, y, {align:'center'});
  return doc;
}

function openInvoiceSheet(prefill){
  InvoiceDraft.items = [];
  if(prefill && prefill.items && prefill.items.length){
    prefill.items.forEach(function(it){ invAddItem(it.desc, it.qty, it.unitPrice); });
  } else {
    invAddItem('', 1, 0);
  }
  var number = 'INV-' + String(State.settings.invoiceNextNumber||1).padStart(4,'0');
  var html =
    '<div class="sheet-head"><h2>'+tr('New invoice')+'</h2></div>' +
    '<div class="banner">Invoice '+number+'</div>' +
    '<div class="field"><label>'+tr('Bill to')+'</label><input id="invBillName" placeholder="Customer or business name" value="'+esc(prefill&&prefill.billToName||'')+'"></div>' +
    '<div class="field"><label>'+tr('Customer contact (optional)')+'</label><textarea id="invBillContact" rows="2" placeholder="Phone, address…">'+esc(prefill&&prefill.billToContact||'')+'</textarea></div>' +
    '<div class="field-row">' +
      '<div class="field"><label>'+tr('Invoice date')+'</label><input id="invDate" type="date" value="'+todayKey()+'"></div>' +
      '<div class="field"><label>'+tr('Due date (optional)')+'</label><input id="invDue" type="date"></div>' +
    '</div>' +
    '<div class="section-title" style="margin-top:14px;">'+tr('Items')+'</div>' +
    '<div id="invItemsList"></div>' +
    '<button class="btn btn-ghost btn-block" id="invAddItemBtn" type="button">+ Add line item</button>' +
    '<div class="field" style="margin-top:14px;"><label>'+tr('Notes (optional)')+'</label><textarea id="invNotes" rows="3" placeholder="Payment details, thank-you note, terms…">'+esc(prefill&&prefill.notes||getActiveTemplate().defaultNote||'')+'</textarea></div>' +
    '<div class="sumline total"><span>Total</span><span class="num" id="invTotalDisplay">N$0.00</span></div>' +
    '<div class="actions">' +
      '<button class="btn btn-ghost" id="invReceiptBtn" type="button">'+tr('Receipt (PDF)')+'</button>' +
      '<button class="btn btn-accent" style="flex:2;" id="invGenerateBtn" type="button">'+tr('Download invoice (PDF)')+'</button>' +
    '</div>' +
    '<div class="actions" style="margin-top:10px;"><button class="btn btn-primary btn-block" id="invSendBtn" type="button">'+tr('Send invoice')+' · '+tr('Email')+', '+tr('WhatsApp')+', '+tr('SMS')+'</button></div>' +
    '<div class="actions">' + bluetoothPrintButtonHtml('invBtPrintBtn') + '</div>';
  var ov = openSheet(html);
  var prefillCustomerId = prefill && prefill.customerId || null;
  // The invoice number is used up once, whether the invoice is downloaded,
  // sent, or both, so the next invoice never repeats it.
  var numberCommitted = false;
  function commitNumberOnce(draft){
    if(!numberCommitted){ numberCommitted = true; commitInvoiceNumber(draft, 'invoice', invoiceCustomerId(draft)); }
    else saveInvoiceRecord(draft, 'invoice', invoiceCustomerId(draft)); // edited and generated again under the same number
  }
  ov.querySelector('#invSendBtn').addEventListener('click', function(){
    var draft = readDraft();
    if(!draft) return;
    openSendSheet(documentSendCtx(draft, 'invoice', { customerId: invoiceCustomerId(draft), onHandedOff: function(){ commitNumberOnce(draft); } }));
  });
  // Default the recipient to the customer the invoice was started from, as
  // long as the "Bill to" name still matches them (otherwise match by name).
  function invoiceCustomerId(draft){
    if(!prefillCustomerId) return null;
    var c = State.customers.find(function(x){ return x.id===prefillCustomerId; });
    return (c && (c.name||'').trim().toLowerCase() === (draft.billToName||'').trim().toLowerCase()) ? c.id : null;
  }
  var btPrintBtn2 = ov.querySelector('#invBtPrintBtn');
  if(btPrintBtn2 && !btPrintBtn2.disabled) btPrintBtn2.addEventListener('click', function(){
    var draft = readDraft();
    if(draft) printReceiptViaBluetooth(draft, btPrintBtn2);
  });
  var itemsList = ov.querySelector('#invItemsList');
  invRenderItems(itemsList);
  invUpdateTotal();
  ov.querySelector('#invAddItemBtn').addEventListener('click', function(){
    invAddItem('', 1, 0);
    invRenderItems(itemsList);
    invUpdateTotal();
  });
  function readDraft(){
    var items = InvoiceDraft.items.filter(function(it){ return it.desc && it.desc.trim(); });
    if(items.length===0){ toast('Add at least one line item'); return null; }
    return {
      number: number,
      billToName: ov.querySelector('#invBillName').value.trim() || 'Customer',
      billToContact: ov.querySelector('#invBillContact').value.trim(),
      dateStr: ov.querySelector('#invDate').value || todayKey(),
      dueDateStr: ov.querySelector('#invDue').value || '',
      notes: ov.querySelector('#invNotes').value.trim(),
      items: items
    };
  }
  ov.querySelector('#invGenerateBtn').addEventListener('click', async function(){
    var draft = readDraft();
    if(!draft) return;
    var btn = ov.querySelector('#invGenerateBtn');
    var oldLabel = btn.textContent;
    btn.disabled = true; btn.textContent = 'Preparing…';
    var ready = await ensureJsPDF();
    if(!ready){ btn.disabled = false; btn.textContent = oldLabel; toast('Couldn’t load the PDF engine — check your connection and try again'); return; }
    var doc = buildInvoicePdf(draft);
    if(!doc){ btn.disabled = false; btn.textContent = oldLabel; toast('Couldn’t load the PDF engine — check your connection and try again'); return; }
    saveGeneratedPdf(doc, 'invoice-'+draft.number+'.pdf').then(function(ok){
      btn.disabled = false; btn.textContent = 'Download invoice (PDF)';
      if(ok){
        commitNumberOnce(draft);
        toast('Invoice downloaded');
        openInvoiceReadySheet(draft, invoiceCustomerId(draft));
      }
    });
  });
  ov.querySelector('#invReceiptBtn').addEventListener('click', async function(){
    var draft = readDraft();
    if(!draft) return;
    var btn = ov.querySelector('#invReceiptBtn');
    var oldLabel = btn.textContent;
    btn.disabled = true; btn.textContent = 'Preparing…';
    var ready = await ensureJsPDF();
    if(!ready){ btn.disabled = false; btn.textContent = oldLabel; toast('Couldn’t load the PDF engine — check your connection and try again'); return; }
    var doc = buildReceiptPdf(draft);
    if(!doc){ btn.disabled = false; btn.textContent = oldLabel; toast('Couldn’t load the PDF engine — check your connection and try again'); return; }
    saveGeneratedPdf(doc, 'receipt-'+draft.number+'.pdf').then(function(ok){
      btn.disabled = false; btn.textContent = oldLabel;
      if(ok) toast('Receipt downloaded');
    });
  });
}

/* ============================== MONTHLY REPORT ============================== */
function monthOptionsHtml(){
  var opts = [], d = new Date(); d.setDate(1);
  for(var i=0;i<12;i++){
    var val = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    var label = d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    opts.push('<option value="'+val+'"'+(i===0?' selected':'')+'>'+label+'</option>');
    d.setMonth(d.getMonth()-1);
  }
  return opts.join('');
}

/** Work out every figure the report shows for [start, end). This is the one
 * place the report maths lives, so the live Dashboard report and archived
 * (saved) monthly reports can never disagree.
 * opts.scope: 'all' (default) or a branch id (strict match on branchId).
 * opts.snapshot: true builds the compact, storable version used by the
 * report archive (adds payments, VAT, wastage, till figures and caps the
 * long lists). The live Dashboard report never sets it. */
function computeReportFigures(start, end, opts){
  opts = opts || {};
  var scope = opts.scope || 'all';
  var snap = !!opts.snapshot;
  function inScope(x){ return scope === 'all' || x.branchId === scope; }

  var salesIn = State.sales.filter(function(s){ var d=new Date(s.createdAt); return d>=start && d<end && inScope(s); });
  var expensesIn = State.expenses.filter(function(e){ var d=new Date(e.createdAt); return d>=start && d<end && inScope(e); });
  var revenue = salesIn.reduce(function(s,x){return s+x.total;},0);
  var cogs = salesIn.reduce(function(s,x){return s+(x.cost||0);},0);
  var grossProfit = revenue-cogs;
  var expByCat = {};
  expensesIn.forEach(function(e){ expByCat[e.category]=(expByCat[e.category]||0)+e.amount; });
  var expensesTotal = expensesIn.reduce(function(s,e){return s+e.amount;},0);
  var netProfit = grossProfit-expensesTotal;
  var totalOwed = State.customers.reduce(function(s,c){return s+(c.balance||0);},0);

  var byProduct = {};
  salesIn.forEach(function(s){ (s.items||[]).forEach(function(it){
    var k = it.name;
    if(!byProduct[k]) byProduct[k] = {qty:0, revenue:0, cost:0};
    byProduct[k].qty += it.qty; byProduct[k].revenue += it.lineTotal; byProduct[k].cost += (it.cost||0)*it.qty;
  }); });
  var productRows = Object.keys(byProduct).map(function(k){ var p=byProduct[k]; return {name:k, qty:p.qty, revenue:p.revenue, profit:p.revenue-p.cost}; })
    .sort(function(a,b){ return b.revenue-a.revenue; });

  var totalStockValue = State.products.reduce(function(s,p){ return s+(p.costPrice||0)*(p.stockQty||0); }, 0);
  var expenseRows = Object.keys(expByCat).sort(function(a,b){return expByCat[b]-expByCat[a];}).map(function(k){ return { category:String(k), amount:expByCat[k] }; });
  var stockRows = State.products.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'');}).map(function(p){
    return { name:p.name, cost:p.costPrice, sell:p.sellPrice, qty:p.stockQty };
  });

  var fig = {
    revenue:revenue, cogs:cogs, grossProfit:grossProfit, expensesTotal:expensesTotal, netProfit:netProfit,
    expenseRows:expenseRows, productRows:productRows, totalOwed:totalOwed, totalStockValue:totalStockValue, stockRows:stockRows
  };
  if(!snap) return fig;

  var PRODUCT_CAP = 300, STOCK_CAP = 200;
  fig.salesCount = salesIn.length;
  var pay = { cash:0, card:0, wallet:0, credit:0 };
  salesIn.forEach(function(s){ var m = s.paymentMethod || 'cash'; pay[m] = (pay[m]||0) + s.total; });
  fig.payments = pay;
  var rate = (State.settings.vatRate != null) ? Number(State.settings.vatRate) || 0 : 15;
  fig.vat = { rate:rate, output: revenue*rate/(100+rate), input: expensesTotal*rate/(100+rate) };
  fig.vat.net = fig.vat.output - fig.vat.input;
  fig.productsOmitted = Math.max(0, productRows.length - PRODUCT_CAP);
  fig.productRows = productRows.slice(0, PRODUCT_CAP);
  if(scope === 'all'){
    var wIn = State.wastage.filter(function(w){ var d=new Date(w.createdAt); return d>=start && d<end; });
    fig.wastageCount = wIn.length;
    fig.wastageValue = wIn.reduce(function(s,w){
      var p = State.products.find(function(x){ return x.id===w.productId; });
      return s + (w.qty||0) * (p ? p.costPrice||0 : 0);
    }, 0);
    var tIn = State.tillSessions.filter(function(t){ if(t.status!=='closed' || !t.closedAt) return false; var d=new Date(t.closedAt); return d>=start && d<end; });
    fig.tills = { closedCount:tIn.length,
      cashCounted: tIn.reduce(function(s,t){ return s + (Number(t.closingCash)||0); }, 0),
      variance: tIn.reduce(function(s,t){ return s + (Number(t.variance)||0); }, 0) };
    fig.stockCount = stockRows.length;
    var byValue = stockRows.slice().sort(function(a,b){ return (Number(b.cost)||0)*(Number(b.qty)||0) - (Number(a.cost)||0)*(Number(a.qty)||0); }).slice(0, STOCK_CAP);
    fig.stockRows = byValue.map(function(p){ return { name:p.name||'', cost:Number(p.cost)||0, sell:Number(p.sell)||0, qty:Number(p.qty)||0 }; });
    fig.stockTruncated = stockRows.length > STOCK_CAP;
  } else {
    // credit, stock, wastage and tills are shop wide, not tracked per branch
    fig.totalOwed = null; fig.totalStockValue = null; fig.stockRows = null;
  }
  return JSON.parse(JSON.stringify(fig));
}

/** Draw the report PDF from a figures object. With no meta it is the live
 * Dashboard report, exactly as before. With meta ({archived:true, interim,
 * shopName, scopeLabel, generatedAt, generatedBy}) it is a saved monthly
 * report: same layout plus the extra sections and the record footer. */
function drawReportPdf(fig, monthLabel, meta){
  var jsPDFCtor = getJsPDF();
  if(!jsPDFCtor) return null;
  var arch = !!meta;
  var gen = arch ? new Date(meta.generatedAt) : null;
  var genText = arch ? (fmtDateNice(gen) + ' ' + gen.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})) : '';

  var doc = new jsPDFCtor({ unit:'mm', format:'a4' });
  var head = drawDocHeader(doc);
  var margin = head.margin, contentW = head.contentW, pageW = head.pageW, y = head.y;
  var t = head.t, primary=t.primary, accent=t.accent, muted=t.muted, dark=t.dark;
  function need(h){ if(y+h>275){ doc.addPage(); y=margin; } }

  if(arch){

      doc.text('Generated by Pesa on '+genText+(meta.generatedBy ? ' by '+meta.generatedBy : ''), margin, 290);
