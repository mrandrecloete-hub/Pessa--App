/* ============================== BULK STOCK IMPORT ============================== */
var Bulk = { rows: [] };

function parseNum(s){
  if(s==null || s==='') return 0;
  var n = parseFloat(String(s).replace(/[^\d.\-]/g,''));
  return isNaN(n) ? 0 : n;
}

function parsePastedText(text){
  var lines = String(text||'').split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  var rows = [], skipped = 0;
  lines.forEach(function(line){
    if(/^name\s*,/i.test(line)) return; // skip an obvious header line
    var parts = line.split(',').map(function(p){ return p.trim(); });
    var name = parts[0];
    if(!name){ skipped++; return; }
    rows.push({
      id: uid(), name: name,
      costPrice: parseNum(parts[1]),
      sellPrice: parseNum(parts[2]),
      stockQty: parts[3]!=null ? (parseInt(parts[3],10)||0) : 0,
      category: parts[4] || '',
      unit: parts[5] || '',
      lowStock: null
    });
  });
  return { rows:rows, skipped:skipped };
}

function parseCsvLine(line){
  var result = [], cur = '', inQuotes = false;
  for(var i=0;i<line.length;i++){
    var c = line[i];
    if(c === '"'){ inQuotes = !inQuotes; }
    else if(c === ',' && !inQuotes){ result.push(cur); cur=''; }
    else cur += c;
  }
  result.push(cur);
  return result.map(function(s){ return s.trim().replace(/^"|"$/g,''); });
}

function parseCsvText(text){
  var lines = String(text||'').split(/\r?\n/).filter(function(l){ return l.trim().length>0; });
  if(lines.length===0) return { rows:[], skipped:0 };
  var header = parseCsvLine(lines[0]).map(function(h){ return h.toLowerCase(); });
  var hasHeader = header.some(function(h){ return /name|product|item/.test(h); });
  var idx = { name:0, cost:1, sell:2, qty:3, category:4, unit:5, low:-1 };
  if(hasHeader){
    idx = { name:-1, cost:-1, sell:-1, qty:-1, category:-1, unit:-1, low:-1 };
    header.forEach(function(h,i){
      if(/name|product|item/.test(h)) idx.name=i;
      else if(/categ/.test(h)) idx.category=i;
      else if(/unit/.test(h)) idx.unit=i;
      else if(/cost/.test(h)) idx.cost=i;
      else if(/sell|price/.test(h)) idx.sell=i;
      else if(/qty|quantity|stock/.test(h)) idx.qty=i;
      else if(/low/.test(h)) idx.low=i;
    });
  }
  var dataLines = hasHeader ? lines.slice(1) : lines;
  var rows = [], skipped = 0;
  dataLines.forEach(function(line){
    var parts = parseCsvLine(line);
    var name = idx.name>-1 ? parts[idx.name] : '';
    if(!name){ skipped++; return; }
    rows.push({
      id: uid(), name: name,
      category: idx.category>-1 ? (parts[idx.category]||'') : '',
      unit: idx.unit>-1 ? (parts[idx.unit]||'') : '',
      costPrice: idx.cost>-1 ? parseNum(parts[idx.cost]) : 0,
      sellPrice: idx.sell>-1 ? parseNum(parts[idx.sell]) : 0,
      stockQty: idx.qty>-1 ? (parseInt(parts[idx.qty],10)||0) : 0,
      lowStock: idx.low>-1 && parts[idx.low] ? (parseInt(parts[idx.low],10)||null) : null
    });
  });
  return { rows:rows, skipped:skipped };
}

function photoErrorCopy(code){
  switch(code){
    case 'not_granted': case 'sampling_disabled': case 'not_declared': case 'capability_disabled': case 'capability_removed':
      return 'Photo import isn’t available for you right now.';
    case 'images_unavailable': return 'Photos aren’t supported in this view.';
    case 'image_rejected': return 'That photo couldn’t be used — try a clearer photo or a smaller file.';
    case 'rate_limited': return 'Too many requests right now — try again in a moment.';
    case 'invalid_json': return 'Couldn’t read that photo clearly — try a clearer, well-lit photo.';
    case 'refused': return 'That photo couldn’t be processed.';
    case 'cancelled': return 'Cancelled.';
    default: return 'Something went wrong reading that photo — try again.';
  }
}

function smartParseErrorCopy(code){
  switch(code){
    case 'not_granted': case 'sampling_disabled': case 'not_declared': case 'capability_disabled': case 'capability_removed':
      return 'Smart parsing isn’t available for you right now — try Quick parse instead.';
    case 'rate_limited': return 'Too many requests right now — try again in a moment.';
    case 'invalid_json': return 'Couldn’t make sense of that list — try Quick parse, or tidy it up a little.';
    case 'refused': return 'That list couldn’t be processed.';
    case 'cancelled': return 'Cancelled.';
    case 'prompt_too_large': return 'That list is too long for one go — split it into smaller batches.';
    default: return 'Something went wrong reading that list — try again.';
  }
}

function handleSmartPasteImport(text, statusEl){
  statusEl.innerHTML = '<div class="banner">'+ICONS.stack+'<span>Pessa AI is reading your list…</span></div>';
  (async function(){
    try{
      if(!(window.claude && window.claude.use)){ statusEl.innerHTML = '<div class="banner">'+ICONS.warn+'<span>Smart parsing isn’t available in this view. Try Quick parse instead.</span></div>'; return; }
      var sample = await window.claude.use('sample');
      if(!sample){ statusEl.innerHTML = '<div class="banner">'+ICONS.warn+'<span>Smart parsing isn’t available in this view. Try Quick parse instead.</span></div>'; return; }
      var prompt = "You are reading a messy, free-form list of shop stock — it might be a supplier price list, a WhatsApp message, or rough notes, in any layout or order, possibly with currency symbols, typos, or missing pieces. " +
        "Pull out every distinct product you can find. Reply with ONLY a JSON array, no other text, of objects shaped exactly like " +
        '{"name": string, "costPrice": number, "sellPrice": number, "stockQty": number, "category": string, "unit": string}. ' +
        "Prices are Namibian dollars — return plain numbers, no currency symbols, commas or ranges (use the lower number of a range). " +
        "If only one price is given for a line, use it for both costPrice and sellPrice. If quantity isn't given, use 0. If category or unit aren't given, use an empty string. " +
        "Skip lines that clearly aren't products (headers, totals, dates, greetings).\n\nLIST:\n" + text.slice(0, 6000);
      var data = await sample.json(prompt, { modelTier:'default' });

      statusEl.innerHTML = '<div class="banner">'+ICONS.warn+'<span>'+smartParseErrorCopy(e && e.code)+'</span></div>';

function handleCsvImport(file, statusEl){
  statusEl.innerHTML = '<div class="banner">Reading file…</div>';
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var res = parseCsvText(String(reader.result||''));
      if(res.rows.length===0){
        statusEl.innerHTML = '<div class="banner">'+ICONS.warn+'<span>No products found in that file.</span></div>';
        return;
      }
      Bulk.rows = Bulk.rows.concat(res.rows);
      statusEl.innerHTML = '<div class="banner" style="color:var(--success);"><span>Found '+res.rows.length+' product'+(res.rows.length===1?'':'s')+(res.skipped?' ('+res.skipped+' row'+(res.skipped===1?'':'s')+' skipped)':'')+'.</span></div>';
      renderBulkPreview();
    }catch(e){
      statusEl.innerHTML = '<div class="banner">'+ICONS.warn+'<span>Couldn’t read that file. Make sure it’s a .csv file.</span></div>';
    }
  };
  reader.onerror = function(){ statusEl.innerHTML = '<div class="banner">'+ICONS.warn+'<span>Couldn’t read that file.</span></div>'; };
  reader.readAsText(file);
}

    '<div class="rowlist" id="bulkRowList">' + Bulk.rows.map(function(r){
      return '<div class="card pad bulk-row-card" data-brow="'+r.id+'">' +
        '<div class="bulk-row-top">' +
          '<input data-bf="name" value="'+esc(r.name)+'" placeholder="Product name">' +
          '<button class="bulk-del" data-bdel type="button">×</button>' +
        '</div>' +
        '<div class="bulk-row-grid">' +
          '<input data-bf="costPrice" type="number" step="0.01" value="'+r.costPrice+'" placeholder="Cost">' +
          '<input data-bf="sellPrice" type="number" step="0.01" value="'+r.sellPrice+'" placeholder="Sell">' +
          '<input data-bf="stockQty" type="number" value="'+r.stockQty+'" placeholder="Qty">' +

      '</div>';

function wireBulkPreview(){
  var list = document.getElementById('bulkRowList');
  if(!list) return;
  list.querySelectorAll('[data-brow]').forEach(function(cardEl){
    var id = cardEl.getAttribute('data-brow');
    var row = Bulk.rows.find(function(r){ return r.id===id; });
    if(!row) return;
    cardEl.querySelectorAll('[data-bf]').forEach(function(inp){
      inp.addEventListener('input', function(){
        var f = inp.getAttribute('data-bf');
        if(f==='costPrice' || f==='sellPrice'){ row[f] = parseFloat(inp.value)||0; }
        else if(f==='stockQty'){ row[f] = parseInt(inp.value,10)||0; }
        else { row[f] = inp.value; }
      });
    });
    var delBtn = cardEl.querySelector('[data-bdel]');
    if(delBtn) delBtn.addEventListener('click', function(){
      Bulk.rows = Bulk.rows.filter(function(r){ return r.id!==id; });
      renderBulkPreview();
    });
  });
}

function commitBulkRows(){
  var rows = Bulk.rows.filter(function(r){ return r.name && r.name.trim(); });
  if(rows.length===0){ toast('Add at least one product name'); return; }
  var now = new Date().toISOString();
  var commitBtn = document.getElementById('bulkCommitBtn');
  if(commitBtn){ commitBtn.disabled = true; commitBtn.textContent = 'Adding…'; }
  Promise.all(rows.map(function(r){
    return refs.products.doc().set({
      name: r.name.trim(), category:(r.category||'').trim(), unit:(r.unit||'').trim(),
      costPrice: r.costPrice||0, sellPrice: r.sellPrice||0, stockQty: r.stockQty||0,
      lowStock: r.lowStock!=null ? r.lowStock : null, createdAt: now, updatedAt: now
    });
  })).then(function(){
    closeModal();
    toast(rows.length + ' product' + (rows.length===1?'':'s') + ' added');
  }).catch(function(err){
    console.warn(err);
    toast('Some products could not be saved — try again');
    if(commitBtn){ commitBtn.disabled = false; commitBtn.textContent = 'Add ' + rows.length + ' product' + (rows.length===1?'':'s'); }
  });
}

/* ============================== IMAGE HELPERS (logo / letterhead) ============================== */
function resizeImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxDim/Math.max(w,h));
        var tw = Math.max(1, Math.round(w*scale)), th = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement('canvas');
        canvas.width = tw; canvas.height = th;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,tw,th);
        ctx.drawImage(img, 0, 0, tw, th);
        resolve({ dataUrl: canvas.toDataURL('image/jpeg', quality||0.85), w:tw, h:th });
      };
      img.onerror = function(){ reject(new Error('bad image')); };
      img.src = String(reader.result||'');
    };
    reader.onerror = function(){ reject(new Error('read failed')); };
    reader.readAsDataURL(file);
  });
}

/* ============================== PDF HELPERS ============================== */
function getJsPDF(){ return (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : null; }
// The PDF library loads from an external CDN via a <script> tag; on a slow
// connection or right after a cold app launch it may not have finished
// loading yet by the time someone taps a PDF button. Poll briefly instead
// of failing immediately, so a slow-but-working load isn't mistaken for a
// broken one.
function ensureJsPDF(maxWaitMs){
  if(getJsPDF()) return Promise.resolve(true);
  maxWaitMs = maxWaitMs || 6000;
  return new Promise(function(resolve){
    var waited = 0, step = 150;
    var timer = setInterval(function(){
      if(getJsPDF()){ clearInterval(timer); resolve(true); return; }
      waited += step;
      if(waited >= maxWaitMs){ clearInterval(timer); resolve(false); }
    }, step);
  });
}
function fmtDateNice(d){ return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }

function hexToRgb(hex){
  hex = String(hex||'').replace('#','').trim();
  if(hex.length===3) hex = hex.split('').map(function(c){ return c+c; }).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(hex)) hex = '16463B';
  var num = parseInt(hex,16);
  return [(num>>16)&255, (num>>8)&255, num&255];
}

/** Shared header for invoices and reports: small Pesa mark top-left, the
 * shop's own logo (or letterhead) and slogan top-right, then a divider. */
function drawDocHeader(doc){
  var t = getActiveTemplate();
  var pageW = doc.internal.pageSize.getWidth();
  var margin = 16, contentW = pageW-margin*2, y = margin;
  var markH = 9, markW = markH / PESA_LOGO_ASPECT;

  try{ doc.addImage(PESA_LOGO_DATA_URL, 'PNG', margin, y, markW, markH); }catch(e){}
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(150,150,150);
  doc.text('Pesa', margin+markW+2, y+markH-2.5);

  var rightBottom = y + markH;
  if(State.settings.logoDataUrl){
    var lg = State.settings.logoImgMeta || {};
    var boxH = 12, boxW = 12;
    if(lg.w && lg.h){ if(lg.w>lg.h){ boxH = 12*lg.h/lg.w; } else { boxW = 12*lg.w/lg.h; } }
    try{ doc.addImage(State.settings.logoDataUrl, 'JPEG', pageW-margin-boxW, y, boxW, boxH); }catch(e){}
    rightBottom = Math.max(rightBottom, y+boxH);
  }
  if(State.settings.businessSlogan){
    doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(t.muted[0],t.muted[1],t.muted[2]);
    doc.text(State.settings.businessSlogan, pageW-margin, rightBottom+4, {align:'right'});
    rightBottom += 6;
  }
  y = Math.max(y+markH+5, rightBottom+3);
  doc.setDrawColor(215,215,215); doc.setLineWidth(0.3); doc.line(margin,y,pageW-margin,y);
  y += 7;
  return { y:y, t:t, margin:margin, contentW:contentW, pageW:pageW };
}

function pdfSummaryLine(doc, x, y, width, label, value, opts){
  opts = opts || {};
  doc.setFont('helvetica', opts.bold?'bold':'normal');
  doc.setFontSize(opts.size || 10);

function pdfTable(doc, opts){
  var x = opts.x, y = opts.y, rowH = opts.rowHeight || 7;
  function drawHeader(){
    var fill = opts.headerFill || [22,70,59];
    doc.setFillColor(fill[0],fill[1],fill[2]);
    doc.rect(x, y, opts.width, rowH, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    var cx = x;
    opts.columns.forEach(function(col){
      var tx = col.align==='right' ? cx+col.width-2 : cx+2;
      doc.text(col.label, tx, y+rowH-2.3, {align: col.align==='right'?'right':'left'});
      cx += col.width;
    });
    y += rowH;
  }
  drawHeader();
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  opts.rows.forEach(function(row, ri){
    if(y > 275){
      doc.addPage(); y = 16; drawHeader();
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    }
    if(opts.zebra && ri%2===1){ doc.setFillColor(244,246,243); doc.rect(x,y,opts.width,rowH,'F'); }
    doc.setTextColor(27,36,32);
    var cx = x;
    row.forEach(function(cell, ci){
      var col = opts.columns[ci];
      var tx = col.align==='right' ? cx+col.width-2 : cx+2;
      doc.text(String(cell), tx, y+rowH-2.3, {align: col.align==='right'?'right':'left'});
      cx += col.width;
    });
    y += rowH;
  });
  return y;
}

// Standard browser download — works anywhere the app is opened as a normal
// web page (e.g. installed from GitHub Pages), unlike the Claude-only
// 'downloads' capability which only exists inside the artifact host.
function browserDownload(filename, blob){
  try{
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return true;
  }catch(e){
    return false;
  }
}

async function saveGeneratedPdf(doc, filename){
  var blob = doc.output('blob');
  try{
    if(window.claude && window.claude.use){
      var dl = await window.claude.use('downloads');
      if(dl){
        await dl.save({ filename: filename, data: blob });
        return true;
      }
    }
  }catch(e){
    if(e && e.code === 'declined') return false;
    // fall through to the browser-native download below
  }
  if(browserDownload(filename, blob)) return true;
  toast('Couldn’t save the file — try again');
  return false;
}

var InvoiceDraft = { items: [] };

function invAddItem(desc, qty, unitPrice){
  InvoiceDraft.items.push({ id:uid(), desc: desc||'', qty: qty!=null?qty:1, unitPrice: unitPrice!=null?unitPrice:0 });
}

function invRenderItems(container){
  container.innerHTML = InvoiceDraft.items.map(function(it){
    var amt = (Number(it.qty)||0) * (Number(it.unitPrice)||0);
    return '<div class="card pad" style="margin-bottom:8px;" data-invrow="'+it.id+'">' +
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">' +
        '<input data-if="desc" placeholder="Item or service" value="'+esc(it.desc)+'" style="flex:1;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:600;color:var(--text);">' +
        '<button class="bulk-del" data-ivdel type="button">×</button>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">' +
        '<input data-if="qty" type="number" min="0" step="1" placeholder="Qty" value="'+it.qty+'" style="width:100%;min-width:0;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 7px;font-size:12.5px;color:var(--text);">' +
        '<input data-if="unitPrice" type="number" min="0" step="0.01" placeholder="Price" value="'+it.unitPrice+'" style="width:100%;min-width:0;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:6px 7px;font-size:12.5px;color:var(--text);">' +
        '<div class="num" data-ivamt style="display:flex;align-items:center;justify-content:flex-end;font-weight:600;font-size:12.5px;">'+fmtMoney(amt)+'</div>' +
      '</div>' +
    '</div>';
  }).join('');
  container.querySelectorAll('[data-invrow]').forEach(function(rowEl){
    var id = rowEl.getAttribute('data-invrow');
    var item = InvoiceDraft.items.find(function(r){ return r.id===id; });
    if(!item) return;
    rowEl.querySelectorAll('[data-if]').forEach(function(inp){
      inp.addEventListener('input', function(){
        var f = inp.getAttribute('data-if');
        if(f==='qty'){ item.qty = parseFloat(inp.value)||0; }
        else if(f==='unitPrice'){ item.unitPrice = parseFloat(inp.value)||0; }
        else { item.desc = inp.value; }
        var amt = (Number(item.qty)||0) * (Number(item.unitPrice)||0);
        var amtEl = rowEl.querySelector('[data-ivamt]');
        if(amtEl) amtEl.textContent = fmtMoney(amt);
        invUpdateTotal();
      });
    });
    var delBtn = rowEl.querySelector('[data-ivdel]');
    if(delBtn) delBtn.addEventListener('click', function(){
      InvoiceDraft.items = InvoiceDraft.items.filter(function(r){ return r.id!==id; });
      invRenderItems(container);
      invUpdateTotal();
    });
  });
}

function invUpdateTotal(){
  var total = InvoiceDraft.items.reduce(function(s,it){ return s + (Number(it.qty)||0)*(Number(it.unitPrice)||0); }, 0);
  var el = document.getElementById('invTotalDisplay');
  if(el) el.textContent = fmtMoney(total);
  return total;
}

function buildInvoicePdf(draft){

  var margin = head.margin, contentW = head.contentW, pageW = head.pageW, y = head.y;
  var t = head.t, primary=t.primary, accent=t.accent, muted=t.muted, dark=t.dark;
  var headerTop = y;

  if(State.settings.letterheadDataUrl){
    var lh = State.settings.letterheadImgMeta || {};
    var w = contentW, h = 24;
    if(lh.w && lh.h){ h = Math.min(24, w*lh.h/lh.w); w = h*lh.w/lh.h; if(w>contentW){ w=contentW; h=w*lh.h/lh.w; } }
    try{ doc.addImage(State.settings.letterheadDataUrl, 'JPEG', margin, y, w, h); }catch(e){}

  } else {
    doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(dark[0],dark[1],dark[2]);

  }

  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(primary[0],primary[1],primary[2]);
  doc.text('INVOICE', pageW-margin, headerTop+8, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text('No. '+draft.number, pageW-margin, headerTop+14, {align:'right'});
  doc.text('Date: '+fmtDateNice(draft.dateStr), pageW-margin, headerTop+19, {align:'right'});
  if(draft.dueDateStr) doc.text('Due: '+fmtDateNice(draft.dueDateStr), pageW-margin, headerTop+24, {align:'right'});

  y = Math.max(y, headerTop+30);
  doc.setDrawColor(220,224,218); doc.setLineWidth(0.4); doc.line(margin,y,pageW-margin,y); y+=8;

  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text('BILL TO', margin, y); y+=5.5;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(dark[0],dark[1],dark[2]);
  doc.text(draft.billToName || 'Customer', margin, y); y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(muted[0],muted[1],muted[2]);
  (draft.billToContact||'').split('\n').filter(Boolean).forEach(function(line){ doc.text(line, margin, y); y+=4.5; });
  y += 6;

  var colDesc = margin+3, colQty = margin+contentW-70, colPrice = margin+contentW-46, colAmt = margin+contentW-3;
  doc.setFillColor(primary[0],primary[1],primary[2]); doc.rect(margin, y, contentW, 8, 'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('DESCRIPTION', colDesc, y+5.5);
  doc.text('QTY', colQty, y+5.5, {align:'right'});
  doc.text('PRICE', colPrice, y+5.5, {align:'right'});
  doc.text('AMOUNT', colAmt, y+5.5, {align:'right'});
  y += 8;

  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(dark[0],dark[1],dark[2]);
  var subtotal = 0;
  draft.items.forEach(function(it, idx){
    var qty = Number(it.qty)||0, price = Number(it.unitPrice)||0, amt = qty*price; subtotal += amt;
    if(y > 260){ doc.addPage(); y = margin; }
    if(idx % 2 === 1){ doc.setFillColor(244,246,243); doc.rect(margin, y, contentW, 7.5, 'F'); }
    var descLines = doc.splitTextToSize(it.desc || '', colQty-colDesc-4);
    doc.text(descLines, colDesc, y+5.2);
    doc.text(String(qty), colQty, y+5.2, {align:'right'});
    doc.text(fmtMoney(price), colPrice, y+5.2, {align:'right'});
    doc.text(fmtMoney(amt), colAmt, y+5.2, {align:'right'});
    y += Math.max(7.5, descLines.length*4.6);
  });

  y += 4;
  doc.setDrawColor(220,224,218); doc.line(margin, y, pageW-margin, y); y+=7;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text('Subtotal', colPrice, y, {align:'right'});
  doc.setTextColor(dark[0],dark[1],dark[2]);
  doc.text(fmtMoney(subtotal), colAmt, y, {align:'right'});
  y += 9;

  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(255,255,255);

    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(dark[0],dark[1],dark[2]);

  }

  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text('Generated with Pesa · '+fmtDateNice(new Date()), margin, 290);

function monthOptionsHtml(){
  var opts = [], d = new Date(); d.setDate(1);
  for(var i=0;i<12;i++){
    var val = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    var label = d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    opts.push('<option value="'+val+'"'+(i===0?' selected':'')+'>'+label+'</option>');
    d.setMonth(d.getMonth()-1);
  }
  return opts.join('');
}

/** Build the report PDF for an explicit date range [start, end).
 * rangeLabel is the human-readable heading shown on the report. */
function buildReportPdf(start, end, rangeLabel){
  var jsPDFCtor = getJsPDF();
  if(!jsPDFCtor) return null;
  var monthLabel = rangeLabel;

  var salesIn = State.sales.filter(function(s){ var d=new Date(s.createdAt); return d>=start && d<end; });
  var expensesIn = State.expenses.filter(function(e){ var d=new Date(e.createdAt); return d>=start && d<end; });
  var revenue = salesIn.reduce(function(s,x){return s+x.total;},0);
  var cogs = salesIn.reduce(function(s,x){return s+(x.cost||0);},0);
  var grossProfit = revenue-cogs;
  var expByCat = {};
  expensesIn.forEach(function(e){ expByCat[e.category]=(expByCat[e.category]||0)+e.amount; });
  var expensesTotal = expensesIn.reduce(function(s,e){return s+e.amount;},0);
  var netProfit = grossProfit-expensesTotal;
  var totalOwed = State.customers.reduce(function(s,c){return s+(c.balance||0);},0);

  var byProduct = {};
  salesIn.forEach(function(s){ (s.items||[]).forEach(function(it){
    var k = it.name;
    if(!byProduct[k]) byProduct[k] = {qty:0, revenue:0, cost:0};
    byProduct[k].qty += it.qty; byProduct[k].revenue += it.lineTotal; byProduct[k].cost += (it.cost||0)*it.qty;
  }); });
  var productRows = Object.keys(byProduct).map(function(k){ var p=byProduct[k]; return {name:k, qty:p.qty, revenue:p.revenue, profit:p.revenue-p.cost}; })
    .sort(function(a,b){ return b.revenue-a.revenue; });

  var totalStockValue = State.products.reduce(function(s,p){ return s+(p.costPrice||0)*(p.stockQty||0); }, 0);

  var doc = new jsPDFCtor({ unit:'mm', format:'a4' });
  var head = drawDocHeader(doc);
  var margin = head.margin, contentW = head.contentW, pageW = head.pageW, y = head.y;
  var t = head.t, primary=t.primary, accent=t.accent, muted=t.muted, dark=t.dark;

  doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(primary[0],primary[1],primary[2]);
  doc.text(State.settings.shopName || 'Pesa', margin, y+6);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text('Monthly report — '+monthLabel, margin, y+12);
  doc.text('Generated '+fmtDateNice(new Date()), pageW-margin, y+6, {align:'right'});
  y += 20;
  doc.setDrawColor(220,224,218); doc.line(margin,y,pageW-margin,y); y+=9;

  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(dark[0],dark[1],dark[2]);
  doc.text('Summary', margin, y); y+=7;
  pdfSummaryLine(doc,margin,y,contentW,'Sales revenue', fmtMoney(revenue)); y+=6.5;
  pdfSummaryLine(doc,margin,y,contentW,'Cost of goods sold', '−'+fmtMoney(cogs)); y+=6.5;
  pdfSummaryLine(doc,margin,y,contentW,'Gross profit', fmtMoney(grossProfit), {bold:true}); y+=8;
  doc.setDrawColor(220,224,218); doc.line(margin,y-5,pageW-margin,y-5);
  pdfSummaryLine(doc,margin,y,contentW,'Operating expenses', '−'+fmtMoney(expensesTotal)); y+=8;
  doc.setDrawColor(220,224,218); doc.line(margin,y-5,pageW-margin,y-5);
  pdfSummaryLine(doc,margin,y,contentW, netProfit>=0?'Net profit':'Net loss', fmtMoney(Math.abs(netProfit)), {bold:true, size:12.5, color: netProfit>=0?[47,125,79]:[179,64,42]}); y+=10;
  pdfSummaryLine(doc,margin,y,contentW,'Outstanding customer credit (as of today)', fmtMoney(totalOwed)); y+=6.5;
  pdfSummaryLine(doc,margin,y,contentW,'Stock on hand, valued at cost (as of today)', fmtMoney(totalStockValue)); y+=10;

  if(Object.keys(expByCat).length){
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(dark[0],dark[1],dark[2]);
    doc.text('Expenses by category', margin, y); y+=5;
    y = pdfTable(doc, { x:margin, y:y, width:contentW, zebra:true,
      columns:[{label:'CATEGORY', width:contentW-40},{label:'AMOUNT', width:40, align:'right'}],
      rows: Object.keys(expByCat).sort(function(a,b){return expByCat[b]-expByCat[a];}).map(function(k){ return [k, fmtMoney(expByCat[k])]; })
    });
    y += 8;
  }

  if(productRows.length){
    if(y>230){ doc.addPage(); y=margin; }
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(dark[0],dark[1],dark[2]);
    doc.text('Product performance', margin, y); y+=5;
    pdfTable(doc, { x:margin, y:y, width:contentW, zebra:true,
      columns:[{label:'PRODUCT', width:contentW-90},{label:'QTY SOLD', width:30, align:'right'},{label:'REVENUE', width:30, align:'right'},{label:'PROFIT', width:30, align:'right'}],
      rows: productRows.map(function(p){ return [p.name, String(p.qty), fmtMoney(p.revenue), fmtMoney(p.profit)]; })
    });
  }

  doc.addPage(); y = margin;
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(primary[0],primary[1],primary[2]);
  doc.text('Current stock', margin, y+2); y+=9;
  var stockRows = State.products.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'');}).map(function(p){
    return [p.name, fmtMoney(p.costPrice), fmtMoney(p.sellPrice), String(p.stockQty), fmtMoney((p.costPrice||0)*(p.stockQty||0))];
  });
  y = pdfTable(doc, { x:margin, y:y, width:contentW, zebra:true,
    columns:[{label:'PRODUCT', width:contentW-100},{label:'COST', width:25,align:'right'},{label:'SELL', width:25,align:'right'},{label:'QTY', width:20,align:'right'},{label:'STOCK VALUE', width:30,align:'right'}],
    rows: stockRows
  });
  y += 6;
  doc.setDrawColor(220,224,218); doc.line(margin,y,pageW-margin,y); y+=6;
  pdfSummaryLine(doc, margin, y, contentW, 'Total stock value (at cost)', fmtMoney(totalStockValue), {bold:true});

  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text('Generated with Pesa', margin, 290);
  return doc;
}

/** Legacy helper: build a report for a whole calendar month ("YYYY-MM"). */
function buildMonthlyReportPdf(monthValue){
  var parts = monthValue.split('-');
  var yr = parseInt(parts[0],10), mo = parseInt(parts[1],10);
  var start = new Date(yr, mo-1, 1), end = new Date(yr, mo, 1);
  var label = start.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  return buildReportPdf(start, end, label);
}

/** Build a report for an arbitrary date range picked from the calendar UI.
 * fromStr/toStr are "YYYY-MM-DD" (inclusive on both ends). */
function buildReportPdfForRange(fromStr, toStr){
  var start = new Date(fromStr+'T00:00:00');
  var end = new Date(toStr+'T00:00:00'); end.setDate(end.getDate()+1); // make end exclusive, inclusive of the picked day
  var label = fmtDateNice(start) + ' – ' + fmtDateNice(new Date(toStr+'T00:00:00'));
  return buildReportPdf(start, end, label);
}

/* ============================== TAB: DASHBOARD ============================== */
function renderDashboard(){
  if(!State.ready.sales || !State.ready.expenses || !State.ready.products || !State.ready.customers){
    return '<div class="empty">Loading your shop…</div>';
  }
  // Multi-branch: an owner viewing a specific branch sees dashboard figures
  // scoped to it (records with no branchId — i.e. everything made before
  // multi-branch existed — still count everywhere, so nothing disappears).
  // Non-owners, and owners who never create a second branch, see the exact
  // same combined figures as before.
  var realSales = State.sales, realProducts = State.products;
  var branchBannerHtml = '';
  if(isOwner() && State.branches.length>0){
    var bid = State.settings.currentBranchId || 'all';
    State.sales = branchScoped(realSales);
    State.products = branchScoped(realProducts);
    if(bid !== 'all'){
      var b = State.branches.find(function(x){ return x.id===bid; });
      branchBannerHtml = '<div class="banner">Viewing: <strong>'+esc(b?b.name:'branch')+'</strong> — switch branches in Settings.</div>';
    }
  }
  var now = new Date();
  var wk = startOfWeek(now), mo = startOfMonth(now);
  var sumOf = function(list){ return list.reduce(function(s,x){return s+x.total;},0); };
  function since(d){ return State.sales.filter(function(s){ return new Date(s.createdAt) >= d; }); }

  var days7 = lastNDaysTotals(State.sales, 7);
  var todayTotal = days7[days7.length-1].total;
  var yestTotal = days7[days7.length-2] ? days7[days7.length-2].total : 0;
  var delta = yestTotal > 0 ? ((todayTotal-yestTotal)/yestTotal*100) : (todayTotal>0?100:0);
  var deltaUp = delta >= 0;

  var todaySales = State.sales.filter(function(s){ return todayKey(new Date(s.createdAt))===todayKey(); });
  var weekSales = since(wk);
  var monthSales = since(mo);
  var monthExpenses = State.expenses.filter(function(e){ return new Date(e.createdAt) >= mo; }).reduce(function(s,e){return s+e.amount;},0);
  var monthRevenue = monthSales.reduce(function(s,x){return s+x.total;},0);
  var monthProfit = monthSales.reduce(function(s,x){return s+(x.profit!=null?x.profit:0);},0) - monthExpenses;
  var totalOwed = State.customers.reduce(function(s,c){return s+(c.balance||0);},0);

  var pmTotals = {cash:0, card:0, wallet:0, credit:0};
  todaySales.forEach(function(s){ pmTotals[s.paymentMethod] = (pmTotals[s.paymentMethod]||0) + s.total; });

  var lowStockProducts = State.products.filter(function(p){ return p.stockQty!=null && p.stockQty <= (p.lowStock!=null?p.lowStock:State.settings.lowStockDefault); })
    .sort(function(a,b){ return a.stockQty-b.stockQty; });
  var debtors = State.customers.filter(function(c){ return (c.balance||0) > 0; }).sort(function(a,b){ return b.balance-a.balance; });

  var byProduct = {};
  monthSales.forEach(function(s){ (s.items||[]).forEach(function(it){ byProduct[it.name] = (byProduct[it.name]||0) + it.lineTotal; }); });
  var top = Object.keys(byProduct).map(function(k){ return {name:k, v:byProduct[k]}; }).sort(function(a,b){return b.v-a.v;}).slice(0,5);
  var topMax = top.length ? top[0].v : 1;

  /* ---- hero ---- */
  var html = '<div class="hero-card">' +
    '<div class="hero-top"><div>' +
      '<div class="hero-lbl">Today’s sales</div>' +
      '<div class="hero-val num">'+fmtMoney(todayTotal)+'</div>' +
      '<div class="hero-delta'+(deltaUp?'':' down')+'">'+(deltaUp?ICONS.trendUp:ICONS.trendDown)+' '+Math.abs(Math.round(delta))+'% vs yesterday</div>' +
    '</div></div>' +
    '<div class="hero-chart">' + sparklineSvg(days7, {stroke:'#fff', fill:'rgba(255,255,255,0.22)'}) +
      '<div class="hero-ticks">' + days7.map(function(d){ return '<span>'+d.label+'</span>'; }).join('') + '</div>' +
    '</div>' +
  '</div>';

  html += '<div class="paysplit-label">'+tr('Today’s sales by payment method')+'</div>';
  html += '<div class="paysplit">' +
    '<div class="pt"><div class="l">'+tr('Cash sales')+'</div><div class="v">'+fmtMoney(pmTotals.cash)+'</div></div>' +
    '<div class="pt"><div class="l">'+tr('Card sales')+'</div><div class="v">'+fmtMoney(pmTotals.card)+'</div></div>' +
    '<div class="pt"><div class="l">'+tr('Mobile wallet sales')+'</div><div class="v">'+fmtMoney(pmTotals.wallet)+'</div></div>' +
    '<div class="pt"><div class="l">'+tr('Credit sales')+'</div><div class="v">'+fmtMoney(pmTotals.credit)+'</div></div>' +
  '</div>';

  /* ---- quick actions ---- */
  html += '<div class="qa-row">' +
    '<button class="qa-btn" data-qa="sell"><span class="qa-ico">'+ICONS.cart.replace(/width="26" height="26"/,'width="18" height="18"')+'</span><span class="qa-lbl">'+tr('Sell')+'</span></button>' +
    '<button class="qa-btn" data-qa="stock"><span class="qa-ico">'+ICONS.box.replace(/width="26" height="26"/,'width="18" height="18"')+'</span><span class="qa-lbl">'+tr('Stock')+'</span></button>' +
    '<button class="qa-btn" data-qa="expense"><span class="qa-ico">'+ICONS.receipt.replace(/width="26" height="26"/,'width="18" height="18"')+'</span><span class="qa-lbl">'+tr('Expenses')+'</span></button>' +
    '<button class="qa-btn" data-qa="customer"><span class="qa-ico">'+ICONS.people.replace(/width="26" height="26"/,'width="18" height="18"')+'</span><span class="qa-lbl">'+tr('Customer')+'</span></button>' +
  '</div>';

  /* ---- stat grid ---- */
  html += '<div class="section-title">'+tr('Overview')+'</div><div class="stats">' +
    '<div class="stat"><div class="lbl">This week</div><div class="v num">'+fmtMoney(sumOf(weekSales))+'</div></div>' +
    '<div class="stat"><div class="lbl">This month</div><div class="v num">'+fmtMoney(monthRevenue)+'</div></div>' +
    '<div class="stat"><div class="lbl">Est. profit (mo.)</div><div class="v num small" style="color:'+(monthProfit>=0?'var(--success)':'var(--danger)')+'">'+fmtMoney(monthProfit)+'</div></div>' +
    '<div class="stat"><div class="lbl">Owed to you</div><div class="v num small" style="color:var(--danger)">'+fmtMoney(totalOwed)+'</div></div>' +
  '</div>';

  /* ---- needs attention ---- */
  var attnCount = lowStockProducts.length + debtors.length;
  html += '<div class="section-title">'+tr('Needs attention')+(attnCount?' <span style="text-transform:none;letter-spacing:0;color:var(--text-muted);font-weight:500;">('+attnCount+')</span>':'')+'</div><div class="card pad">';
  if(attnCount === 0){
    html += '<div class="all-clear">'+ICONS.check+'<span>All caught up — stock is healthy and no one owes you.</span></div>';
  } else {
    lowStockProducts.slice(0,3).forEach(function(p){
      var out = p.stockQty<=0;
      html += '<div class="att-row" data-goto-product="'+p.id+'">' +
        '<div class="att-dot'+(out?'':' warn')+'"></div>' +
        '<div class="att-main"><div class="att-title">'+esc(p.name)+'</div><div class="att-sub">'+(out?'Out of stock':'Running low')+'</div></div>' +
        '<div class="att-val">'+p.stockQty+' '+(p.unit||'left')+'</div>' +
      '</div>';
    });
    debtors.slice(0,3).forEach(function(c){
      html += '<div class="att-row" data-goto-customer="'+c.id+'">' +
        '<div class="att-dot"></div>' +
        '<div class="att-main"><div class="att-title">'+esc(c.name)+'</div><div class="att-sub">Owes since last visit</div></div>' +
        '<div class="att-val num">'+fmtMoney(c.balance)+'</div>' +
      '</div>';
    });
  }
  html += '</div>';

  /* ---- top sellers ---- */
  html += '<div class="section-title">'+tr('Top sellers this month')+'</div><div class="card pad">' +
    (top.length===0 ? '<div style="color:var(--text-muted);font-size:13px;">No sales yet this month.</div>' :
      top.map(function(t){ return '<div class="barrow"><div class="bl">'+esc(t.name)+'</div><div class="btrack"><div class="bfill" style="width:'+(t.v/topMax*100)+'%"></div></div><div class="bv num">'+fmtMoney(t.v)+'</div></div>'; }).join('')) +
  '</div>';

  /* ---- sales insights (collapsible) ---- */
  html += dashboardInsightsHtml();

  /* ---- recent sales ---- */
  html += '<div class="section-title">'+tr('Recent sales')+'</div>';
  if(State.sales.length === 0){
    html += '<div class="card pad" style="color:var(--text-muted);font-size:13px;">No sales recorded yet.</div>';
  } else {
    html += '<div class="rowlist">' + State.sales.slice(0,5).map(function(s){
      var pmLabel = s.paymentMethod==='cash'?tr('Cash'):(s.paymentMethod==='card'?tr('Card'):(s.paymentMethod==='wallet'?tr('Mobile wallet'):tr('Credit')));
      var itemCount = (s.items||[]).reduce(function(a,i){return a+i.qty;},0);
      return '<div class="row" style="cursor:default;">' +
        '<div class="avatar">'+ICONS.cart.replace(/width="26" height="26"/,'width="16" height="16"')+'</div>' +
        '<div class="main"><div class="title">'+itemCount+' item'+(itemCount===1?'':'s')+'</div><div class="sub">'+pmLabel+' · '+fmtDateTime(s.createdAt)+'</div></div>' +
        '<div class="trail"><div class="amt num">'+fmtMoney(s.total)+'</div><button class="note" data-invoice-sale="'+s.id+'" style="background:none;border:none;padding:0;color:var(--primary-dim);font-weight:600;font-size:10.5px;cursor:pointer;">'+tr('Invoice')+'</button></div>' +
      '</div>';
    }).join('') + '</div>';
  }

  /* ---- invoicing ---- */
  html += '<div class="section-title">'+tr('Invoicing')+'</div><div class="card pad" style="display:flex;flex-direction:column;gap:10px;">' +
    '<button class="btn btn-accent btn-block" id="createInvoiceBtn">'+tr('Create an invoice')+'</button>' +
    '<div style="font-size:11.5px;color:var(--text-muted);text-align:center;">Downloads as a PDF you can print or share. Add your logo in Settings to brand it.</div>' +
  '</div>';

  /* ---- report ---- */
  var todayISO = todayKey();
  var monthStartISO = (function(){ var d=new Date(); d.setDate(1); return todayKey(d); })();
  html += '<div class="section-title">'+tr('Reports')+'</div><div class="card pad" style="display:flex;flex-direction:column;gap:10px;">' +
    '<div class="segbtns" id="reportPresetBtns">' +
      '<button type="button" class="segbtn active" data-preset="month">'+tr('This month')+'</button>' +
      '<button type="button" class="segbtn" data-preset="lastmonth">'+tr('Last month')+'</button>' +
      '<button type="button" class="segbtn" data-preset="custom">'+tr('Custom')+'</button>' +
    '</div>' +
    '<div class="field-row" id="reportRangeRow" style="display:none;margin:0;">' +
      '<div class="field" style="margin:0;"><label>'+tr('From')+'</label><input type="date" id="reportFrom" value="'+monthStartISO+'" max="'+todayISO+'"></div>' +
      '<div class="field" style="margin:0;"><label>'+tr('To')+'</label><input type="date" id="reportTo" value="'+todayISO+'" max="'+todayISO+'"></div>' +
    '</div>' +
    '<button class="btn btn-ghost btn-block" id="downloadReportBtn">'+tr('Download report (PDF)')+'</button>' +
    '<div style="font-size:11.5px;color:var(--text-muted);text-align:center;">Revenue, cost of goods, expenses, profit or loss, and a full stock valuation for any date range you pick.</div>' +
  '</div>';

  /* ---- data ---- */
  html += '<div class="section-title">'+tr('Data')+'</div><div class="card pad" style="display:flex;flex-direction:column;gap:10px;">' +
    '<button class="btn btn-ghost btn-block" id="exportDataBtn">'+tr('Export all data (.json)')+'</button>' +
    '<div style="font-size:11.5px;color:var(--text-muted);text-align:center;">'+(Store.isCloud()?'Saved securely and synced automatically.':'Saved on this device only.')+'</div>' +
  '</div>';

  State.sales = realSales; State.products = realProducts;
  return branchBannerHtml + html;
}

function exportData(){
  var payload = {
    exportedAt: new Date().toISOString(),
    shop: State.settings,
    products: State.products,
    customers: State.customers,
    sales: State.sales,
    expenses: State.expenses
  };
  var json = JSON.stringify(payload, null, 2);
  var filename = 'pesa-export-'+todayKey()+'.json';
  (async function(){
    try{
      if(window.claude && window.claude.use){
        var dl = await window.claude.use('downloads');
        if(dl){
          await dl.save({ filename: filename, data: json });
          toast('Export ready');
          return;
        }
      }
    }catch(e){
      if(e && e.code === 'declined') return;
    }
    if(browserDownload(filename, new Blob([json], {type:'application/json'}))){
      toast('Export ready');
    } else {
      toast('Downloads not available in this view');
    }
  })();
}

  rows += '<div class="drawer-sub">Insights</div>';
  rows += drawerRowHtml('insights', ICONS.chartbar, 'Sales insights');
  if(isManagerOrOwner()){
    rows += '<div class="drawer-sub">Operations</div>';
    rows += drawerRowHtml('suppliers', ICONS.truck, 'Suppliers', State.suppliers.length);
    rows += drawerRowHtml('pos', ICONS.clipboard, 'Purchase orders', State.purchaseOrders.length);
    rows += drawerRowHtml('wastage', ICONS.trash, 'Wastage & shrinkage');
    if(isOwner()) rows += drawerRowHtml('branches', ICONS.branch, 'Branches', State.branches.length+1);
    rows += drawerRowHtml('vat', ICONS.percent, 'NamRA VAT summary');
    rows += drawerRowHtml('audit', ICONS.clock, 'Activity log');
  }
  rows += '<div class="drawer-sub">Help</div>';
  rows += drawerRowHtml('training', ICONS.book, 'Training');
  rows += drawerRowHtml('about', ICONS.info, 'About Pesa');
  overlay.innerHTML = '<div class="drawer">' +
    '<div class="app-watermark" aria-hidden="true"></div>' +
    '<div class="drawer-head"><h2>Menu</h2>' +
      '<div class="drawer-logo" aria-hidden="true" title="Pesa"></div>' +
      '<button class="drawer-close" id="drawerCloseBtn" type="button" aria-label="Close">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>' +
    '</button></div>' +
    rows +
  '</div>';
  root.innerHTML = '';
  root.appendChild(overlay);
  function closeDrawer(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); }
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeDrawer(); });
  overlay.querySelector('#drawerCloseBtn').addEventListener('click', closeDrawer);
  overlay.querySelectorAll('[data-drawer-row]').forEach(function(el){
    el.addEventListener('click', function(){
      var key = el.getAttribute('data-drawer-row');
      closeDrawer();
      if(key==='tab-dashboard') setTab('dashboard');
      else if(key==='tab-sell') setTab('sell');
      else if(key==='tab-stock') setTab('stock');
      else if(key==='tab-credit') setTab('credit');
      else if(key==='tab-expenses') setTab('expenses');
      else if(key==='tab-till') setTab('till');
      else if(key==='insights'){
        setTab('dashboard');
        _insightsOpen = true;
        render();
        setTimeout(function(){
          var t = document.getElementById('insightsToggle');
          if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
        }, 60);
      } else if(key==='suppliers') openSuppliersSheet();
      else if(key==='pos') openPurchaseOrdersSheet();
      else if(key==='wastage') openWastageSheet();
      else if(key==='branches') openBranchesSheet();
      else if(key==='vat') openVatSummarySheet();
      else if(key==='audit') openAuditLogSheet();
      else if(key==='training') openTrainingSheet();
      else if(key==='about') openAboutSheet();
    });
  });
}

function importDataFromFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try{ data = JSON.parse(reader.result); }catch(e){ toast('That file isn’t a valid Pesa backup'); return; }
    confirmSheet('Restore backup?', 'This replaces your shop settings, products, customers, sales and expenses with the contents of this file. This cannot be undone.', 'Restore', function(){
      (async function(){
        try{
          if(data.shop) { State.settings = Object.assign({}, State.settings, data.shop); refs.settings.set(State.settings); }
          var restoreCollection = async function(colRef, rows){
            if(!Array.isArray(rows)) return;
            for(var i=0;i<rows.length;i++){
              var row = Object.assign({}, rows[i]);
              var id = row.id; delete row.id;
              await colRef.doc(id).set(row);
            }
          };
          await restoreCollection(refs.products, data.products);
          await restoreCollection(refs.customers, data.customers);
          await restoreCollection(refs.sales, data.sales);
          await restoreCollection(refs.expenses, data.expenses);
          toast('Backup restored');
          closeModal();
        }catch(err){ toast('Restore failed — the backup file may be corrupted'); }
      })();
    }, true);
  };
  reader.readAsText(file);
}

function handleBrandImageUpload(file, kind){
  toast('Processing image…');
  resizeImageFile(file, kind==='letterhead' ? 900 : 300, 0.85).then(function(result){
    var patch = {};
    if(kind==='logo'){ patch.logoDataUrl = result.dataUrl; patch.logoImgMeta = {w:result.w,h:result.h}; }
    else { patch.letterheadDataUrl = result.dataUrl; patch.letterheadImgMeta = {w:result.w,h:result.h}; }
    State.settings = Object.assign({}, State.settings, patch);
    refs.settings.set(State.settings);
    closeModal();
    openSettingsSheet();
    toast((kind==='logo'?'Logo':'Letterhead') + ' updated');
  }).catch(function(){
    toast('Couldn’t process that image — try a different file');
  });
}

function removeBrandImage(kind){
  var patch = {};
  if(kind==='logo'){ patch.logoDataUrl = null; patch.logoImgMeta = null; }
  else { patch.letterheadDataUrl = null; patch.letterheadImgMeta = null; }
  State.settings = Object.assign({}, State.settings, patch);
  refs.settings.set(State.settings);
  closeModal();
  openSettingsSheet();
  toast((kind==='logo'?'Logo':'Letterhead') + ' removed');
}

function aiFindProducts(query){
  var q = String(query||'').trim().toLowerCase();
  if(!q) return State.products.slice(0,50);
  var exact = State.products.filter(function(p){ return (p.name||'').toLowerCase() === q; });
  if(exact.length) return exact;
  return State.products.filter(function(p){ return (p.name||'').toLowerCase().indexOf(q) > -1; }).slice(0,50);
}
function aiFindCustomers(query){
  var q = String(query||'').trim().toLowerCase();
  if(!q) return State.customers.slice().sort(function(a,b){ return (b.balance||0)-(a.balance||0); }).slice(0,50);
  var exact = State.customers.filter(function(c){ return (c.name||'').toLowerCase() === q; });
  if(exact.length) return exact;
  return State.customers.filter(function(c){ return (c.name||'').toLowerCase().indexOf(q) > -1; }).slice(0,50);
}

function buildAITools(){
  return [
    {
      name:'get_shop_summary',
      description:'Get an overview of the shop right now: today\'s and this month\'s sales, estimated profit, low-stock products, total owed by customers, and counts. Use this for general "how is business" or "what needs attention" questions.',
      execute:function(){
        var now=new Date(), mo=startOfMonth(now);
        var todaySales = State.sales.filter(function(s){ return todayKey(new Date(s.createdAt))===todayKey(); });
        var todayTotal = todaySales.reduce(function(s,x){return s+x.total;},0);
        var monthSales = State.sales.filter(function(s){ return new Date(s.createdAt)>=mo; });
        var monthRevenue = monthSales.reduce(function(s,x){return s+x.total;},0);
        var monthExpenses = State.expenses.filter(function(e){ return new Date(e.createdAt)>=mo; }).reduce(function(s,e){return s+e.amount;},0);
        var monthProfit = monthSales.reduce(function(s,x){return s+(x.profit!=null?x.profit:0);},0) - monthExpenses;
        var lowStock = State.products.filter(function(p){ return p.stockQty!=null && p.stockQty<=(p.lowStock!=null?p.lowStock:State.settings.lowStockDefault); });
        var totalOwed = State.customers.reduce(function(s,c){return s+(c.balance||0);},0);
        return {
          shopName: State.settings.shopName, todaySalesTotal: todayTotal, monthRevenue: monthRevenue, monthEstimatedProfit: monthProfit,
          lowStockCount: lowStock.length, lowStockProducts: lowStock.slice(0,10).map(function(p){ return {name:p.name, stockQty:p.stockQty}; }),
          totalOwedByCustomers: totalOwed, productCount: State.products.length, customerCount: State.customers.length
        };
      }
    },
    {
      name:'find_products',
      description:'Search the shop\'s product/stock list by name (case-insensitive, partial match). Leave query empty to list up to 50 products. Returns id, name, category, unit, costPrice, sellPrice, stockQty for each match.',
      inputSchema:{ type:'object', properties:{ query:{type:'string'} } },
      execute:function(input){
        return aiFindProducts(input && input.query).map(function(p){
          return { id:p.id, name:p.name, category:p.category||'', unit:p.unit||'', costPrice:p.costPrice||0, sellPrice:p.sellPrice||0, stockQty: p.stockQty==null?null:p.stockQty };
        });
      }
    },
    {
      name:'add_product',
      description:'Add a brand-new product to stock. Use only when it does not already exist (check with find_products first if unsure). Returns the created product.',
      inputSchema:{ type:'object', properties:{
        name:{type:'string'}, costPrice:{type:'number'}, sellPrice:{type:'number'}, stockQty:{type:'number'}, category:{type:'string'}, unit:{type:'string'}, lowStock:{type:'number'}
      }, required:['name'] },
      execute:function(input){
        var name = String(input && input.name || '').trim();
        if(!name) throw new Error('A product name is required.');
        var data = {
          name:name, category: input.category?String(input.category):'', unit: input.unit?String(input.unit):'',
          costPrice: Number(input.costPrice)||0, sellPrice: Number(input.sellPrice)||0,
          stockQty: input.stockQty!=null ? (parseInt(input.stockQty,10)||0) : 0,
          lowStock: input.lowStock!=null ? (parseInt(input.lowStock,10)||null) : null,
          createdAt: new Date().toISOString()
        };
        return refs.products.add(data).then(function(){ toast('Pessa AI added '+name); return Object.assign({status:'created'}, data); });
      }
    },
    {
      name:'update_product',
      description:'Change an existing product\'s price, stock quantity or other details. Provide productId (from find_products) or name to identify it. Use adjustStockBy for a relative change (e.g. 10 or -3); use stockQty to set an absolute new quantity. Returns the updated product, or throws if it can\'t be found or the name matches more than one product.',
      inputSchema:{ type:'object', properties:{
        productId:{type:'string'}, name:{type:'string'}, costPrice:{type:'number'}, sellPrice:{type:'number'}, stockQty:{type:'number'}, adjustStockBy:{type:'number'}, category:{type:'string'}, unit:{type:'string'}, lowStock:{type:'number'}
      } },
      execute:function(input){
        var product = null;
        if(input.productId) product = State.products.find(function(p){ return p.id===input.productId; });
        if(!product && input.name){
          var matches = aiFindProducts(input.name);
          if(matches.length===1) product = matches[0];
          else if(matches.length>1) throw new Error('More than one product matches "'+input.name+'": '+matches.map(function(m){return m.name;}).join(', ')+'. Ask which one, or use productId.');
        }
        if(!product) throw new Error('No product found matching that name.');
        var patch = {};
        if(input.costPrice!=null) patch.costPrice = Number(input.costPrice)||0;
        if(input.sellPrice!=null) patch.sellPrice = Number(input.sellPrice)||0;
        if(input.category!=null) patch.category = String(input.category);
        if(input.unit!=null) patch.unit = String(input.unit);
        if(input.lowStock!=null) patch.lowStock = parseInt(input.lowStock,10)||null;
        if(input.stockQty!=null) patch.stockQty = parseInt(input.stockQty,10)||0;
        else if(input.adjustStockBy!=null) patch.stockQty = Math.max(0, (product.stockQty||0) + (parseInt(input.adjustStockBy,10)||0));
        patch.updatedAt = new Date().toISOString();
        return refs.products.doc(product.id).update(patch).then(function(){
          toast('Pessa AI updated '+product.name);
          return Object.assign({status:'updated', id:product.id, name:product.name}, patch);
        });
      }
    },
    {
      name:'bulk_add_products',
      description:'Add many new products to stock at once — use when the owner pastes or describes a whole list of products rather than one at a time. Each row needs at least a name; missing prices/quantity default to 0. Returns how many were added.',
      inputSchema:{ type:'object', properties:{ rows:{ type:'array', items:{ type:'object', properties:{
        name:{type:'string'}, costPrice:{type:'number'}, sellPrice:{type:'number'}, stockQty:{type:'number'}, category:{type:'string'}, unit:{type:'string'}

        });
      }
    },
    {
      name:'find_customers',
      description:'Search customers by name (case-insensitive, partial match). Leave query empty to list customers sorted by balance owed, highest first. Returns id, name, phone, balance.',
      inputSchema:{ type:'object', properties:{ query:{type:'string'} } },

    },
    {
      name:'add_customer',
      description:'Add a new customer record. Returns the created customer.',
      inputSchema:{ type:'object', properties:{ name:{type:'string'}, phone:{type:'string'} }, required:['name'] },
      execute:function(input){
        var name = String(input && input.name || '').trim();
        if(!name) throw new Error('A customer name is required.');
        var data = { name:name, phone: input.phone?String(input.phone):'', balance:0, createdAt:new Date().toISOString() };
        return refs.customers.add(data).then(function(){ toast('Pessa AI added customer '+name); return Object.assign({status:'created'}, data); });
      }
    },
    {
      name:'record_payment',
      description:'Record a payment received from a customer against their credit balance. Look the customer up with find_customers first if unsure of the exact name. Returns the customer\'s new balance.',
      inputSchema:{ type:'object', properties:{ customerId:{type:'string'}, customerName:{type:'string'}, amount:{type:'number'}, note:{type:'string'} }, required:['amount'] },
      execute:function(input){
        var customer = null;
        if(input.customerId) customer = State.customers.find(function(c){ return c.id===input.customerId; });
        if(!customer && input.customerName){
          var matches = aiFindCustomers(input.customerName);
          if(matches.length===1) customer = matches[0];
          else if(matches.length>1) throw new Error('More than one customer matches "'+input.customerName+'": '+matches.map(function(m){return m.name;}).join(', ')+'.');
        }
        if(!customer) throw new Error('No matching customer found. Use find_customers first.');

        if(!amt || amt<=0) throw new Error('Amount must be a positive number.');

        return refs.customers.doc(customer.id).update({ balance:newBal }).then(function(){
          return refs.customers.doc(customer.id).collection('ledger').add({ type:'payment', amount:amt, note: input.note?String(input.note):'', createdAt:new Date().toISOString(), balanceAfter:newBal });
        }).then(function(){

          return { status:'recorded', customer:customer.name, amount:amt, newBalance:newBal };
        });
      }
    },
    {
      name:'record_expense',
      description:'Log a business expense (rent, stock purchase, transport, wages, etc). Returns the created expense.',
      inputSchema:{ type:'object', properties:{ category:{type:'string'}, amount:{type:'number'}, note:{type:'string'} }, required:['category','amount'] },
      execute:function(input){
        var amt = Number(input.amount);
        if(!amt || amt<=0) throw new Error('Amount must be a positive number.');
        var data = { category: String(input.category||'Other'), amount:amt, note: input.note?String(input.note):'', createdAt:new Date().toISOString() };
        return refs.expenses.add(data).then(function(){ toast('Pessa AI logged an expense'); return Object.assign({status:'recorded'}, data); });
      }
    },
    {
      name:'record_sale',
      description:'Record a completed sale of one or more products. Look products up with find_products first if unsure of exact names — this matches names loosely but errors if a name is ambiguous, not found, or there is not enough stock. paymentMethod must be "cash", "card", "wallet" or "credit"; customerName is required when paymentMethod is "credit". Reduces stock automatically and returns the sale total.',
      inputSchema:{ type:'object', properties:{
        items:{ type:'array', items:{ type:'object', properties:{ productName:{type:'string'}, productId:{type:'string'}, qty:{type:'number'} }, required:['qty'] } },
        paymentMethod:{ type:'string', enum:['cash','card','wallet','credit'] },
        customerName:{ type:'string' }
      }, required:['items','paymentMethod'] },
      execute:function(input){
        var pm = String(input.paymentMethod||'cash');
        if(['cash','card','wallet','credit'].indexOf(pm)===-1) throw new Error('paymentMethod must be cash, card, wallet or credit.');
        var items = Array.isArray(input.items) ? input.items : [];
        if(items.length===0) throw new Error('At least one item is required.');
        var resolved = [];
        for(var i=0;i<items.length;i++){
          var it = items[i];
          var product = null;
          if(it.productId) product = State.products.find(function(p){ return p.id===it.productId; });
          if(!product && it.productName){
            var matches = aiFindProducts(it.productName);
            if(matches.length===1) product = matches[0];
            else if(matches.length>1) throw new Error('More than one product matches "'+it.productName+'": '+matches.map(function(m){return m.name;}).join(', ')+'.');
          }
          if(!product) throw new Error('No product found for "'+(it.productName||it.productId)+'".');
          var qty = Number(it.qty)||0;
          if(qty<=0) throw new Error('Quantity for '+product.name+' must be greater than zero.');
          if(product.stockQty!=null && qty > product.stockQty) throw new Error('Only '+product.stockQty+' '+(product.unit||'in stock')+' of '+product.name+' available.');
          resolved.push({ product:product, qty:qty });
        }
        var customer = null;
        if(pm === 'credit'){
          if(!input.customerName) throw new Error('customerName is required for a credit sale.');
          var cmatches = aiFindCustomers(input.customerName);
          if(cmatches.length===1) customer = cmatches[0];
          else if(cmatches.length>1) throw new Error('More than one customer matches "'+input.customerName+'": '+cmatches.map(function(m){return m.name;}).join(', ')+'.');
          else throw new Error('No matching customer found for a credit sale. Add them first, or check the name with find_customers.');
        }
        var saleItems = resolved.map(function(r){ return { productId:r.product.id, name:r.product.name, qty:r.qty, unitPrice:r.product.sellPrice||0, cost:r.product.costPrice||0, lineTotal:(r.product.sellPrice||0)*r.qty }; });
        var total = saleItems.reduce(function(s,x){return s+x.lineTotal;},0);
        var costTotal = saleItems.reduce(function(s,x){return s+(x.cost*x.qty);},0);
        var sale = { items:saleItems, total:total, cost:costTotal, profit:total-costTotal, paymentMethod:pm, customerId: customer?customer.id:null, customerName: customer?customer.name:null, createdAt:new Date().toISOString() };
        return refs.sales.add(sale).then(function(){
          resolved.forEach(function(r){
            if(r.product.stockQty!=null) refs.products.doc(r.product.id).update({ stockQty: Math.max(0, r.product.stockQty - r.qty) });
          });
          if(pm==='credit' && customer){
            var newBal = (customer.balance||0) + total;
            refs.customers.doc(customer.id).update({ balance:newBal });
            refs.customers.doc(customer.id).collection('ledger').add({ type:'charge', amount:total, note:'Sale on credit', createdAt:new Date().toISOString(), balanceAfter:newBal });
          }
          renderCartBar();
          if(State.tab==='dashboard' || State.tab==='sell') render();
          toast('Pessa AI recorded a sale — '+fmtMoney(total));
          return { status:'recorded', total:total, items:saleItems.map(function(x){ return {name:x.name, qty:x.qty, unitPrice:x.unitPrice}; }) };
        });
      }
    },
    {
      name:'navigate',
      description:'Switch the app to a different screen so the owner can see it: dashboard, sell, stock, credit or expenses.',
      inputSchema:{ type:'object', properties:{ tab:{type:'string', enum:['dashboard','sell','stock','credit','expenses']} }, required:['tab'] },
      execute:function(input){
        var tab = String(input.tab||'');
        if(['dashboard','sell','stock','credit','expenses'].indexOf(tab)===-1) throw new Error('Unknown tab.');
        setTab(tab);
        return { status:'navigated', tab:tab };
      }
    }
  ];
}

function aiChatErrorCopy(code){
  switch(code){
    case 'not_granted': case 'sampling_disabled': case 'not_declared': case 'capability_disabled': case 'capability_removed':
      return 'I’m not available in this view right now — try opening Pesa directly rather than in a preview.';
    case 'rate_limited': return 'Lots of requests right now — give it a moment and try again.';
    case 'refused': return 'I can’t help with that one.';
    case 'cancelled': return 'Stopped.';
    case 'prompt_too_large': return 'That’s a lot for me to read at once — try asking in smaller pieces.';
    case 'tools_unavailable': return null; // handled by caller with a plain-text fallback
    default: return 'Something went wrong on my end — mind trying again?';
  }
}

function aiRoleClass(role){ return role==='user' ? 'user' : 'assistant'; }

function renderAIMessages(){
  var el = document.getElementById('aiMessages');
  if(!el) return;
  var html = AIChat.turns.length===0 ?
    '<div class="ai-msg system-note">Hi, I’m Pessa AI. Ask me things like "add 10 bags of rice at cost 40 sell 55" or "who owes me money?"</div>' :
    AIChat.turns.map(function(t){ return '<div class="ai-msg '+aiRoleClass(t.role)+'">'+esc(t.content)+'</div>'; }).join('');
  if(AIChat.busy) html += '<div class="ai-msg thinking"><span class="ai-dot"></span><span class="ai-dot"></span><span class="ai-dot"></span></div>';
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

function renderAISuggestions(ov){
  var row = ov.querySelector('#aiSuggestRow');
  if(!row) return;
  if(AIChat.turns.length>0){ row.innerHTML=''; return; }
  var suggestions = ['How is business today?', 'Who owes me money?', 'What’s running low on stock?'];
  row.innerHTML = suggestions.map(function(s){ return '<button type="button" class="ai-suggest" data-suggest="'+esc(s)+'">'+esc(s)+'</button>'; }).join('');
  row.querySelectorAll('[data-suggest]').forEach(function(b){
    b.addEventListener('click', function(){ sendAIMessage(b.getAttribute('data-suggest')); });
  });
}

function disableAIInput(disabled){
  var ov = document.querySelector('.overlay');
  if(!ov) return;
  var input = ov.querySelector('#aiInput'), btn = ov.querySelector('#aiSendBtn');
  if(input) input.disabled = disabled;
  if(btn) btn.disabled = disabled;
}

function sendAIMessage(text){
  if(AIChat.busy || !text) return;
  AIChat.turns.push({ role:'user', content:text });
  AIChat.busy = true;
  var ov = document.querySelector('.overlay');
  if(ov) renderAISuggestions(ov);
  renderAIMessages();
  disableAIInput(true);

  (async function(){
    try{
      if(!(window.claude && window.claude.use)) throw {code:'not_declared'};
      var sample = await window.claude.use('sample');
      if(!sample) throw {code:'not_granted'};
      var caps = await sample.limits().catch(function(){ return null; });
      var useTools = !!(caps && caps.tools);
      var instructionsTurn = { role:'user', content: aiSystemPrompt() + "\n\n(That's how you should behave for this whole conversation — this message just sets the ground rules; respond to my messages below, not to this one.)" };
      var history = AIChat.turns.map(function(t){ return { role:t.role, content:t.content }; });
      if(history.length > 16) history = history.slice(-16);
      var conversation = [instructionsTurn].concat(history);

      var replyText;
      if(useTools){
        var result = await sample(conversation, { modelTier:'default', tools: buildAITools(), cache:false });
        replyText = result.text;
      } else {
        var result2 = await sample(conversation, { modelTier:'default', cache:false });
        replyText = result2.text + (AIChat.turns.length<=1 ? "\n\n(I can chat and answer questions here, but I can't make changes in this view.)" : '');
      }
      AIChat.turns.push({ role:'assistant', content: replyText || '…' });
    } catch(e){
      var msg = aiChatErrorCopy(e && e.code) || 'Something went wrong on my end — mind trying again?';
      AIChat.turns.push({ role:'assistant', content: msg });
    } finally {
      AIChat.busy = false;
      renderAIMessages();
      disableAIInput(false);
      var ovInput = document.querySelector('#aiInput');
      if(ovInput) ovInput.focus();
    }
  })();
}

function wireAIChat(ov){
  var input = ov.querySelector('#aiInput');
  var sendBtn = ov.querySelector('#aiSendBtn');
  function autoGrow(){ input.style.height='auto'; input.style.height = Math.min(90, input.scrollHeight)+'px'; }
  input.addEventListener('input', autoGrow);
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }
  });
  sendBtn.addEventListener('click', doSend);
  function doSend(){
    var text = input.value.trim();
    if(!text || AIChat.busy) return;
    input.value=''; autoGrow();
    sendAIMessage(text);
  }
  renderAISuggestions(ov);
  input.focus();
}

function render(){
  updateHeader();

  // sidebar drawer from every tab, not just Dashboard — the sidebar is now

  document.documentElement.setAttribute('lang', currentLangCode()==='en' ? 'en' : currentLangCode());
  var content = document.getElementById('content');
  var html = '';
  if(State.tab === 'dashboard') html = renderDashboard();
  else if(State.tab === 'sell') html = renderSell();
  else if(State.tab === 'stock') html = renderStock();
  else if(State.tab === 'credit') html = renderCredit();
  else if(State.tab === 'expenses') html = renderExpenses();
  else if(State.tab === 'till') html = renderTill();
  content.innerHTML = html;
  wireContent();
  renderCartBar();

  var allowedTabs = State.session ? roleTabs(State.session.role) : [];
  document.querySelectorAll('.navbtn').forEach(function(b){
    var t = b.getAttribute('data-tab');
    b.classList.toggle('active', t === State.tab);
    b.style.display = allowedTabs.indexOf(t) === -1 ? 'none' : '';
  });

  // FAB for stock/credit/expenses (add new)
  var oldFab = document.getElementById('fabBtn');
  if(oldFab) oldFab.remove();

    fab.className = 'fab'; fab.id = 'fabBtn';

    });
    document.getElementById('app').appendChild(fab);
  }
}
