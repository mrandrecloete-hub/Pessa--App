/* ============================== BARCODE SCANNING ============================== */
function openBarcodeScanSheet(onCode){
  var supportsDetector = ('BarcodeDetector' in window);
  var html = '<div class="sheet-head"><h2>Scan barcode</h2></div>' +
    (supportsDetector ?
      '<div id="bcCamWrap" style="position:relative;border-radius:12px;overflow:hidden;background:#000;margin-bottom:12px;">' +
        '<video id="bcVideo" playsinline autoplay muted style="width:100%;display:block;max-height:260px;object-fit:cover;"></video>' +
        '<div style="position:absolute;inset:0;border:2px solid rgba(255,255,255,0.5);pointer-events:none;"></div>' +
      '</div><div id="bcCamStatus" class="banner">Point the camera at a barcode…</div>'
      : '<div class="banner">'+ICONS.warn+'<span>Camera barcode scanning isn’t supported in this browser. Type the barcode instead.</span></div>') +
    '<div class="field"><label>Barcode number</label><div style="display:flex;gap:8px;"><input id="bcManual" inputmode="numeric" placeholder="Type or scan a barcode" style="flex:1;"><button class="btn btn-primary" id="bcManualBtn" type="button">Use</button></div></div>';
  var ov = openSheet(html, {center:true});
  var stream = null, detecting = false, rafId = null, detector = null;
  function stopCam(){
    detecting = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  }
  function finish(code){
    stopCam();
    closeModal();
    if(onCode) onCode(String(code).trim());
  }
  ov.querySelector('#bcManualBtn').addEventListener('click', function(){
    var v = ov.querySelector('#bcManual').value.trim();
    if(!v){ toast('Type a barcode number first'); return; }
    finish(v);
  });
  ov.querySelector('#bcManual').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); ov.querySelector('#bcManualBtn').click(); }
  });
  if(supportsDetector){
    (async function(){
      try{
        detector = new window.BarcodeDetector({ formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code','itf'] });
      }catch(e){
        var st = ov.querySelector('#bcCamStatus');
        if(st) st.innerHTML = ICONS.warn+'<span>Couldn’t start the scanner. Type the barcode instead.</span>';
        return;
      }
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' } });
      }catch(e){
        var st2 = ov.querySelector('#bcCamStatus');
        if(st2) st2.innerHTML = ICONS.warn+'<span>Camera access was denied. Type the barcode instead.</span>';
        var wrap = ov.querySelector('#bcCamWrap'); if(wrap) wrap.style.display = 'none';
        return;
      }
      var video = ov.querySelector('#bcVideo');
      if(!video || !document.body.contains(video)){ stopCam(); return; }
      video.srcObject = stream;
      detecting = true;
      var loop = async function(){
        if(!detecting) return;
        try{
          var codes = await detector.detect(video);
          if(codes && codes.length){ finish(codes[0].rawValue); return; }
        }catch(e){ /* keep trying */ }
        rafId = requestAnimationFrame(loop);
      };
      loop();
    })();
  }
  var origClose = closeModal;
  // Ensure the camera stops if the sheet is dismissed some other way (overlay tap / back).
  var overlayEl = document.querySelector('.overlay');
  if(overlayEl){
    overlayEl.addEventListener('click', function(e){ if(e.target === overlayEl) stopCam(); });
  }
}

function findProductByBarcode(code){
  code = String(code||'').trim();
  if(!code) return null;
  return State.products.find(function(p){ return p.barcode && String(p.barcode).trim() === code; }) || null;
}

/* ============================== BLUETOOTH THERMAL RECEIPT PRINTING ============================== */
var BLE_PRINTER_SERVICES = ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 0xFFE0, 0xFF00];
var BLE_PRINTER_WRITE_CHARS = ['00002af1-0000-1000-8000-00805f9b34fb', '49535343-8841-43f4-a8d4-ecbe34729bb3', 0xFFE1];
var blePrinterDevice = null, blePrinterChar = null;

function bluetoothSupported(){ return !!(navigator && navigator.bluetooth); }

async function connectBluetoothPrinter(){
  if(!bluetoothSupported()) throw new Error('unsupported');
  var device = await navigator.bluetooth.requestDevice({
    filters: BLE_PRINTER_SERVICES.map(function(s){ return { services:[s] }; }),
    optionalServices: BLE_PRINTER_SERVICES
  });
  var server = await device.gatt.connect();
  var char = null;
  for(var i=0;i<BLE_PRINTER_SERVICES.length && !char; i++){
    try{
      var service = await server.getPrimaryService(BLE_PRINTER_SERVICES[i]);
      var chars = await service.getCharacteristics();
      char = chars.find(function(c){ return c.properties.write || c.properties.writeWithoutResponse; }) || null;
    }catch(e){ /* try next known service uuid */ }
  }
  if(!char) throw new Error('no-writable-characteristic');
  blePrinterDevice = device;
  blePrinterChar = char;
  return { device: device, char: char };
}

function escposReceiptBytes(draft, shopName){
  var lines = [];
  var ESC = '\x1b', GS = '\x1d';
  lines.push(ESC + '@'); // init
  lines.push(ESC + 'a' + '\x01'); // center
  lines.push((shopName || 'Pesa') + '\n');
  lines.push(ESC + 'a' + '\x00'); // left
  lines.push('--------------------------------\n');
  lines.push('Receipt ' + (draft.number||'') + '\n');
  lines.push((draft.dateStr||'') + '\n');
  if(draft.billToName) lines.push('Customer: ' + draft.billToName + '\n');
  lines.push('--------------------------------\n');
  var total = 0;
  (draft.items||[]).forEach(function(it){
    var lineTotal = (it.qty||0) * (it.unitPrice||0);
    total += lineTotal;
    var name = String(it.desc||'').slice(0,20);
    lines.push(name + '\n');
    lines.push('  ' + it.qty + ' x ' + fmtMoney(it.unitPrice) + ' = ' + fmtMoney(lineTotal) + '\n');
  });
  lines.push('--------------------------------\n');
  lines.push('TOTAL: ' + fmtMoney(total) + '\n');
  lines.push('\n');
  lines.push('Thank you!\n');
  lines.push('\n\n\n');
  lines.push(GS + 'V' + '\x42' + '\x00'); // partial cut
  var text = lines.join('');
  var bytes = [];
  for(var i=0;i<text.length;i++) bytes.push(text.charCodeAt(i) & 0xFF);
  return new Uint8Array(bytes);
}

async function writeBleInChunks(char, bytes){
  var chunkSize = 180;
  for(var i=0;i<bytes.length;i+=chunkSize){
    var chunk = bytes.slice(i, i+chunkSize);
    if(char.properties.writeWithoutResponse){ await char.writeValueWithoutResponse(chunk); }
    else { await char.writeValue(chunk); }
  }
}

async function printReceiptViaBluetooth(draft, btn){
  if(!bluetoothSupported()){ toast('Bluetooth printing isn’t supported on this device/browser'); return; }
  var oldLabel = btn ? btn.textContent : '';
  try{
    if(btn){ btn.disabled = true; btn.textContent = 'Connecting…'; }
    if(!blePrinterChar){ await connectBluetoothPrinter(); }
    if(btn) btn.textContent = 'Printing…';
    var bytes = escposReceiptBytes(draft, State.settings.shopName);
    await writeBleInChunks(blePrinterChar, bytes);
    toast('Sent to printer');
  }catch(e){
    if(e && e.name === 'NotFoundError'){ toast('No printer selected'); }
    else toast('Couldn’t print — check the printer is on and paired');
    blePrinterDevice = null; blePrinterChar = null;
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = oldLabel || 'Print via Bluetooth'; }
  }
}

function bluetoothPrintButtonHtml(id){
  var supported = bluetoothSupported();
  return '<button class="btn btn-ghost btn-block" id="'+id+'" type="button" '+(supported?'':'disabled title="Bluetooth printing isn’t supported on this device/browser"')+' style="'+(supported?'':'opacity:.55;')+'">'+ (supported ? 'Print via Bluetooth' : 'Bluetooth printing unavailable') +'</button>';
}

/* ============================== SALES INSIGHTS (dashboard) ============================== */
var _insightsOpen = false;
function computeSalesInsights(sales){
  var byQty = {}, byRev = {}, byDow = [0,0,0,0,0,0,0], byHour = new Array(24).fill(0);
  sales.forEach(function(s){
    var d = new Date(s.createdAt);
    byDow[(d.getDay()+6)%7] += s.total; // Mon=0..Sun=6
    byHour[d.getHours()] += s.total;
    (s.items||[]).forEach(function(it){
      byQty[it.name] = (byQty[it.name]||0) + it.qty;
      byRev[it.name] = (byRev[it.name]||0) + it.lineTotal;
    });
  });
  var toSorted = function(obj, asc){
    return Object.keys(obj).map(function(k){ return {name:k, v:obj[k]}; }).sort(function(a,b){ return asc ? a.v-b.v : b.v-a.v; });
  };
  return {
    bestByQty: toSorted(byQty).slice(0,5),
    bestByRev: toSorted(byRev).slice(0,5),
    worst: toSorted(byQty, true).slice(0,5),
    byDow: byDow,
    byHour: byHour
  };
}
function dashboardInsightsHtml(){
  if(State.sales.length === 0) return '';
  var insights = computeSalesInsights(State.sales);
  var dowLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var dowMax = Math.max.apply(null, insights.byDow.concat([1]));
  var hourMax = Math.max.apply(null, insights.byHour.concat([1]));
  var barList = function(items, fmt){
    if(items.length===0) return '<div style="color:var(--text-muted);font-size:13px;">No data yet.</div>';
    var max = Math.max.apply(null, items.map(function(i){return i.v;}).concat([1]));
    return items.map(function(it){ return '<div class="barrow"><div class="bl">'+esc(it.name)+'</div><div class="btrack"><div class="bfill" style="width:'+(it.v/max*100)+'%"></div></div><div class="bv num">'+fmt(it.v)+'</div></div>'; }).join('');
  };
  var html = '<div class="section-title" id="insightsToggle" style="cursor:pointer;display:flex;align-items:center;gap:6px;">Sales insights <span style="font-weight:400;color:var(--text-muted);text-transform:none;letter-spacing:0;">('+(_insightsOpen?'hide':'show')+')</span></div>';
  if(!_insightsOpen) return html;
  html += '<div class="card pad" style="display:flex;flex-direction:column;gap:14px;">' +
    '<div><div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;">Best sellers by quantity</div>' + barList(insights.bestByQty, function(v){ return v+''; }) + '</div>' +
    '<div><div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;">Best sellers by revenue</div>' + barList(insights.bestByRev, fmtMoney) + '</div>' +
    '<div><div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;">Slowest sellers</div>' + barList(insights.worst, function(v){ return v+''; }) + '</div>' +
    '<div><div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;">Sales by day of week</div>' +
      insights.byDow.map(function(v,i){ return '<div class="barrow"><div class="bl">'+dowLabels[i]+'</div><div class="btrack"><div class="bfill" style="width:'+(v/dowMax*100)+'%"></div></div><div class="bv num">'+fmtMoney(v)+'</div></div>'; }).join('') +
    '</div>' +
    '<div><div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;">Sales by hour of day</div>' +
      '<div style="display:flex;align-items:flex-end;gap:2px;height:70px;">' + insights.byHour.map(function(v){ return '<div style="flex:1;background:var(--primary);opacity:'+(v>0?1:0.12)+';height:'+Math.max(3,(v/hourMax*100))+'%;border-radius:2px 2px 0 0;"></div>'; }).join('') + '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--text-muted);margin-top:3px;"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span></div>' +
    '</div>' +
  '</div>';
  return html;
}

/* ============================== SYNC STATUS ============================== */
function syncStatusHtml(){
  var dot, label;
  if(Store.isCloud()){
    dot = State.online ? 'var(--success)' : 'var(--danger)';
    label = State.online ? 'Synced' : 'Offline';
  } else if(window.claude && window.claude.use){
    // We are on the artifact host but running on the local fallback — either
    // still connecting, or genuinely offline; either way data is queued locally.
    dot = 'var(--warn, #d98e2b)';
    label = State.online ? 'Syncing…' : ('Offline — ' + localPendingCount() + ' pending');
  } else {
    dot = State.online ? 'var(--success)' : 'var(--danger)';
    label = State.online ? 'Online (device only)' : 'Offline (device only)';
  }
  return '<div class="syncbadge" id="syncBadge" title="'+esc(label)+'" style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-muted);">' +
    '<span style="width:7px;height:7px;border-radius:50%;background:'+dot+';flex-shrink:0;"></span><span>'+esc(label)+'</span>' +
  '</div>';
}
function localPendingCount(){
  try{
    var all = JSON.parse(localStorage.getItem('otengu_shop_local_v1')||'{}');
    var n = 0;
    Object.keys(all).forEach(function(k){ n += Object.keys(all[k]||{}).length; });
    return n;
  }catch(e){ return 0; }
}
function updateSyncBadge(){
  var slot = document.getElementById('syncBadgeSlot');
  if(!slot) return;
  slot.innerHTML = syncStatusHtml();
}
window.addEventListener('online', function(){ State.online = true; updateSyncBadge(); attemptCloudReconnect(); });
window.addEventListener('offline', function(){ State.online = false; updateSyncBadge(); });

var _reconnectTried = false;
function attemptCloudReconnect(){
  // Only meaningful inside the Claude artifact host, when we're currently on
  // the local fallback (e.g. the very first window.claude.use('db') attempt
  // failed while offline at cold load). GitHub Pages has no cloud db at all,
  // so there is nothing to reconnect to there — the badge there only ever
  // reflects navigator.onLine, never claims a cloud sync that can't exist.
  if(Store.isCloud() || !(window.claude && window.claude.use) || _reconnectTried) return;
  _reconnectTried = true;
  (async function(){
    try{
      var ns = await window.claude.use('db');
      if(!ns){ _reconnectTried = false; return; }
      State.syncing = true; updateSyncBadge();
      // Push every locally-queued record up into the matching cloud collection,
      // using the same ids so a record already pushed is simply overwritten
      // rather than duplicated.
      var all = JSON.parse(localStorage.getItem('otengu_shop_local_v1')||'{}');
      var paths = Object.keys(all);
      for(var i=0;i<paths.length;i++){
        var path = paths[i];
        if(path.indexOf('/')>-1) continue; // skip nested sub-collections (e.g. ledger) — top-level only for this migration
        var coll = ns.collection(path);
        var ids = Object.keys(all[path]||{});
        for(var j=0;j<ids.length;j++){
          try{ await coll.doc(ids[j]).set(all[path][ids[j]]); }catch(e2){ /* keep going */ }
        }
      }
      toast('Reconnected — your offline sales and changes are now synced to the cloud');
      // Reload so every part of the app re-subscribes cleanly against the
      // now-available cloud database instead of the local fallback.
      setTimeout(function(){ location.reload(); }, 1200);
    }catch(e){
      _reconnectTried = false; // allow a later retry (e.g. next 'online' event)
    }
  })();
}
setInterval(function(){ if(State.online) attemptCloudReconnect(); }, 20000);

function openSuppliersSheet(){
  var html = '<div class="sheet-head"><h2>Suppliers</h2></div>' +
    '<div id="supList"></div>' +
    '<div class="actions"><button class="btn btn-primary btn-block" id="supAddBtn">Add supplier</button></div>';
  var ov = openSheet(html);
  function renderList(){
    var list = ov.querySelector('#supList');
    if(State.suppliers.length === 0){ list.innerHTML = '<div class="empty" style="padding:16px 0;">No suppliers yet</div>'; return; }
    list.innerHTML = '<div class="rowlist">' + State.suppliers.map(function(s){
      return '<div class="row" data-sup="'+s.id+'"><div class="avatar">'+esc(initials(s.name))+'</div>' +
        '<div class="main"><div class="title">'+esc(s.name)+'</div><div class="sub">'+esc(s.phone||s.contact||'No contact on file')+'</div></div></div>';
    }).join('') + '</div>';
    list.querySelectorAll('[data-sup]').forEach(function(row){
      row.addEventListener('click', function(){
        var s = State.suppliers.find(function(x){ return x.id===row.getAttribute('data-sup'); });
        if(s) openSupplierFormSheet(s, openSuppliersSheet);
      });
    });
  }
  renderList();
  ov.querySelector('#supAddBtn').addEventListener('click', function(){ openSupplierFormSheet(null, openSuppliersSheet); });
}
function openSupplierFormSheet(supplier, onDone){
  var isEdit = !!supplier;
  var html = '<div class="sheet-head"><h2>'+(isEdit?'Edit supplier':'Add supplier')+'</h2></div>' +
    '<div class="field"><label>Name</label><input id="supName" value="'+esc(supplier?supplier.name:'')+'"></div>' +
    '<div class="field"><label>Contact person (optional)</label><input id="supContact" value="'+esc(supplier?supplier.contact||'':'')+'"></div>' +
    '<div class="field"><label>Phone (optional)</label><input id="supPhone" value="'+esc(supplier?supplier.phone||'':'')+'"></div>' +
    '<div class="field"><label>Notes (optional)</label><textarea id="supNotes" rows="2">'+esc(supplier?supplier.notes||'':'')+'</textarea></div>' +
    '<div class="actions">' + (isEdit?'<button class="btn btn-danger" id="supDelete">Delete</button>':'') +
      '<button class="btn btn-primary btn-block" id="supSave">'+(isEdit?'Save changes':'Add supplier')+'</button></div>';
  var ov = openSheet(html, {center:true});
  ov.querySelector('#supSave').addEventListener('click', function(){
    var name = ov.querySelector('#supName').value.trim();
    if(!name){ toast('Enter a supplier name'); return; }
    var data = { name:name, contact: ov.querySelector('#supContact').value.trim(), phone: ov.querySelector('#supPhone').value.trim(), notes: ov.querySelector('#supNotes').value.trim() };
    if(isEdit){ refs.suppliers.doc(supplier.id).update(data); logAudit('update','supplier',supplier.id,'Edited '+name); toast('Supplier updated'); }
    else { data.createdAt = new Date().toISOString(); refs.suppliers.doc().set(data); logAudit('create','supplier',null,'Added supplier '+name); toast('Supplier added'); }
    closeModal();
    if(onDone) setTimeout(onDone, 50);
  });
  if(isEdit){
    ov.querySelector('#supDelete').addEventListener('click', function(){
      confirmSheet('Delete '+supplier.name+'?', 'This does not affect past purchase orders.', 'Delete', function(){
        refs.suppliers.doc(supplier.id).delete();
        logAudit('delete','supplier',supplier.id,'Deleted supplier '+supplier.name);
        toast('Supplier deleted');
        if(onDone) setTimeout(onDone, 50);
      }, true);
    });
  }
}

function openPOFormSheet(onDone){

  var supOpts = State.suppliers.map(function(s){ return '<option value="'+s.id+'">'+esc(s.name)+'</option>'; }).join('');
  var prodOpts = '<option value="">Choose a product…</option>' + State.products.map(function(p){ return '<option value="'+p.id+'">'+esc(p.name)+'</option>'; }).join('');
  var html = '<div class="sheet-head"><h2>New purchase order</h2></div>' +
    '<div class="field"><label>Supplier</label><select id="poSupplier">'+supOpts+'</select></div>' +
    '<div class="field"><label>Add product</label><select id="poProdSelect">'+prodOpts+'</select></div>' +
    '<div class="field-row"><div class="field"><label>Quantity</label><input id="poQty" type="number" inputmode="numeric" placeholder="1"></div><div class="field"><label>Cost each</label><input id="poCost" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div></div>' +
    '<button class="btn btn-ghost btn-block" id="poAddLineBtn" type="button" style="margin-bottom:10px;">Add line item</button>' +
    '<div id="poLines"></div>' +
    '<div class="actions"><button class="btn btn-primary btn-block" id="poSaveBtn">Save as draft</button></div>';
  var ov = openSheet(html);
  function renderLines(){
    var el = ov.querySelector('#poLines');
    if(draft.items.length===0){ el.innerHTML = '<div style="color:var(--text-muted);font-size:13px;margin-bottom:10px;">No line items yet.</div>'; return; }
    el.innerHTML = draft.items.map(function(it,i){
      return '<div class="cartitem"><div style="flex:1;"><div class="ci-name">'+esc(it.name)+'</div><div class="ci-price num">'+it.qty+' x '+fmtMoney(it.cost)+'</div></div><div class="ci-line num">'+fmtMoney(it.qty*it.cost)+'</div><button class="bulk-del" data-rmline="'+i+'" type="button">×</button></div>';
    }).join('');
    el.querySelectorAll('[data-rmline]').forEach(function(b){
      b.addEventListener('click', function(){ draft.items.splice(parseInt(b.getAttribute('data-rmline'),10),1); renderLines(); });
    });
  }
  renderLines();
  ov.querySelector('#poAddLineBtn').addEventListener('click', function(){
    var pid = ov.querySelector('#poProdSelect').value;
    var p = State.products.find(function(x){ return x.id===pid; });
    if(!p){ toast('Choose a product'); return; }
    var qty = parseInt(ov.querySelector('#poQty').value,10) || 0;
    var cost = parseFloat(ov.querySelector('#poCost').value);
    if(isNaN(cost)) cost = p.costPrice||0;
    if(qty<=0){ toast('Enter a quantity'); return; }
    draft.items.push({ productId:p.id, name:p.name, qty:qty, cost:cost });
    ov.querySelector('#poQty').value=''; ov.querySelector('#poCost').value='';
    renderLines();

  ov.querySelector('#poSaveBtn').addEventListener('click', function(){

  var html = '<div class="sheet-head"><h2>Purchase order</h2></div>' +
    '<div class="banner">Supplier: <strong>'+esc(sup?sup.name:'Unknown')+'</strong> · Status: <strong style="text-transform:capitalize;">'+esc(po.status)+'</strong></div>' +
    '<div class="rowlist">' + (po.items||[]).map(function(it){
      return '<div class="row" style="cursor:default;"><div class="main"><div class="title">'+esc(it.name)+'</div><div class="sub">'+it.qty+' x '+fmtMoney(it.cost)+'</div></div><div class="trail"><div class="amt num">'+fmtMoney(it.qty*it.cost)+'</div></div></div>';
    }).join('') + '</div>' +
    '<div class="sumline total" style="margin-top:8px;"><span>Total</span><span class="num">'+fmtMoney(total)+'</span></div>' +
    '<div class="actions">' +
      (po.status==='draft' ? '<button class="btn btn-ghost btn-block" id="poMarkOrderedBtn">Mark as ordered</button>' : '') +

    logAudit('update','purchaseOrder',po.id,'Marked as ordered');
    toast('Marked as ordered');
    closeModal();
    if(onDone) setTimeout(onDone, 50);
  });
  var markReceived = ov.querySelector('#poMarkReceivedBtn');
  if(markReceived) markReceived.addEventListener('click', function(){

var WASTAGE_REASONS = ['spoilage','theft','damage','other'];
function openWastageSheet(){
  var html = '<div class="sheet-head"><h2>Wastage &amp; shrinkage</h2></div>' +
    '<div class="actions"><button class="btn btn-primary btn-block" id="wasteAddBtn">Record wastage</button></div>' +
    '<div id="wasteList"></div>';
  var ov = openSheet(html);
  function renderList(){
    var list = ov.querySelector('#wasteList');
    if(State.wastage.length===0){ list.innerHTML = '<div class="empty" style="padding:16px 0;">No wastage recorded yet</div>'; return; }
    var totalValue = State.wastage.reduce(function(s,w){
      var p = State.products.find(function(x){ return x.id===w.productId; });
      return s + (w.qty||0) * (p?p.costPrice||0:0);
    },0);
    list.innerHTML = '<div class="banner">Total recorded loss (at cost): <strong class="num">'+fmtMoney(totalValue)+'</strong></div><div class="rowlist">' + State.wastage.map(function(w){
      return '<div class="row" style="cursor:default;"><div class="avatar">'+ICONS.warn+'</div><div class="main"><div class="title">'+esc(w.productName)+'</div><div class="sub">'+esc(w.reason)+' · '+fmtDateTime(w.createdAt)+(w.recordedBy?' · '+esc(w.recordedBy):'')+'</div></div><div class="trail"><div class="amt num">-'+w.qty+'</div></div></div>';
    }).join('') + '</div>';
  }
  renderList();
  ov.querySelector('#wasteAddBtn').addEventListener('click', function(){ openRecordWastageSheet(openWastageSheet); });
}
function openRecordWastageSheet(onDone){
  var prodOpts = '<option value="">Choose a product…</option>' + State.products.map(function(p){ return '<option value="'+p.id+'">'+esc(p.name)+' ('+(p.stockQty!=null?p.stockQty:'—')+' in stock)</option>'; }).join('');
  var reasonOpts = WASTAGE_REASONS.map(function(r){ return '<option value="'+r+'">'+r.charAt(0).toUpperCase()+r.slice(1)+'</option>'; }).join('');
  var html = '<div class="sheet-head"><h2>Record wastage</h2></div>' +
    '<div class="field"><label>Product</label><select id="wProd">'+prodOpts+'</select></div>' +
    '<div class="field"><label>Quantity lost</label><input id="wQty" type="number" inputmode="numeric" placeholder="1"></div>' +
    '<div class="field"><label>Reason</label><select id="wReason">'+reasonOpts+'</select></div>' +
    '<div class="field"><label>Notes (optional)</label><textarea id="wNotes" rows="2"></textarea></div>' +
    '<div class="actions"><button class="btn btn-primary btn-block" id="wSaveBtn">Record wastage</button></div>';
  var ov = openSheet(html, {center:true});
  ov.querySelector('#wSaveBtn').addEventListener('click', function(){
    var pid = ov.querySelector('#wProd').value;
    var p = State.products.find(function(x){ return x.id===pid; });
    if(!p){ toast('Choose a product'); return; }
    var qty = parseInt(ov.querySelector('#wQty').value,10) || 0;
    if(qty<=0){ toast('Enter a quantity greater than 0'); return; }
    var reason = ov.querySelector('#wReason').value;
    var notes = ov.querySelector('#wNotes').value.trim();
    refs.products.doc(p.id).update({ stockQty: Math.max(0, (p.stockQty||0) - qty) });
    refs.wastage.doc().set({
      productId:p.id, productName:p.name, qty:qty, reason:reason, notes:notes,
      recordedBy: State.session?State.session.name:'', createdAt:new Date().toISOString()
    }).then(function(ref){ logAudit('create','wastage', ref&&ref.id, qty+' x '+p.name+' ('+reason+')'); });
    toast('Wastage recorded and stock adjusted');
    closeModal();
    if(onDone) setTimeout(onDone, 50);
  });
}

/* ============================== NAMRA VAT SUMMARY ============================== */
function openVatSummarySheet(){
  var rate = (State.settings.vatRate!=null) ? State.settings.vatRate : 15;
  var now = new Date();
  var defFrom = todayKey(new Date(now.getFullYear(), now.getMonth(), 1));
  var defTo = todayKey(now);
  var html = '<div class="sheet-head"><h2>NamRA VAT summary</h2></div>' +
    '<div class="banner">Uses your company’s VAT number (from Company details) and the VAT rate below, applied to sales and expenses as VAT-inclusive amounts.</div>' +
    '<div class="field"><label>VAT rate (%)</label><input id="vatRate" type="number" inputmode="decimal" step="0.1" value="'+rate+'"></div>' +
    '<div class="field-row"><div class="field"><label>From</label><input id="vatFrom" type="date" value="'+defFrom+'"></div><div class="field"><label>To</label><input id="vatTo" type="date" value="'+defTo+'"></div></div>' +
    '<div id="vatResult"></div>' +
    '<div class="actions"><button class="btn btn-accent btn-block" id="vatDownloadBtn">Download VAT summary (PDF)</button></div>';
  var ov = openSheet(html);
  function compute(){
    var r = parseFloat(ov.querySelector('#vatRate').value) || 0;
    var from = ov.querySelector('#vatFrom').value, to = ov.querySelector('#vatTo').value;
    var fromD = from ? new Date(from+'T00:00:00') : new Date(0);
    var toD = to ? new Date(to+'T23:59:59') : new Date();
    var sales = State.sales.filter(function(s){ var d=new Date(s.createdAt); return d>=fromD && d<=toD; });
    var expenses = State.expenses.filter(function(e){ var d=new Date(e.createdAt); return d>=fromD && d<=toD; });
    var salesTotal = sales.reduce(function(s,x){ return s+x.total; },0);
    var expTotal = expenses.reduce(function(s,x){ return s+x.amount; },0);
    var outputVat = salesTotal * r / (100+r);
    var inputVat = expTotal * r / (100+r);
    var net = outputVat - inputVat;
    return { r:r, from:from, to:to, salesTotal:salesTotal, expTotal:expTotal, outputVat:outputVat, inputVat:inputVat, net:net };
  }
  function renderResult(){
    var c = compute();
    ov.querySelector('#vatResult').innerHTML =
      '<div class="tillcard">' +
      '<div class="tillrow"><span class="l">Total sales (incl. VAT)</span><span class="v num">'+fmtMoney(c.salesTotal)+'</span></div>' +
      '<div class="tillrow"><span class="l">Output VAT</span><span class="v num">'+fmtMoney(c.outputVat)+'</span></div>' +
      '<div class="tillrow"><span class="l">Total expenses (incl. VAT)</span><span class="v num">'+fmtMoney(c.expTotal)+'</span></div>' +
      '<div class="tillrow"><span class="l">Input VAT</span><span class="v num">'+fmtMoney(c.inputVat)+'</span></div>' +
      '<div class="tillrow grand"><span class="l">Net VAT '+(c.net>=0?'payable':'refundable')+'</span><span class="v num">'+fmtMoney(Math.abs(c.net))+'</span></div>' +
      '</div>';
  }
  renderResult();
  ov.querySelector('#vatRate').addEventListener('input', renderResult);
  ov.querySelector('#vatFrom').addEventListener('change', renderResult);
  ov.querySelector('#vatTo').addEventListener('change', renderResult);
  ov.querySelector('#vatDownloadBtn').addEventListener('click', async function(){
    var c = compute();
    State.settings = Object.assign({}, State.settings, { vatRate: c.r });
    refs.settings.set(State.settings);
    var btn = ov.querySelector('#vatDownloadBtn');
    btn.disabled = true; var old = btn.textContent; btn.textContent = 'Preparing…';
    var ready = await ensureJsPDF();
    if(!ready){ btn.disabled=false; btn.textContent=old; toast('Couldn’t load the PDF engine — check your connection and try again'); return; }
    var JsPDFCtor = getJsPDF();
    // mm units (not pt) so this can share drawDocHeader() with the
    // invoice/receipt/report PDFs — that's what puts the shop's logo (or
    // the default Pesa mark) at the top of this document too.
    var doc = new JsPDFCtor({ unit:'mm', format:'a4' });
    var head = drawDocHeader(doc);
    var margin = head.margin, contentW = head.contentW, pageW = head.pageW, y = head.y;
    var t = head.t, primary=t.primary, muted=t.muted, dark=t.dark;

    doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(primary[0],primary[1],primary[2]);
    doc.text(State.settings.shopName || 'Pesa', margin, y+6);
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(muted[0],muted[1],muted[2]);
    doc.text('NamRA VAT summary', margin, y+12);
    doc.text('Generated '+fmtDateNice(new Date()), pageW-margin, y+6, {align:'right'});
    y += 20;
    doc.setDrawColor(220,224,218); doc.line(margin,y,pageW-margin,y); y+=9;

    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(dark[0],dark[1],dark[2]);
    if(State.company && State.company.vatNumber){ doc.text('VAT number: '+State.company.vatNumber, margin, y); y += 6; }
    doc.text('Period: '+(c.from||'—')+' to '+(c.to||'—'), margin, y); y += 6;
    doc.text('VAT rate: '+c.r+'%', margin, y); y += 10;

    var rows = [
      ['Total sales (incl. VAT)', fmtMoney(c.salesTotal)],
      ['Output VAT', fmtMoney(c.outputVat)],
      ['Total expenses (incl. VAT)', fmtMoney(c.expTotal)],
      ['Input VAT', fmtMoney(c.inputVat)],
      ['Net VAT ' + (c.net>=0?'payable':'refundable'), fmtMoney(Math.abs(c.net))]
    ];
    rows.forEach(function(r, i){
      var last = i===rows.length-1;
      if(last){ doc.setDrawColor(220,224,218); doc.line(margin,y-4,pageW-margin,y-4); y += 2; }
      pdfSummaryLine(doc, margin, y, contentW, r[0], r[1], {bold:last, size: last?12:10});
      y += last ? 9 : 6.5;
    });
    y += 8;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(muted[0],muted[1],muted[2]);
    var vatNoteLines = doc.splitTextToSize('This is a working summary generated from your recorded sales and expenses. Please confirm figures and filing requirements with NamRA.', contentW);
    doc.text(vatNoteLines, margin, y);
    saveGeneratedPdf(doc, 'namra-vat-summary-'+(c.from||'')+'_to_'+(c.to||'')+'.pdf').then(function(ok){
      btn.disabled=false; btn.textContent=old;
      if(ok) toast('VAT summary downloaded');
    });
  });
}

var _trainState = { lessonId:null, idx:0, playing:false, autoTimer:null };

function speechSupported(){
  return typeof window!=='undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
}

function stopNarration(){
  _trainState.playing = false;
  if(_trainState.autoTimer){ clearTimeout(_trainState.autoTimer); _trainState.autoTimer = null; }
  try{ if(speechSupported()) window.speechSynthesis.cancel(); }catch(e){}
}

function openTrainingSheet(){

      return '<div class="row" data-lesson="'+l.id+'"><div class="ico" style="width:40px;height:40px;border-radius:11px;background:var(--surface-2);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+ICONS[l.icon]+'</div>' +

function openLessonSlideshow(lessonId){

  if(!lesson) return;
  stopNarration();
  _trainState.lessonId = lessonId;
  _trainState.idx = 0;
  var supported = speechSupported();

  function renderSlide(){
    var ov = document.querySelector('#modalRoot .sheet');
    if(!ov) return;
    var i = _trainState.idx, n = lesson.slides.length, slide = lesson.slides[i];
    var pct = Math.round(((i+1)/n)*100);
    var muted = !(State.settings.soundEnabled!==false);
    ov.querySelector('#lsBody').innerHTML =
      '<div class="lesson-progress">'+tr('Slide')+' '+(i+1)+' '+tr('of')+' '+n+'</div>' +

      '<div class="lesson-slide"><div class="ico">'+ICONS[lesson.icon]+'</div>' +
        '<h3>'+esc(tr(slide.title))+'</h3>' +
        '<p>'+esc(tr(slide.text))+'</p>' +
      '</div>' +
      (supported ?
        '<div class="lesson-controls">' +
          '<button class="icon-btn" id="lsPrev" type="button" aria-label="Previous" '+(i===0?'disabled style="opacity:.4;"':'')+'>'+ICONS.back+'</button>' +
          '<button class="icon-btn" id="lsMute" type="button" aria-label="Mute">'+(muted?ICONS.soundOff:ICONS.soundOn)+'</button>' +
          '<button class="btn btn-primary navbig" id="lsPlay" type="button">'+(_trainState.playing?tr('Pause'):tr('Play'))+'</button>' +
          '<button class="icon-btn" id="lsNext" type="button" aria-label="Next" '+(i===n-1?'disabled style="opacity:.4;"':'')+'><span style="display:inline-block;transform:rotate(180deg);">'+ICONS.back+'</span></button>' +
        '</div>'
        :
        '<div class="lesson-controls">' +
          '<button class="btn btn-ghost navbig" id="lsPrev" type="button" '+(i===0?'disabled':'')+'>'+tr('Previous')+'</button>' +
          '<button class="btn btn-primary navbig" id="lsNext" type="button" '+(i===n-1?'disabled':'')+'>'+tr('Next')+'</button>' +
        '</div>'
      );
    wireSlideButtons();
    if(supported && State.settings.soundEnabled!==false){ startNarration(); } else { _trainState.playing=false; }
  }

  function goTo(newIdx){
    stopNarration();
    _trainState.idx = Math.max(0, Math.min(lesson.slides.length-1, newIdx));
    renderSlide();
  }

  function startNarration(){
    if(!supported || State.settings.soundEnabled===false) return;
    try{ window.speechSynthesis.cancel(); }catch(e){}
    var slide = lesson.slides[_trainState.idx];
    var u = new SpeechSynthesisUtterance(slide.title + '. ' + slide.text);
    u.rate = 0.95;
    u.onend = function(){
      _trainState.playing = false;
      var btn = document.getElementById('lsPlay');
      if(btn) btn.textContent = tr('Play');
      // Auto-advance to the next slide once narration finishes, after a
      // short, natural pause — but only if the user hasn't navigated away.
      if(_trainState.idx < lesson.slides.length-1){
        _trainState.autoTimer = setTimeout(function(){ goTo(_trainState.idx+1); }, 900);
      }
    };
    u.onerror = function(){ _trainState.playing = false; };
    _trainState.playing = true;
    try{ window.speechSynthesis.speak(u); }catch(e){ _trainState.playing = false; }
  }

  function togglePlay(){
    if(!supported) return;
    if(_trainState.playing){
      try{ window.speechSynthesis.pause(); }catch(e){}
      _trainState.playing = false;
      if(_trainState.autoTimer){ clearTimeout(_trainState.autoTimer); _trainState.autoTimer = null; }
    } else {
      try{
        if(window.speechSynthesis.paused){ window.speechSynthesis.resume(); _trainState.playing = true; }
        else { startNarration(); }
      }catch(e){ startNarration(); }
    }
    var btn = document.getElementById('lsPlay');
    if(btn) btn.textContent = _trainState.playing ? tr('Pause') : tr('Play');
  }

  function toggleMute(){
    var next = (State.settings.soundEnabled===false); // currently muted -> unmute, and vice versa
    State.settings = Object.assign({}, State.settings, { soundEnabled: next });
    refs.settings.set(State.settings);
    if(!next){ stopNarration(); } else { startNarration(); }
    renderSlide();
  }

  function wireSlideButtons(){
    var ov = document.querySelector('#modalRoot .sheet');
    if(!ov) return;
    var prev = ov.querySelector('#lsPrev'); if(prev) prev.addEventListener('click', function(){ if(_trainState.idx>0) goTo(_trainState.idx-1); });
    var next = ov.querySelector('#lsNext'); if(next) next.addEventListener('click', function(){ if(_trainState.idx<lesson.slides.length-1) goTo(_trainState.idx+1); });
    var play = ov.querySelector('#lsPlay'); if(play) play.addEventListener('click', togglePlay);
    var mute = ov.querySelector('#lsMute'); if(mute) mute.addEventListener('click', toggleMute);
  }

  var html = '<div class="sheet-head"><button class="drawer-close" id="lsBack" type="button" aria-label="Back">'+ICONS.back+'</button><h2 style="flex:1;">'+esc(tr(lesson.title))+'</h2></div>' +
    '<div id="lsBody"></div>';
  var ov = openSheet(html);
  ov.querySelector('#lsBack').addEventListener('click', function(){ stopNarration(); closeModal(); openTrainingSheet(); });
  renderSlide();
}

// Draws a "wet ink" style rubber stamp graphic (double ring border, the
// PESA name, the word CERTIFIED and the real current date) using jsPDF's
// own vector drawing primitives, so it regenerates fresh every time rather
// than being a fixed embedded picture. It is tilted a few degrees off
// straight and drawn with a translucent stamp red ink color, the way a
// genuine hand pressed rubber stamp looks on paper. Every string drawn
// here contains zero hyphen or dash characters, matching the rest of this
// document.
function drawWetStamp(doc, pageW, pageH){
  var cx = pageW - 40, cy = pageH - 44, tilt = 11; // degrees, hand stamped tilt
  var rad = tilt * Math.PI/180, cos = Math.cos(rad), sin = Math.sin(rad);
  function rot(dx,dy){ return { x: cx + dx*cos - dy*sin, y: cy + dx*sin + dy*cos }; }

  var inkRed = [178,34,52];
  var gStateOk = true;
  try{
    doc.saveGraphicsState();
    doc.setGState(new doc.GState({opacity:0.55}));
  }catch(e){ gStateOk = false; }
  // If the opacity API is not available in this jsPDF build, fall back to
  // a lighter tint of the same stamp red so the worn ink look still reads.
  var ink = gStateOk ? inkRed : [214,150,160];

  doc.setDrawColor(ink[0],ink[1],ink[2]);
  doc.setTextColor(ink[0],ink[1],ink[2]);

  doc.setLineWidth(1.1);
  doc.circle(cx, cy, 21, 'S');
  doc.setLineWidth(0.5);
  doc.circle(cx, cy, 17.5, 'S');

  doc.setFont('helvetica','bold'); doc.setFontSize(7.2);
  var top = rot(0,-10.5);
  doc.text('CERTIFIED', top.x, top.y, {align:'center', angle: tilt});

  doc.setFont('helvetica','bold'); doc.setFontSize(17);
  var mid = rot(0,2);
  doc.text('PESA', mid.x, mid.y, {align:'center', angle: tilt});

  doc.setFont('helvetica','normal'); doc.setFontSize(6.6);
  var bottom = rot(0,11.5);
  doc.text(fmtDateNice(new Date()), bottom.x, bottom.y, {align:'center', angle: tilt});

  if(gStateOk){
    try{ doc.setGState(new doc.GState({opacity:1})); }catch(e){}
    try{ doc.restoreGraphicsState(); }catch(e){}
  }
}

// Builds the "About Pesa" PDF, sharing drawDocHeader() so it carries the
// same logo and layout conventions as every other Pesa document. The text
// content contains no hyphen or dash character, same as the in app page.
function generateAboutPdf(){
  var JsPDFCtor = getJsPDF();
  var doc = new JsPDFCtor({ unit:'mm', format:'a4' });
  var head = drawDocHeader(doc);
  var margin = head.margin, contentW = head.contentW, pageW = head.pageW, y = head.y;
  var t = head.t, primary=t.primary, muted=t.muted, dark=t.dark;

  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(primary[0],primary[1],primary[2]);
  doc.text('About Pesa', margin, y+6);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(muted[0],muted[1],muted[2]);
  doc.text('Generated '+fmtDateNice(new Date()), pageW-margin, y+6, {align:'right'});
  y += 16;
  doc.setDrawColor(220,224,218); doc.line(margin,y,pageW-margin,y); y += 9;

  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(dark[0],dark[1],dark[2]);
  ABOUT_PARAGRAPHS.forEach(function(p){
    var lines = doc.splitTextToSize(p, contentW);
    if(y + lines.length*5.2 > 280){ doc.addPage(); y = 20; }
    doc.text(lines, margin, y);
    y += lines.length*5.2 + 4;
  });

  doc.setFontSize(9.5);
  ABOUT_FEATURES.forEach(function(f){
    var lines = doc.splitTextToSize(f, contentW-6);
    if(y + lines.length*4.8 > 280){ doc.addPage(); y = 20; }
    doc.setTextColor(primary[0],primary[1],primary[2]);
    doc.text('•', margin, y);
    doc.setTextColor(dark[0],dark[1],dark[2]);
    doc.text(lines, margin+5, y);
    y += lines.length*4.8 + 2.5;
  });

  y += 6;
  if(y > 265){ doc.addPage(); y = 20; }
  doc.setDrawColor(220,224,218); doc.line(margin,y,pageW-margin,y); y += 8;
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(dark[0],dark[1],dark[2]);
  doc.text(DEV_CREDIT_LINE, margin, y); y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(muted[0],muted[1],muted[2]);
  var crLines = doc.splitTextToSize(copyrightLine(), contentW);
  doc.text(crLines, margin, y);
  y += crLines.length*4;

  // The stamp graphic needs a clear block of space near the bottom right
  // corner of the page. If the credit and copyright text already runs
  // close to the bottom, give the stamp a fresh page instead of letting
  // it crowd or overlap that text.
  var pageH = doc.internal.pageSize.getHeight();
  if(y > pageH-70){ doc.addPage(); }
  drawWetStamp(doc, pageW, pageH);

  return doc;
}
