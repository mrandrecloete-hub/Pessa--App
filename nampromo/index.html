<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NamPromo</title>
<meta name="description" content="Find specials and compare shop prices across Namibia.">
<meta name="theme-color" content="#0F5E4D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F5E4D'/%3E%3Cpath d='M16 34l16-16h14v14L30 48z' fill='%23F4B63F'/%3E%3Ccircle cx='40' cy='24' r='4' fill='%230F5E4D'/%3E%3C/svg%3E">
<style>
:root{--bg:#F5F8F6;--card:#fff;--ink:#0A261C;--muted:#4A5F57;--line:#D5E0DA;--brand:#0B6E42;--brand-ink:#fff;--accent:#F7C531;--good:#0B6E42;--bad:#B3261E;--chip:#E4F1EA;--warn:#FFF4D6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1613;--card:#15211D;--ink:#F1F7F4;--muted:#B2C4BC;--line:#2A3C34;--brand:#37B880;--brand-ink:#04180F;--chip:#1E3029;--warn:#3A3115;--good:#5FD6A4;--bad:#FF8A80}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.hin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo svg{width:34px;height:34px;flex:none}
.logo b{font-size:21px;white-space:nowrap;color:var(--brand);letter-spacing:-.3px}
.logo b span{color:var(--ink)}
.town select{font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--chip);border:0;border-radius:12px;padding:8px 10px;max-width:132px}
#bell{position:relative;width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center}
#bell svg{width:24px;height:24px}
#bell i{position:absolute;top:-4px;right:-4px;background:#D92D20;color:#fff;font:700 13px/1 system-ui;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 5px;font-style:normal}
#bell i[hidden]{display:none}
main{max-width:760px;margin:0 auto;padding:14px 16px}
.demo{background:var(--warn);border-radius:12px;padding:8px 12px;font-size:15px;margin-bottom:14px}
h1,h2{font-size:28px;line-height:1.2;margin:4px 0 6px;color:var(--ink)}
h3{font-size:22px;margin:0 0 6px}
.sub{color:var(--muted);font-size:18px;margin:0 0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;font-size:18px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;min-height:54px}
label{display:block;font-size:17px;font-weight:600;margin:14px 0 6px}
input[type=checkbox]{width:26px;height:26px;min-height:0;flex:none}
button{font:inherit;cursor:pointer}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:18px;min-height:54px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn.small{padding:10px 14px;font-size:17px;min-height:46px}
.btn.block{display:flex;width:100%}
.price{font-weight:800;font-size:26px}
.was{color:var(--muted);text-decoration:line-through;font-size:17px;margin-left:8px;font-weight:400}
.badge{display:inline-block;background:var(--accent);color:#2a1d00;border-radius:8px;padding:3px 10px;font-size:16px;font-weight:800}
.badge.good{background:var(--good);color:#fff}
.tag{display:inline-block;background:var(--chip);border-radius:8px;padding:3px 10px;font-size:15px;color:var(--ink)}
.muted{color:var(--muted);font-size:16px}
.best{border:3px solid var(--good)}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:18px}
.li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--line)}
.li:last-child{border:0}
.x{background:none;border:0;color:var(--muted);font-size:28px;padding:4px 10px;min-height:44px}
.alert-hit{border-left:8px solid var(--good)}
.search{position:relative;margin:0 0 16px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:24px;height:24px;color:var(--muted)}
.search input{padding-left:48px;border-radius:999px;font-size:19px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 20px}
.cat{background:var(--card);border:2px solid var(--line);border-radius:18px;color:var(--ink);font-size:18px;font-weight:700;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:104px;line-height:1.2;text-align:center}
.cat i{font-style:normal;font-size:38px;line-height:1}
.sec{margin:22px 0 10px}
.dcard{position:relative;display:flex;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:0 0 14px;cursor:pointer}
.dtile{flex:none;width:84px;height:84px;border-radius:16px;display:grid;place-items:center;font-size:46px}
.dmain{flex:1;min-width:0;padding-right:36px}
.dname{font-size:21px;font-weight:800;line-height:1.2}
.dshop{font-size:16px;color:var(--muted);margin:2px 0 4px}
.dprice{font-size:27px;font-weight:800;color:var(--good)}
.dsave{display:inline-block;background:var(--good);color:#fff;border-radius:8px;padding:2px 10px;font-size:16px;font-weight:800;margin-top:2px}
.heart{position:absolute;right:8px;top:6px;background:none;border:0;font-size:32px;color:var(--muted);line-height:1;padding:6px;min-height:48px;min-width:48px}
.heart.on{color:#D92D20}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav div{max-width:760px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:6px 2px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
nav button svg{width:28px;height:28px}
nav button.on{color:var(--brand);font-weight:800}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.stack{display:grid;gap:10px;margin-top:14px}
details summary{font-size:18px;font-weight:700;cursor:pointer;padding:6px 0}
</style>
</head>
<body>
<header><div class="hin">
<div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="6" width="52" height="52" rx="14" fill="#0F7B4B"/><path d="M16 35l17-17h14v14L30 49z" fill="#F7C531"/><circle cx="41" cy="23" r="4" fill="#0F7B4B"/></svg><div><b>Nam<span>Promo</span></b></div></div>
<label class="town" style="margin:0;font-weight:400"><select id="town" aria-label="Your town"></select></label>
<button id="bell" aria-label="Price alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/></svg><i id="belln" hidden></i></button>
</div></header>
<main id="app"></main>
<nav><div id="nav"></div></nav>
<script src="nampromo.js"></script>
</body>
</html>
