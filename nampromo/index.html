<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NamPromo</title>
<meta name="description" content="Find specials and compare shop prices across Namibia.">
<meta name="theme-color" content="#0F5E4D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F5E4D'/%3E%3Cpath d='M16 34l16-16h14v14L30 48z' fill='%23F4B63F'/%3E%3Ccircle cx='40' cy='24' r='4' fill='%230F5E4D'/%3E%3C/svg%3E">
<style>
:root{--bg:#F4F8F6;--card:#fff;--ink:#0B2E24;--muted:#5C6F68;--line:#E1EAE6;--brand:#0F7B4B;--brand-ink:#fff;--deep:#0B4F37;--accent:#F7C531;--good:#0F7B4B;--bad:#B3261E;--chip:#E6F3EC;--warn:#FFF4D6;--shadow:0 2px 10px rgba(11,46,36,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1613;--card:#15211D;--ink:#EAF3EF;--muted:#9DB2AA;--line:#25362F;--brand:#2FB27B;--brand-ink:#04180F;--deep:#0B3B2B;--chip:#1C2E27;--warn:#3A3115;--good:#4CC9A0;--bad:#FF8A80;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.hin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo svg{width:38px;height:38px;flex:none}
.logo b{display:block;font-size:22px;line-height:1.05;color:var(--deep);letter-spacing:-.3px}
@media (prefers-color-scheme:dark){.logo b{color:var(--ink)}}
.logo b span{color:var(--brand)}
.logo small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.town{display:flex;align-items:center;gap:4px;color:var(--brand)}
.town svg{width:20px;height:20px;flex:none}
.town select{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:none;border:0;padding:4px 0;max-width:120px}
#bell{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow)}
#bell svg{width:22px;height:22px}
#bell i{position:absolute;top:-3px;right:-3px;background:#E5484D;color:#fff;font:700 11px/1 system-ui;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;font-style:normal}
#bell i[hidden]{display:none}
@media (max-width:440px){.logo small{display:none}.logo b{font-size:20px}.town select{max-width:96px}}
main{max-width:1100px;margin:0 auto;padding:12px 16px}
.demo{background:var(--warn);border:1px solid var(--accent);border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
h2{font-size:21px;margin:6px 0 4px;color:var(--deep)}
@media (prefers-color-scheme:dark){h2{color:var(--ink)}}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
button{font:inherit;cursor:pointer}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:14px;padding:10px 14px;font-weight:650}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn.small{padding:7px 11px;font-size:14px}
.btn.block{width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.price{font-weight:750;font-size:20px}
.price.sm{font-size:18px;color:var(--good)}
.was{color:var(--muted);text-decoration:line-through;font-size:13px;margin-left:6px;font-weight:400}
.badge{display:inline-block;background:var(--accent);color:#2a1d00;border-radius:8px;padding:2px 8px;font-size:12.5px;font-weight:700}
.badge.good{background:var(--good);color:#fff}
.tag{display:inline-block;background:var(--chip);border-radius:8px;padding:2px 8px;font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted);font-size:13.5px}
.best{border:2px solid var(--good)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.x{background:none;border:0;color:var(--muted);font-size:20px;padding:4px 8px}
.alert-hit{border-left:5px solid var(--good)}
/* home */
.search{position:relative;margin:4px 0 14px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted)}
.search input{padding:14px 14px 14px 44px;border-radius:999px;box-shadow:var(--shadow);font-size:16px}
.cats{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.cat{flex:none;width:76px;background:none;border:0;color:var(--ink);font-size:13px;text-align:center;padding:0}
.cat i{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;margin:0 auto 6px;font-size:28px;font-style:normal}
.hero{position:relative;border-radius:20px;overflow:hidden;color:#fff;background:linear-gradient(120deg,#0A1F18,#14463A 70%,#1d6b52);padding:20px 18px;min-height:178px;margin-bottom:6px}
.hero .big{position:absolute;right:14px;bottom:8px;font-size:92px;opacity:.9;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.hero .badge{margin-bottom:8px}
.hero h3{font-size:25px;line-height:1.15;margin:0 0 6px;max-width:68%}
.hero p{margin:0 0 12px;font-size:14px;max-width:62%;opacity:.92}
.hero .cta{background:var(--accent);color:#2a1d00;border:0;border-radius:999px;padding:10px 16px;font-weight:700}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:var(--line);padding:0}
.dots button.on{background:var(--brand)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:10px 0 8px}
.sec h2{margin:0;font-size:21px}
.sec button{background:none;border:0;color:var(--brand);font-weight:650;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column}
.gtile{position:relative;height:104px;display:grid;place-items:center;font-size:52px}
.gtile .save{position:absolute;left:8px;top:8px;background:var(--good);color:#fff;font-size:12px;border-radius:8px;padding:3px 8px}
.heart{position:absolute;right:8px;top:6px;background:none;border:0;font-size:24px;color:var(--muted);line-height:1;padding:2px}
.heart.on{color:#E5484D}
.gbody{padding:10px 12px 12px}
.gname{font-weight:700;line-height:1.2}
.cchip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;margin:6px 0 2px}
.quick{padding:6px 14px}
.qrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left;color:var(--ink)}
.qrow:last-child{border:0}
.qrow i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:20px;flex:none}
.qrow b{display:block}
.qrow span.s{color:var(--muted);font-size:13.5px;display:block}
.qrow em{margin-left:auto;font-style:normal;color:var(--muted)}
.own{background:linear-gradient(135deg,#0B4F37,#0F7B4B);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px}
.own h3{margin:0 0 4px;font-size:21px}
.own p{margin:0 0 12px;opacity:.92}
.own button{background:#fff;color:var(--deep);border:0;border-radius:999px;padding:11px 16px;font-weight:700;width:100%}
.nam{display:none;border-radius:20px;overflow:hidden;position:relative;margin-bottom:12px;height:150px;background:linear-gradient(#F6B26B,#E07B39 60%,#9C4A22)}
.nam svg{position:absolute;inset:0;width:100%;height:100%}
.nam div{position:absolute;left:16px;bottom:12px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.nam b{display:block;font:italic 700 30px Georgia,serif}
.recs{background:var(--chip);border-radius:20px;padding:12px;margin-bottom:12px}
.recs h2{font-size:18px;margin:0 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav div{max-width:720px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--brand);font-weight:700}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media (min-width:1000px){
  .home{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start}
  .nam{display:block}
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header><div class="hin">
<div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="6" width="52" height="52" rx="14" fill="#0F7B4B"/><path d="M16 35l17-17h14v14L30 49z" fill="#F7C531"/><circle cx="41" cy="23" r="4" fill="#0F7B4B"/></svg><div><b>Nam<span>Promo</span></b><small>Shop smarter. Save more.</small></div></div>
<label class="town" style="margin:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><select id="town" aria-label="Your town"></select></label>
<button id="bell" aria-label="Price alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/></svg><i id="belln" hidden></i></button>
</div></header>
<main id="app"></main>
<nav><div id="nav"></div></nav>
<script src="nampromo.js"></script>
</body>
</html>
