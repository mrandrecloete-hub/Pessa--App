<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NamPromo</title>
<meta name="description" content="Find specials and compare shop prices across Namibia.">
<meta name="theme-color" content="#0F5E4D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F5E4D'/%3E%3Cpath d='M16 34l16-16h14v14L30 48z' fill='%23F4B63F'/%3E%3Ccircle cx='40' cy='24' r='4' fill='%230F5E4D'/%3E%3C/svg%3E">
<style>
:root{--bg:#F6F4EE;--card:#fff;--ink:#17231F;--muted:#5D6B66;--line:#E3DFD3;--brand:#0F5E4D;--brand-ink:#fff;--accent:#F4B63F;--good:#13795B;--bad:#B3261E;--chip:#EAF2EE;--warn:#FFF4D6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101815;--card:#18231F;--ink:#EDF3F0;--muted:#9DB0A8;--line:#27372F;--brand:#2FA487;--brand-ink:#06201A;--chip:#1F2F29;--warn:#3A3115;--good:#4CC9A0;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#101815;--card:#18231F;--ink:#EDF3F0;--muted:#9DB0A8;--line:#27372F;--brand:#2FA487;--brand-ink:#06201A;--chip:#1F2F29;--warn:#3A3115;--good:#4CC9A0;--bad:#FF8A80}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1;letter-spacing:.2px}
header h1 span{color:var(--accent)}
header select{max-width:46%;font:inherit;font-size:14px;padding:6px 8px;border-radius:10px;border:0;background:rgba(255,255,255,.18);color:inherit}
header select option{color:#111}
main{max-width:720px;margin:0 auto;padding:12px 16px}
.demo{background:var(--warn);border:1px solid var(--accent);border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
h2{font-size:20px;margin:6px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
button{font:inherit;cursor:pointer}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:10px 14px;font-weight:650}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn.small{padding:7px 10px;font-size:14px}
.btn.block{width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.price{font-weight:750;font-size:20px}
.was{color:var(--muted);text-decoration:line-through;font-size:14px;margin-left:6px}
.badge{display:inline-block;background:var(--accent);color:#2a1d00;border-radius:8px;padding:2px 8px;font-size:12.5px;font-weight:700}
.badge.good{background:var(--good);color:#fff}
.tag{display:inline-block;background:var(--chip);border-radius:8px;padding:2px 8px;font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted);font-size:13.5px}
.best{border:2px solid var(--good)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--brand);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.x{background:none;border:0;color:var(--muted);font-size:20px;padding:4px 8px}
.alert-hit{border-left:5px solid var(--good)}
@media (min-width:900px){main{padding:20px}}
</style>
</head>
<body>
<header><h1>Nam<span>Promo</span></h1><select id="town" aria-label="Your town"></select></header>
<main id="app"></main>
<nav id="nav"></nav>
<script src="nampromo.js"></script>
</body>
</html>
